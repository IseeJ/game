<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuned In — how well can your friends read you?</title>
<meta name="description" content="One friend gets a secret spot on a scale and gives a clue. Everyone else guesses where it sits. Play over a call with a room code.">
<style>
:root {
  --bg: #0f1b2d;
  --panel: #18283f;
  --line: #2b3f5c;
  --ink: #f2f6fb;
  --dim: #93a4bd;
  --accent: #ff7a59;
  --cool: #4fd1c5;
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 16px; line-height: 1.4; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cool); outline-offset: 2px; }

.btn {
  appearance: none; border: 2px solid var(--line); background: transparent;
  font-weight: 700; padding: 10px 18px; border-radius: 999px; cursor: pointer;
  transition: transform .08s, background .15s, border-color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a0d08; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
.btn.big { padding: 14px 24px; font-size: 1.05rem; }
.btn.small { padding: 6px 14px; font-size: .9rem; }
.field { display: block; text-align: left; margin: 0 0 14px; }
.field span { display: block; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 6px; }
.field.inline { display: flex; align-items: center; gap: 12px; }
.field.inline span { margin: 0; }
.field.inline input { width: 72px; text-align: center; }
.field.inline em { font-style: normal; font-size: .85rem; }
input[type=text], input:not([type]), select { width: 100%; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; font-weight: 700; }
select { width: auto; }
input::placeholder { color: #5d7090; font-weight: 400; }

.howto { margin-top: 28px; }
.howto h2 { margin: 0; font-size: 1.1rem; }
.howto .note { margin: 2px 0 0; }
.step { background: var(--panel); border-radius: var(--radius); overflow: hidden; margin-top: 12px; }
.step svg { display: block; width: 100%; height: auto; background: #132238; }
.step svg text { font: 700 13px "Helvetica Neue", Helvetica, Arial, sans-serif; }
.step svg .s-sm { font-size: 11px; }
.step svg .s-cool { fill: var(--cool); }
.step svg .s-acc { fill: var(--accent); }
.step svg .s-ink { fill: var(--ink); }
.step svg .s-dim { fill: var(--dim); }
.step svg .s-dark { fill: #1a0d08; }
.step svg .s-bubble { fill: #263b5e; }
.step svg .s-track { stroke: var(--line); stroke-width: 2; }
.step svg .s-rail { stroke: var(--line); stroke-width: 4; stroke-linecap: round; }
.step svg .s-pin { stroke: var(--bg); stroke-width: 1.5; }
.step p { margin: 0; padding: 12px 14px 14px; display: flex; gap: 10px; font-size: .95rem; }
.step p b { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #1a0d08; display: grid; place-items: center; font-size: .8rem; }
.home, .lobby { max-width: 420px; margin: 0 auto; padding: 48px 20px 40px; display: flex; flex-direction: column; gap: 12px; }
.logo { font-size: clamp(3.2rem, 17vw, 5rem); line-height: .9; letter-spacing: -.04em; margin: 0; font-weight: 900; }
.logo i { font-style: normal; color: var(--accent); }
.tag { color: var(--dim); margin: 4px 0 20px; font-size: 1.05rem; }
.or { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: .85rem; margin: 8px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.joinrow { display: flex; gap: 10px; }
.joinrow input { text-transform: uppercase; letter-spacing: .3em; font-size: 1.2rem; text-align: center; }
.note { color: var(--dim); margin: 8px 0 0; }
.err { color: #ff8fa3; font-weight: 700; margin: 8px 0 0; }
.fine { color: var(--dim); font-size: .85rem; margin: 16px 0 0; }
.how { margin: 20px 0 0; padding: 0 0 0 20px; color: var(--dim); font-size: .92rem; }
.how li { margin-bottom: 4px; }
.lobby { text-align: center; align-items: center; }
.lobby > * { width: 100%; }
.lobby > .btn.small { width: auto; }
.eyebrow { margin: 0; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); }
.code { font-size: clamp(3rem, 16vw, 4.5rem); font-weight: 900; letter-spacing: .12em; color: var(--accent); line-height: 1; margin-bottom: 4px; }
.code.small { font-size: 2.2rem; letter-spacing: 0; }
.lobby h2 { margin: 24px 0 0; font-size: 1.1rem; text-align: left; }
.dim { color: var(--dim); font-weight: 400; }
.plist { list-style: none; margin: 0 0 16px; padding: 0; text-align: left; }
.plist li { padding: 12px 14px; background: var(--panel); border-radius: 12px; margin-top: 8px; font-weight: 700; }
.plist em { font-style: normal; font-weight: 400; font-size: .8rem; color: var(--dim); margin-left: 6px; }
.plist.rank li { display: flex; justify-content: space-between; }
.plist.rank li.top { background: var(--accent); color: #1a0d08; }

.bar { display: flex; justify-content: space-between; gap: 12px; padding: 12px 20px; font-size: .85rem; color: var(--dim); border-bottom: 1px solid var(--line); }
.bar b { color: var(--accent); letter-spacing: .1em; }
.scores { list-style: none; margin: 0; padding: 12px 20px; display: flex; gap: 8px; overflow-x: auto; }
.scores li { flex: none; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 2px solid transparent; border-radius: 999px; padding: 6px 8px 6px 14px; font-size: .9rem; }
.scores li.me .nm { text-decoration: underline; text-underline-offset: 3px; }
.scores li.giver { border-color: var(--accent); }
.scores li.off { opacity: .4; }
.scores .mk { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
.scores b { background: var(--bg); border-radius: 999px; min-width: 26px; text-align: center; padding: 2px 6px; }

.stage { max-width: 640px; margin: 0 auto; padding: 12px 20px 130px; }
.status { margin: 8px 0 0; font-size: 1.15rem; font-weight: 700; }
.tip { margin: 8px 0 0; color: var(--dim); font-size: .92rem; }

/* the scale */
.scale { margin: 26px 0 0; }
.ends { display: flex; justify-content: space-between; gap: 16px; font-weight: 900; font-size: 1.15rem; line-height: 1.15; }
.ends span { max-width: 46%; }
.ends span:last-child { text-align: right; color: var(--accent); }
.ends span:first-child { color: var(--cool); }
.track {
  position: relative; height: 64px; margin: 12px 0 0; border-radius: 12px; overflow: hidden;
  background: linear-gradient(90deg, rgba(79, 209, 197, .28), rgba(255, 122, 89, .28));
  border: 2px solid var(--line);
}
.band { position: absolute; top: 0; bottom: 0; }
.band.z2 { background: rgba(255, 255, 255, .16); }
.band.z3 { background: rgba(255, 255, 255, .3); }
.band.z4 { background: #fff; }
.pins { position: relative; height: 0; }
.pin { position: absolute; top: -70px; width: 4px; height: 70px; margin-left: -2px; background: var(--ink); border-radius: 2px; box-shadow: 0 0 0 1.5px var(--bg); }
.pin[data-pid] { transition: left .12s linear; }
.pin.ghost { opacity: .6; }
.pin.me { background: var(--accent); width: 6px; margin-left: -3px; }
.pin span { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); font-size: .72rem; font-weight: 700; white-space: nowrap; background: var(--panel); padding: 1px 6px; border-radius: 6px; }
.pin.up span { top: 92px; }
.pad { height: 44px; }
input[type=range] { width: 100%; margin: 6px 0 0; height: 44px; accent-color: var(--accent); background: none; border: 0; padding: 0; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 4px 0 0; font-size: .8rem; color: var(--dim); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.rows { list-style: none; margin: 18px 0 0; padding: 0; }
.rows li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--panel); border-radius: 12px; margin-top: 6px; }
.rows li b { color: var(--accent); }
.rows li.top { outline: 2px solid var(--accent); }
.story { margin: 18px 0 0; background: var(--panel); border: 2px solid var(--cool); border-radius: var(--radius); padding: 16px; }
.story p { margin: 0; }
.story .lbl { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--cool); margin-bottom: 6px; }
.action { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 799px) {
  .action:not(:empty) { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); z-index: 5; }
  .action .btn { flex: 1; }
}

.overlay { position: fixed; inset: 0; background: rgba(5, 10, 20, .8); display: grid; place-items: center; padding: 20px; z-index: 10; }
.dialog { background: var(--panel); border-radius: var(--radius); padding: 24px; max-width: 380px; }
.dialog h2 { margin: 0 0 8px; }
.dialog p { color: var(--dim); margin: 0 0 18px; }
#toast { position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 20px); background: var(--ink); color: #111; font-weight: 700; padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 40px); z-index: 20; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- PeerJS: browser-to-browser connections, no server of your own needed -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* =====================================================
   THE SCALES, in packs. Edit freely.
   Each line is one scale: ["left end", "right end"], with
   a comma after it (except the last line of a pack).
   The host picks a pack, or "Mixed", in the lobby. To add
   a pack of your own, copy one whole block and give it a
   new name: it shows up in the lobby by itself.
   ===================================================== */
const PACKS = {
  "Personal": [

    ["Normal", "Weird"],

    ["Just being friendly", "Definitely flirting"],

    ["Tell my parents", "Never tell my parents"],
    ["Tell my friends", "Never tell my friends"],
    ["Small talk", "Deep talk"],
    ["Relaxing", "Stressful"],
    ["Harmless lie", "Dealbreaker lie"],
    ["Unattractive habit", "Attractive habit"],
    ["Would deny it", "Would brag about it"],
    ["Introvert heaven", "Extrovert heaven"],
    ["Terrible gift", "Perfect gift"],
    ["Cringe", "Cool"],
    ["Too soon in a relationship", "About time"],
    ["Would do it for free", "Not for a million"],
    ["Sign of love", "Sign of trouble"],
    ["Needs an apology", "Needs a lawyer"],
    ["Forgotten in a week", "Remembered forever"],
    ["Keep it private", "Post it online"],
    ["Easy to give up", "Could never give up"],
    ["Happens to everyone", "Only happens to me"],
    ["Rock bottom", "Peak of my life"],
    ["Kid me would hate it", "Kid me would love it"],
    ["Gives me the ick", "Makes me swoon"],
    ["Would survive it", "Would not survive it"],
    ["Awful hangover food", "Perfect hangover food"],
    ["Fine at a wedding", "Banned from the wedding"],
    ["Bare Minimum", "Princess Treatment"],
    ["Boring", "Thrilling"],
    ["Safe", "Dangerous"],
    ["Rude", "Polite"],
    ["Smells awful", "Smells amazing"],
    ["Bad pet", "Great pet"],
    ["Morning thing", "Midnight thing"],
    ["Cheap date", "Expensive date"],
    ["Not my problem", "Keeps me up at night"],
    ["I'd tell my boss", "I'd tell nobody"],
    ["Would try once", "Would never try"],
    ["Low-key jealous", "Could not care less"],
    ["Smash", "Pass"],
    ["Controversial", "Uncontroversial"],
  ],

  "General": [
    ["Breakfast food", "Dinner food"],
    ["Belongs on a pizza", "Keep it off my pizza"],
    ["Barely a snack", "A full meal"],
    ["Comfort food", "Dare food"],
    ["Worth the calories", "Not worth the calories"],
    ["Lovely texture", "Horrible texture"],
    ["Needs a sequel", "Should never have been made"],
    ["Watch it alone", "Watch it with a crowd"],
    ["Makes me cry", "Makes me laugh"],
    ["Background music", "Stop everything and listen"],
    ["Karaoke disaster", "Karaoke gold"],
    ["Future classic", "Forgotten by next year"],
    ["Aged like milk", "Aged like wine"],
    ["All hype", "Worth the hype"],
    ["Peaked years ago", "Timeless"],
    ["Nostalgic", "Best left in the past"],
    ["Lost art", "Good riddance"],
    ["Tourist trap", "Hidden gem"],

    ["Take it to a desert island", "Leave it at home"],
    ["Nightmare job", "Dream job"],
    ["Could do it in my sleep", "Would need a year of training"],
    ["Born with it", "Had to learn it"],
    ["Real sport", "Just a hobby"],
    ["Down to skill", "Down to luck"],
    ["Rip-off", "Bargain"],
    ["Impulse buy", "Saved up for it"],
    ["Everyone has one", "Nobody needs one"],
    ["Quiet luxury", "Loud and proud"],

    ["Wear it to work", "Wear it to the club"],
    ["Cozy", "Creepy"],
    ["Cute", "Terrifying"],
    ["Would pet it", "Would run from it"],
    ["Soothing sound", "Unbearable sound"],
    ["Lucky", "Cursed"],
    ["Tiny problem", "Huge problem"],
    ["Easy to explain", "Impossible to explain"],
    ["Party killer", "Party starter"],
    ["Sunday morning", "Saturday night"],

    ["Zombie apocalypse liability", "Zombie apocalypse asset"],
    ["Would lose the fight", "Would win the fight"],

    ["Early bird", "Night owl"],
    ["Indoor person", "Outdoor person"],
    ["Planner", "Wing it"],
    ["Spender", "Saver"],
    ["Team player", "Lone wolf"],
    ["Talk it out", "Never mention it again"],
    ["Tidy", "Chaos"],
    ["Would read it", "Would never read it"],
    ["I ship them", "Not my cup of tea"],
    ["Would eat every day", "Would never eat it again"]
  ],

  "Spicy": [
    ["Wholesome", "Filthy"],
    ["Vanilla", "Kinky"],
    ["PG", "18+"],
    ["Sweet nothing", "Dirty talk"],
    ["Foreplay", "Mood killer"],
    ["Pillow talk", "Never say that in bed"],
    ["One-night stand", "Marriage material"],
    ["Situationship", "Soulmate"],
    ["Dump them", "Marry them"],
    ["I can fix them", "Run"],
    ["Would swipe left", "Would swipe right"],
    ["Would kiss", "Would rather die"],
    ["Hear me out", "Absolutely not"],
    ["Flirty", "Creepy"],
    ["Romantic", "Stalker behaviour"],
    ["Cute jealous", "Scary jealous"],
    ["Adorable quirk", "Toxic trait"],
    ["Hot", "Hot mess"],
    ["Delulu", "Realistic"],
    ["Soft launch", "Hard launch"],
    ["Meet the parents", "Hide from the parents"],
    ["Would stay friends", "Blocked on everything"],
    ["Would never text my ex", "Texting my ex right now"],
    ["Walk of shame", "Stride of pride"],
    ["Sexy job", "Unsexy job"],
    ["Good in bed", "Only thinks they're good in bed"],
    ["Big spoon", "Little spoon"],
    ["Sober thought", "Three-drinks thought"],
    ["Would whimper", "Would grunt"],
    ["Good idea at 2 p.m.", "Good idea at 2 a.m."],
    ["Cute drunk", "Messy drunk"],
    ["Great hangover story", "Never drinking again"],
    ["Worth the hangover", "Not worth the hangover"],
    ["Would do on a dare", "Would do unprompted"],
    ["Would do for love", "Would only do for money"],
    ["Would lie about it", "Would put it on my CV"],
    ["Safe to search", "Clear your history"],
    ["Tell my therapist", "Not even my therapist"],
    ["Cheeky", "Illegal"],
    ["Deserves a medal", "Deserves jail"],
    ["Mild take", "Start-a-fight take"],
    ["God willing", "God forbid"],
    ["Slay", "Flop"],

// Every pack together, for the "Mixed" setting.
const SCALES = [].concat(...Object.values(PACKS));

/* =====================================================
   THE GAME. The player who creates the room is the host:
   their browser holds the real game state and sends each
   player only what they are allowed to see. Only the clue
   giver is sent the target before the reveal.
   ===================================================== */
(() => {
  'use strict';

  const PREFIX = 'tunedin-v1-';
  const MIN_PLAYERS = 2, MAX_PLAYERS = 12;
  const MAX_LAPS = 20;                             // most clues each player can be set to give
  const LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const ZONES = [[4, 4], [10, 3], [17, 2]];        // [distance from target, points]
  const points = d => { for (const [w, p] of ZONES) if (d <= w) return p; return 0; };

  const $app = document.getElementById('app');
  const $toast = document.getElementById('toast');

  const load = (store, k) => { try { return window[store].getItem(k); } catch (e) { return null; } };
  const save = (store, k, v) => { try { window[store].setItem(k, v); } catch (e) {} };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const makeCode = () => Array.from({ length: 5 }, () => LETTERS[Math.floor(Math.random() * LETTERS.length)]).join('');
  const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 5);

  let myPid = load('sessionStorage', 'ti_pid');
  if (!myPid) { myPid = Math.random().toString(36).slice(2, 12); save('sessionStorage', 'ti_pid', myPid); }
  let myName = load('localStorage', 'ti_name') || '';
  let roomCode = cleanCode(new URLSearchParams(location.search).get('room'));

  let peer = null, hostConn = null, isHost = false;
  let G = null;        // full game state (host only)
  let view = null;     // what this player is allowed to see
  let busy = '', homeErr = '', lost = false, joinTimer = null;
  let myPos = 50, selKey = '';

  /* ---------------- HOST ---------------- */
  const P = pid => G.players.find(p => p.pid === pid);

  function createRoom() {
    isHost = true;
    const code = makeCode();
    busy = 'Creating room…'; render();
    peer = new Peer(PREFIX + code);
    peer.on('open', () => {
      busy = ''; roomCode = code;
      G = {
        code, phase: 'lobby', laps: 2,
        giverScores: load('localStorage', 'ti_gscore') !== '0',     // lobby settings start as the host last left them
        live: load('localStorage', 'ti_live') === '1',
        pack: PACKS[load('localStorage', 'ti_pack')] ? load('localStorage', 'ti_pack') : '',     // '' means Mixed
        total: 0, round: 0, hostPid: myPid,
        players: [{ pid: myPid, name: myName, score: 0, guess: null, pos: null, pts: 0, conn: null, connected: true }],
        giverPid: null, scale: null, target: null, gain: 0, deck: []
      };
      setRoomUrl(code);
      sync();
    });
    peer.on('connection', conn => {
      conn.on('data', msg => {
        if (!G || !msg || typeof msg !== 'object') return;
        if (msg.t === 'join') hostJoin(conn, msg);
        else if (conn.pid) handle(conn.pid, msg);
      });
      conn.on('close', () => hostLeave(conn));
      conn.on('error', () => hostLeave(conn));
    });
    peer.on('error', err => {
      if (err.type === 'unavailable-id') { peer.destroy(); createRoom(); }
      else if (!G) { peer.destroy(); busy = ''; homeErr = 'Could not reach the connection server. Check your internet and try again.'; render(); }
    });
    peer.on('disconnected', () => { if (peer && !peer.destroyed) peer.reconnect(); });
  }

  function hostJoin(conn, msg) {
    const pid = String(msg.pid || '').slice(0, 20);
    const name = String(msg.name || '').trim().slice(0, 16) || 'Player';
    if (!pid) return;
    let p = P(pid);
    if (p) {                                   // same player coming back
      if (p.pid === G.hostPid) return;
      const old = p.conn;
      p.conn = conn; p.connected = true; p.name = name;
      if (old && old !== conn) { try { old.close(); } catch (e) {} }
    } else {
      if (G.players.length >= MAX_PLAYERS) { conn.send({ t: 'full' }); return; }
      G.players.push({ pid, name, score: 0, guess: null, pos: null, pts: 0, conn, connected: true });
    }
    conn.pid = pid;
    sync();
  }

  function hostLeave(conn) {
    if (!G || !conn.pid) return;
    const p = P(conn.pid);
    if (!p || p.conn !== conn) return;
    p.conn = null; p.connected = false;
    if (G.phase === 'lobby') { G.players = G.players.filter(x => x !== p); sync(); return; }
    if (p.pid === G.giverPid && G.phase === 'clue') {
      toastAll(p.name + ' (the clue giver) dropped out. Moving on.');
      nextRound(); return;
    }
    if (G.phase === 'clue') maybeReveal();
    sync();
  }

  // The scales in play: one pack, or all of them when the setting is "Mixed".
  const scales = () => (G.pack && PACKS[G.pack] && PACKS[G.pack].length) ? PACKS[G.pack] : SCALES;

  function deal() {
    if (!G.deck.length) G.deck = shuffle(scales());
    G.scale = G.deck.pop();
    G.target = 5 + Math.floor(Math.random() * 91);          // 5 to 95
    G.players.forEach(p => { p.pos = null; });              // sliders start again in the middle
  }

  function startGame() {
    G.players = G.players.filter(p => p.connected);
    G.players.forEach(p => { p.score = 0; });
    G.deck = shuffle(scales());
    G.round = 0; G.giverPid = null;
    G.total = G.laps * G.players.length;
    startRound();
  }

  function nextRound() {
    if (G.round >= G.total) { G.phase = 'gameover'; sync(); }
    else startRound();
  }

  function startRound() {
    const live = G.players.filter(p => p.connected);
    if (live.length < 2) {
      G.players = live; G.phase = 'lobby';
      toastAll('Not enough players left. Back to the lobby.');
      sync(); return;
    }
    const n = G.players.length;
    const cur = G.players.findIndex(p => p.pid === G.giverPid);
    for (let i = 1; i <= n; i++) {
      const cand = G.players[(cur + i + n) % n];
      if (cand.connected) { G.giverPid = cand.pid; break; }
    }
    G.players.forEach(p => { p.guess = null; p.pts = 0; });
    deal();
    G.gain = 0;
    G.round++;
    G.phase = 'clue';
    sync();
  }

  function maybeReveal() {
    const need = G.players.filter(p => p.connected && p.pid !== G.giverPid);
    if (need.length && need.every(p => p.guess !== null)) reveal();
  }

  // Guessers score by distance. If the lobby setting is on, the clue giver gets the
  // average of their scores, so clear clues pay.
  function reveal() {
    const gs = G.players.filter(p => p.guess !== null);
    gs.forEach(p => { p.pts = points(Math.abs(p.guess - G.target)); p.score += p.pts; });
    G.gain = (G.giverScores && gs.length) ? Math.round(gs.reduce((s, p) => s + p.pts, 0) / gs.length) : 0;
    const g = P(G.giverPid); if (g) g.score += G.gain;
    G.phase = 'reveal';
  }

  // Every player action lands here (the host's own actions too).
  function handle(pid, msg) {
    const p = P(pid);
    if (!p) return;
    const amHost = pid === G.hostPid, amGiver = pid === G.giverPid;
    switch (msg.t) {
      case 'laps':
        if (amHost && G.phase === 'lobby') { G.laps = Math.min(MAX_LAPS, Math.max(1, parseInt(msg.laps, 10) || 2)); sync(); }
        break;
      case 'giverScores':
        if (amHost && G.phase === 'lobby') { G.giverScores = !!msg.on; sync(); }
        break;
      case 'pack':
        if (amHost && G.phase === 'lobby') { G.pack = PACKS[msg.pack] ? msg.pack : ''; sync(); }
        break;
      case 'watch':
        if (amHost && G.phase === 'lobby') { G.live = !!msg.on; sync(); }
        break;
      case 'pos': {                             // a guesser's slider moved: pass it on to the clue giver only
        const n = Math.round(Number(msg.pos));
        if (!G.live || G.phase !== 'clue' || amGiver || p.guess !== null || !(n >= 0 && n <= 100)) return;
        p.pos = n;
        const m = { t: 'live', pid, pos: n }, g = P(G.giverPid);
        if (G.giverPid === myPid) onLive(m);
        else if (g && g.conn && g.conn.open) { try { g.conn.send(m); } catch (e) {} }
        break;
      }
      case 'start':
        if (amHost && (G.phase === 'lobby' || G.phase === 'gameover') &&
            G.players.filter(x => x.connected).length >= MIN_PLAYERS) startGame();
        break;
      case 'swap':                              // the clue giver can ask for a new scale before anyone guesses
        if (G.phase === 'clue' && amGiver && !G.players.some(x => x.guess !== null)) { deal(); sync(); }
        break;
      case 'guess': {
        const n = Math.round(Number(msg.pos));
        if (G.phase !== 'clue' || amGiver || p.guess !== null || !(n >= 0 && n <= 100)) return;
        p.guess = n;
        maybeReveal();
        sync();
        break;
      }
      case 'reveal':                            // don't wait for stragglers
        if (G.phase === 'clue' && (amGiver || amHost) && G.players.some(x => x.guess !== null)) { reveal(); sync(); }
        break;
      case 'next':
        if (G.phase === 'reveal' && (amHost || amGiver)) nextRound();
        break;
      case 'lobby':
        if (amHost && G.phase === 'gameover') {
          G.players = G.players.filter(x => x.connected);
          G.players.forEach(x => { x.score = 0; });
          G.phase = 'lobby'; sync();
        }
        break;
    }
  }

  function viewFor(pid) {
    const me = P(pid), open = G.phase === 'reveal';
    const watch = G.live && G.phase === 'clue' && pid === G.giverPid;   // only the clue giver gets slider positions
    return {
      code: G.code, phase: G.phase, laps: G.laps, giverScores: G.giverScores, live: G.live, pack: G.pack, total: G.total, round: G.round,
      you: pid, hostPid: G.hostPid, giverPid: G.giverPid, scale: G.scale,
      target: (open || pid === G.giverPid) ? G.target : null,
      gain: G.gain, myGuess: me ? me.guess : null,
      players: G.players.map(p => ({
        pid: p.pid, name: p.name, score: p.score, connected: p.connected,
        done: p.guess !== null, guess: open ? p.guess : null, pts: open ? p.pts : 0,
        pos: (watch && p.pid !== G.giverPid && (p.connected || p.guess !== null))
          ? (p.guess !== null ? p.guess : (p.pos !== null ? p.pos : 50)) : null
      }))
    };
  }

  function sync() {
    G.players.forEach(p => {
      if (p.conn && p.conn.open) { try { p.conn.send({ t: 'state', v: viewFor(p.pid) }); } catch (e) {} }
    });
    view = viewFor(myPid);
    render();
  }

  function toastAll(text) {
    G.players.forEach(p => { if (p.conn && p.conn.open) { try { p.conn.send({ t: 'toast', text }); } catch (e) {} } });
    toast(text);
  }

  /* ---------------- GUEST ---------------- */
  function joinRoom(code) {
    isHost = false; roomCode = code;
    busy = 'Joining ' + code + '…'; render();
    peer = new Peer();
    joinTimer = setTimeout(() => joinFail('Could not find that room. Check the code and make sure the host still has the game open.'), 15000);
    peer.on('open', () => connectHost());
    peer.on('error', err => {
      if (err.type === 'peer-unavailable') {
        if (view) { lost = true; render(); }
        else joinFail('No room with that code. Check it and try again.');
      } else if (!view) joinFail('Connection problem. Check your internet and try again.');
    });
    peer.on('disconnected', () => { if (peer && !peer.destroyed) peer.reconnect(); });
  }

  function connectHost() {
    const conn = peer.connect(PREFIX + roomCode, { reliable: true });
    hostConn = conn;
    conn.on('open', () => conn.send({ t: 'join', pid: myPid, name: myName }));
    conn.on('data', msg => {
      if (!msg || conn !== hostConn) return;
      if (msg.t === 'state') {
        clearTimeout(joinTimer); busy = ''; lost = false;
        if (!view) setRoomUrl(roomCode);
        view = msg.v; render();
      } else if (msg.t === 'live') onLive(msg);
      else if (msg.t === 'toast') toast(msg.text);
      else if (msg.t === 'full') joinFail('That room is full.');
    });
    conn.on('close', () => { if (conn === hostConn && view) { lost = true; render(); } });
  }

  function joinFail(text) {
    clearTimeout(joinTimer);
    if (peer) { try { peer.destroy(); } catch (e) {} }
    peer = null; hostConn = null; view = null; busy = ''; homeErr = text;
    render();
  }

  // Clue giver only: one guesser's slider moved. Slide their pin without redrawing the screen.
  function onLive(msg) {
    if (!view || view.phase !== 'clue' || view.you !== view.giverPid) return;
    const pl = view.players.find(x => x.pid === msg.pid);
    if (!pl || pl.done) return;
    pl.pos = msg.pos;
    const pin = [...$app.querySelectorAll('.pin[data-pid]')].find(el => el.dataset.pid === msg.pid);
    if (pin) pin.style.left = msg.pos + '%'; else render();
  }

  function act(msg) {
    if (isHost) handle(myPid, msg);
    else if (hostConn && hostConn.open) hostConn.send(msg);
  }

  /* ---------------- RENDERING ---------------- */
  function setRoomUrl(code) {
    try { history.replaceState(null, '', location.pathname + '?room=' + code); } catch (e) {}
  }
  const shareUrl = () => location.origin + location.pathname + '?room=' + view.code;

  let toastTimer = null;
  function toast(text) {
    $toast.textContent = text; $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove('show'), 3500);
  }

  function render() {
    if (!view) { $app.innerHTML = homeHTML(); return; }
    const key = view.round + ':' + view.phase + ':' + (view.scale ? view.scale.join('|') : '');
    const same = key === selKey;
    if (!same) { selKey = key; myPos = 50; }
    // Someone else locking in must not yank the slider out of a player's fingers:
    // while I am still choosing, only the score strip is refreshed.
    if (same && !lost && view.phase === 'clue' && view.myGuess === null && document.getElementById('dial')) {
      const s = $app.querySelector('.scores');
      if (s) s.outerHTML = scoresHTML();
      return;
    }
    let html = view.phase === 'lobby' ? lobbyHTML() : view.phase === 'gameover' ? overHTML() : gameHTML();
    if (lost) {
      html += '<div class="overlay"><div class="dialog"><h2>Connection lost</h2>' +
        '<p>The link to the host dropped. If the host closed the game, the room is gone.</p>' +
        '<div class="row"><button class="btn primary" data-act="reconnect">Try to reconnect</button>' +
        '<button class="btn" data-act="leave">Leave</button></div></div></div>';
    }
    // keep the cursor in place if the screen refreshes while the host is typing
    const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
    $app.innerHTML = html;
    if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
  }

  // The "how to play" pictures on the home screen. They are drawn as SVG so the game stays one file.
  const HOWTO = `

      <div class="step">

          <text x="178" y="51" text-anchor="middle" class="s-ink">“Eating all my</text>
          <text x="178" y="69" text-anchor="middle" class="s-ink">cat's food”</text>
        </svg>
        <p><b>2</b><span>They say one clue out loud that belongs at that spot. Personal clues are the best ones.</span></p>
      </div>

      <div class="step">
        <svg viewBox="0 0 280 110" aria-hidden="true">
          <text x="16" y="22" class="s-cool">Forgivable</text>

          <rect x="197" y="27" width="5" height="48" rx="2" class="s-acc"/>
          <line x1="20" y1="92" x2="260" y2="92" class="s-rail"/>

        </svg>

      </div>

      <div class="step">
        <svg viewBox="0 0 280 110" aria-hidden="true">
          <text x="16" y="20" class="s-cool s-sm">Forgivable</text>
          <text x="264" y="20" text-anchor="end" class="s-acc s-sm">Unforgivable</text>
          <rect x="16" y="28" width="248" height="44" rx="9" fill="url(#howgrad)" class="s-track"/>
          <rect x="138" y="29" width="84" height="42" fill="#fff" opacity=".16"/>
          <rect x="155" y="29" width="50" height="42" fill="#fff" opacity=".3"/>
          <rect x="170" y="29" width="20" height="42" fill="#fff"/>
          <rect x="68" y="23" width="5" height="54" rx="2" class="s-ink s-pin"/>
          <rect x="140" y="23" width="5" height="54" rx="2" class="s-ink s-pin"/>
          <rect x="179" y="23" width="6" height="54" rx="2" class="s-acc s-pin"/>
          <text x="70" y="96" text-anchor="middle" class="s-dim s-sm">Peach 0</text>
          <text x="140" y="96" text-anchor="middle" class="s-ink s-sm">Moji +2</text>
          <text x="186" y="96" text-anchor="middle" class="s-acc s-sm">You +4</text>
        </svg>
        <p><b>4</b><span>The target is revealed. Closer guesses score more, and the clue giver tells the story behind the clue.</span></p>
      </div>
    </section>`;

  function homeHTML() {
    const dis = busy ? ' disabled' : '';
    return '<main class="home">' +
      '<h1 class="logo">Tuned<br>In<i>.</i></h1>' +
      '<p class="tag">One clue. One scale. How well do your friends read you?</p>' +
      '<label class="field"><span>Your name</span>' +
      '<input id="name" maxlength="16" autocomplete="off" placeholder="e.g. Preme" value="' + esc(myName) + '"' + dis + '></label>' +
      '<button class="btn primary big" data-act="create"' + dis + '>Create a room</button>' +
      '<div class="or"><span>or join with a code</span></div>' +
      '<div class="joinrow"><input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" value="' + esc(roomCode) + '"' + dis + '>' +
      '<button class="btn big" data-act="join"' + dis + '>Join</button></div>' +
      (busy ? '<p class="note">' + esc(busy) + '</p>' : '') +
      (homeErr ? '<p class="err">' + esc(homeErr) + '</p>' : '') +
      HOWTO +
      '</main>';
  }

  function lobbyHTML() {
    const v = view, amHost = v.you === v.hostPid, n = v.players.length;
    return '<main class="lobby">' +
      '<p class="eyebrow">Room code</p>' +
      '<div class="code">' + esc(v.code) + '</div>' +
      '<button class="btn small" data-act="copy">Copy invite link</button>' +
      '<h2>Players <span class="dim">' + n + '/' + MAX_PLAYERS + '</span></h2>' +
      '<ul class="plist">' + v.players.map(p =>
        '<li>' + esc(p.name) + (p.pid === v.hostPid ? ' <em>host</em>' : '') + (p.pid === v.you ? ' <em>you</em>' : '') + '</li>').join('') + '</ul>' +
      (amHost
        ? '<label class="field inline"><span>Clues each</span>' +
          '<input id="laps" type="text" inputmode="numeric" maxlength="2" autocomplete="off" value="' + v.laps + '">' +
          '<em class="dim">1 to ' + MAX_LAPS + ' · ' + (v.laps * n) + ' rounds</em></label>' +
          '<label class="field inline"><span>Scales</span><select id="pack">' +
          '<option value=""' + (v.pack ? '' : ' selected') + '>Mixed (' + SCALES.length + ')</option>' +
          Object.keys(PACKS).map(k => '<option value="' + esc(k) + '"' + (v.pack === k ? ' selected' : '') + '>' + esc(k) + ' (' + PACKS[k].length + ')</option>').join('') +
          '</select></label>' +
          '<label class="field inline"><span>Clue giver scores</span><select id="gscore">' +
          '<option value="1"' + (v.giverScores ? ' selected' : '') + '>Yes, the average guess</option>' +
          '<option value="0"' + (v.giverScores ? '' : ' selected') + '>No, only guessers</option></select></label>' +
          '<label class="field inline"><span>Guesses</span><select id="watch">' +
          '<option value="0"' + (v.live ? '' : ' selected') + '>Hidden until the reveal</option>' +
          '<option value="1"' + (v.live ? ' selected' : '') + '>Clue giver sees them live</option></select></label>' +
          '<button class="btn primary big" data-act="start"' + (n < MIN_PLAYERS ? ' disabled' : '') + '>' +
          (n < MIN_PLAYERS ? 'Need ' + (MIN_PLAYERS - n) + ' more player' + (MIN_PLAYERS - n > 1 ? 's' : '') : 'Start game') + '</button>' +
          '<p class="fine">Keep this tab open. You are hosting, so the room closes if you leave.</p>'
        : '<p class="note">Waiting for the host to start. Everyone gives ' + v.laps + ' clue' + (v.laps > 1 ? 's' : '') + '. ' +
          (v.giverScores ? 'The clue giver scores the average of the guesses.' : 'Only guessers score.') + ' ' +
          (v.live ? 'The clue giver can watch the sliders live.' : 'Guesses are hidden until the reveal.') +
          ' Scales: ' + (v.pack ? esc(v.pack) : 'Mixed') + '.</p>') +
      '</main>';
  }

  function scoresHTML() {
    const v = view;
    return '<ul class="scores">' + v.players.map(p => {
      const giver = p.pid === v.giverPid;
      const mark = giver ? 'clue giver' : (v.phase === 'clue' && p.done ? '✓' : '');
      return '<li class="' + (giver ? 'giver ' : '') + (p.connected ? '' : 'off ') + (p.pid === v.you ? 'me' : '') + '">' +
        '<span class="nm">' + esc(p.name) + '</span>' +
        (mark ? '<span class="mk">' + mark + '</span>' : '') +
        '<b>' + p.score + '</b></li>';
    }).join('') + '</ul>';
  }

  // The scale: two ends, an optional target with its scoring zones, and any pins.
  function scaleHTML(target, pins) {
    const v = view;
    let bands = '';
    if (target !== null) {
      ZONES.slice().reverse().forEach(([w, p]) => {
        bands += '<div class="band z' + p + '" style="left:' + (target - w) + '%;width:' + (2 * w) + '%"></div>';
      });
    }
    return '<div class="scale"><div class="ends"><span>' + esc(v.scale[0]) + '</span><span>' + esc(v.scale[1]) + '</span></div>' +
      '<div class="track">' + bands + '</div>' +
      '<div class="pins">' + pins.map((p, i) =>
        '<div class="pin' + (p.me ? ' me' : '') + (p.ghost ? ' ghost' : '') + (i % 2 ? ' up' : '') + '"' + (p.id ? ' id="' + p.id + '"' : '') +
        (p.pid ? ' data-pid="' + esc(p.pid) + '"' : '') + ' style="left:' + p.pos + '%">' +
        (p.label ? '<span>' + esc(p.label) + '</span>' : '') + '</div>').join('') + '</div>' +
      (pins.some(p => p.label) ? '<div class="pad"></div>' : '') + '</div>';
  }
  const legend = '<p class="legend"><span><i style="background:#fff"></i>4 points</span>' +
    '<span><i style="background:rgba(255,255,255,.45)"></i>3 points</span>' +
    '<span><i style="background:rgba(255,255,255,.2)"></i>2 points</span></p>';

  function gameHTML() {
    const v = view;
    const amGiver = v.you === v.giverPid, amHost = v.you === v.hostPid;
    const name = pid => { const p = v.players.find(x => x.pid === pid); return p ? p.name : 'Someone'; };
    const giver = esc(name(v.giverPid));
    const guessers = v.players.filter(p => p.pid !== v.giverPid && (p.connected || p.done));
    const locked = guessers.filter(p => p.done).length;
    let body = '', action = '';

    if (v.phase === 'clue') {
      if (amGiver) {
        body = '<p class="status">Only you can see the target. Say some clues that belong right there.</p>' +
          '<p class="tip">Make it personal: something you\'ve done, own, love or can\'t stand. Don\'t use the words on the scale, and don\'t hint at left or right.</p>' +
          (v.live ? '<p class="tip">You can watch their sliders move while they decide. Faded pins are not locked in yet.</p>' : '') +
          scaleHTML(v.target, v.live ? v.players.filter(p => typeof p.pos === 'number').map(p =>
            ({ pos: p.pos, pid: p.pid, ghost: !p.done, label: p.name + (p.done ? ' ✓' : '') })) : []) + legend;
        action = (locked === 0 ? '<button class="btn" data-act="swap">Different scale</button>' : '') +
          '<button class="btn primary big" data-act="reveal"' + (locked ? '' : ' disabled') + '>Reveal (' + locked + ' of ' + guessers.length + ' locked in)</button>';
      } else if (v.myGuess !== null) {
        body = '<p class="status">Locked in. Waiting on ' + (guessers.length - locked) + ' more.</p>' +
          scaleHTML(null, [{ pos: v.myGuess, me: true, label: 'You' }]);
        if (amHost) action = '<button class="btn" data-act="reveal">Reveal now</button>';
      } else {
        body = '<p class="status">Listen to ' + giver + '\'s clue. Where on the scale does it sit for them?</p>' +
          '<p class="tip">Talk it over, then slide and lock in. ' + (v.live
            ? giver + ' can see your slider move. The other guessers can\'t.'
            : 'Guesses stay hidden until the reveal.') + '</p>' +
          scaleHTML(null, [{ pos: myPos, me: true, id: 'me' }]) +
          '<input type="range" id="dial" min="0" max="100" step="1" value="' + myPos + '" aria-label="Your guess">';
        action = '<button class="btn primary big" data-act="guess">Lock in</button>';
      }
    } else {
      const gs = v.players.filter(p => p.guess !== null).sort((a, b) => b.pts - a.pts || Math.abs(a.guess - v.target) - Math.abs(b.guess - v.target));
      const best = gs.length ? gs[0].pts : 0;
      body = '<p class="status">' + (v.giverScores
          ? (best === 4 ? 'Bullseye. ' : best ? '' : 'Nobody was close. ') + giver + ' scores ' + v.gain + ' for the clue.'
          : (best === 4 ? 'Bullseye.' : best ? 'Close.' : 'Nobody was close.')) + '</p>' +
        scaleHTML(v.target, gs.map(p => ({ pos: p.guess, me: p.pid === v.you, label: p.name }))) + legend +
        '<ul class="rows">' + gs.map(p => '<li class="' + (p.pts === 4 ? 'top' : '') + '"><span>' + esc(p.name) + '</span><span>' +
          Math.abs(p.guess - v.target) + ' away · <b>+' + p.pts + '</b></span></li>').join('') + '</ul>';
      if (amGiver || amHost) action = '<button class="btn primary big" data-act="next">' + (v.round >= v.total ? 'See final scores' : 'Next round') + '</button>';
    }

    return '<header class="bar"><span>Room <b>' + esc(v.code) + '</b></span><span>Round ' + v.round + ' of ' + v.total + '</span></header>' +
      scoresHTML() +
      '<main class="stage">' + body + '<div class="action">' + action + '</div></main>';
  }

  function overHTML() {
    const v = view, amHost = v.you === v.hostPid;
    const ranked = v.players.slice().sort((a, b) => b.score - a.score);
    // Everyone on the top score shares the win, and equal scores share a place.
    const winners = ranked.filter(p => p.score === ranked[0].score).map(p => esc(p.name));
    const headline = winners.length === 1 ? winners[0] + ' wins'
      : (winners.length === ranked.length && ranked.length > 2) ? 'Everyone ties'
      : winners.slice(0, -1).join(', ') + ' and ' + winners[winners.length - 1] + ' tie';
    const place = p => ranked.findIndex(x => x.score === p.score) + 1;
    return '<main class="lobby">' +
      '<p class="eyebrow">Game over</p>' +
      '<div class="code small">' + headline + '</div>' +
      '<ul class="plist rank">' + ranked.map(p =>
        '<li class="' + (place(p) === 1 ? 'top' : '') + '"><span>' + place(p) + '. ' + esc(p.name) + '</span><b>' + p.score + '</b></li>').join('') + '</ul>' +
      (amHost
        ? '<button class="btn primary big" data-act="start"' + (v.players.filter(p => p.connected).length < MIN_PLAYERS ? ' disabled' : '') + '>Play again</button>' +
          '<button class="btn" data-act="lobby">Back to lobby</button>'
        : '<p class="note">Waiting for the host to start another game.</p>') +
      '</main>';
  }

  /* ---------------- EVENTS ---------------- */
  // Tell the clue giver where my slider is, at most about twelve times a second.
  let posTimer = null;
  function sharePos() {
    if (!view.live || posTimer) return;
    posTimer = setTimeout(() => {
      posTimer = null;
      if (view && view.phase === 'clue' && view.myGuess === null) act({ t: 'pos', pos: myPos });
    }, 80);
  }

  function readName() {
    myName = myName.trim().slice(0, 16);
    if (!myName) { homeErr = 'Pick a name first.'; render(); return false; }
    save('localStorage', 'ti_name', myName);
    homeErr = '';
    return true;
  }

  $app.addEventListener('input', e => {
    if (e.target.id === 'name') myName = e.target.value;
    if (e.target.id === 'code') { roomCode = cleanCode(e.target.value); e.target.value = roomCode; }
    if (e.target.id === 'laps') {              // typed, not picked: digits only, capped at the maximum
      const digits = e.target.value.replace(/\D/g, '');
      const n = Math.min(MAX_LAPS, parseInt(digits, 10) || 0);
      e.target.value = n ? String(n) : '';
      if (n) act({ t: 'laps', laps: n });
    }
    if (e.target.id === 'dial') {
      myPos = parseInt(e.target.value, 10);
      const pin = document.getElementById('me');
      if (pin) pin.style.left = myPos + '%';
      sharePos();
    }
  });
  $app.addEventListener('change', e => {
    if (e.target.id === 'gscore') { save('localStorage', 'ti_gscore', e.target.value); act({ t: 'giverScores', on: e.target.value === '1' }); }
    if (e.target.id === 'pack') { save('localStorage', 'ti_pack', e.target.value); act({ t: 'pack', pack: e.target.value }); }
    if (e.target.id === 'watch') { save('localStorage', 'ti_live', e.target.value); act({ t: 'watch', on: e.target.value === '1' }); }
    if (e.target.id === 'laps' && !e.target.value) e.target.value = view.laps;   // left empty: put the current number back
  });
  $app.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'code') go('join');
  });
  $app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el && !el.disabled) go(el.dataset.act, el);
  });

  function go(a) {
    switch (a) {
      case 'create':
        if (typeof Peer === 'undefined') { homeErr = 'The connection library did not load. Refresh the page.'; render(); return; }
        if (readName()) createRoom();
        break;
      case 'join':
        if (typeof Peer === 'undefined') { homeErr = 'The connection library did not load. Refresh the page.'; render(); return; }
        if (!readName()) return;
        if (roomCode.length !== 5) { homeErr = 'Room codes are 5 letters.'; render(); return; }
        joinRoom(roomCode);
        break;
      case 'copy': {
        const url = shareUrl();
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => toast('Invite link copied.'), () => prompt('Copy this link:', url));
        else prompt('Copy this link:', url);
        break;
      }
      case 'start': act({ t: 'start' }); break;
      case 'lobby': act({ t: 'lobby' }); break;
      case 'swap': act({ t: 'swap' }); break;
      case 'guess': act({ t: 'guess', pos: myPos }); break;
      case 'reveal': act({ t: 'reveal' }); break;
      case 'next': act({ t: 'next' }); break;
      case 'reconnect':
        toast('Reconnecting…');
        if (peer && peer.disconnected && !peer.destroyed) peer.reconnect();
        if (peer && !peer.destroyed) connectHost();
        break;
      case 'leave': location.href = location.pathname; break;
    }
  }

  window.addEventListener('beforeunload', e => {
    if (isHost && G && G.players.length > 1) { e.preventDefault(); e.returnValue = ''; }
  });

  render();
})();
</script>
</body>
</html>
