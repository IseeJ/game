<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Look Closer</title>
<meta name="description" content="Twenty small rooms. Nobody tells you the rules. Look around.">
<style>
:root { --bg: #f6f3ed; --panel: #ece7de; --field: #fcfbf8; --line: #d8d1c4; --ink: #23211e; --dim: #7a7368; --ok: #2f9b65; --no: #b4532f; --c0: #2c6e68; --c1: #23211e; --c2: #b4532f; --c3: #c08a2b; --c4: #5b6fa8; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); min-height: 100vh; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; font-size: .85rem; color: var(--dim); }
.bar b { color: var(--ink); letter-spacing: .02em; }
#lvno { background: none; border: 0; padding: 4px 6px; margin: -4px -6px; font-weight: 800; letter-spacing: .12em; color: var(--dim); border-radius: 6px; }
.mark { display: flex; justify-content: center; gap: 9px; padding: 18px 0 6px; }
.mark i { width: 14px; height: 14px; border-radius: 50%; transition: transform .15s, box-shadow .15s; }
.mark i.lit { transform: scale(1.9); box-shadow: 0 0 0 5px rgba(35, 33, 30, .08); }
.stage { max-width: 380px; margin: 0 auto; padding: 14px 20px 30px; text-align: center; transition: opacity .25s; }
.stage.won { opacity: .35; pointer-events: none; }
.cap { min-height: 1.4em; margin: 6px 0 22px; color: var(--dim); font-size: 1.05rem; }
.msg { min-height: 1.4em; margin: 14px 0 0; color: var(--no); font-weight: 700; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-7px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
.tick { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
.tick span { width: 110px; height: 110px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 3.4rem; font-weight: 900; display: grid; place-items: center; animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.foot { max-width: 380px; margin: 0 auto; padding: 0 20px 34px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.steps { display: grid; grid-template-columns: repeat(10, 12px); gap: 6px; justify-content: center; }
.steps button { width: 12px; height: 12px; padding: 0; border-radius: 50%; border: 2px solid var(--line); background: none; }
.steps button.done { background: var(--line); }
.steps button.now { border-color: var(--ink); background: var(--ink); }
.steps button:disabled { cursor: default; opacity: .6; }
.hint { background: none; border: 0; padding: 0; color: var(--dim); font-size: .88rem; text-decoration: underline; }

.big { display: block; width: 100%; padding: 15px 18px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 800; font-size: 1.05rem; }
.big.ghost { background: var(--panel); color: var(--dim); }
.word { width: 100%; padding: 14px 18px; text-align: center; font-size: 1.1rem; background: var(--field); border: 2px solid var(--line); border-radius: 999px; margin-bottom: 10px; }
.word:focus { border-color: var(--ink); outline: none; }

/* pattern */
.pad { display: block; width: min(100%, 300px); margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 28px; background: var(--panel); }
.pad .ring { fill: transparent; stroke: transparent; stroke-width: 3; }
.pad .pip { fill: var(--line); }
.pad .dot.on .pip { fill: var(--ink); r: 11px; }
.pad .dot.on .ring { stroke: var(--ink); fill: rgba(35, 33, 30, .06); }
.pad .trail, .pad .lead { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.pad .lead { opacity: .35; }
.pad.bad .trail { stroke: var(--no); } .pad.bad .dot.on .pip { fill: var(--no); } .pad.bad .dot.on .ring { stroke: var(--no); }
/* counting */
.field { position: relative; height: 190px; background: var(--panel); border-radius: 22px; margin-bottom: 16px; }
.field i { position: absolute; width: 18px; height: 18px; border-radius: 50%; }
.counters { display: flex; gap: 8px; }
.counter { flex: 1; display: flex; align-items: center; justify-content: space-between; padding: 6px; border-radius: 999px; color: #fff; font-weight: 800; }
.counter button { width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .25); color: #fff; font-weight: 900; }
/* tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tiles button { height: 86px; border: 2px solid var(--line); border-radius: 16px; background: var(--field); font-weight: 800; font-size: 1.15rem; transition: background .12s, color .12s; }
.tiles button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
/* scroll */
.deep { height: 230vh; }
.tiny { margin: 0 0 40px; color: var(--line); font-size: .8rem; letter-spacing: .3em; }
/* switches */
.sum { font-size: 4rem; font-weight: 900; letter-spacing: -.04em; line-height: 1; margin-bottom: 18px; }
.fuses { display: flex; justify-content: center; gap: 10px; padding: 18px 12px 10px; background: var(--panel); border-radius: 18px; }
.fuses div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .68rem; color: var(--dim); font-weight: 700; }
.sw { width: 38px; height: 84px; padding: 5px; border: 0; border-radius: 12px; background: var(--line); display: flex; align-items: flex-end; transition: background .15s; }
.sw i { display: block; width: 28px; height: 36px; border-radius: 8px; background: var(--field); box-shadow: 0 2px 0 rgba(35, 33, 30, .2); transition: transform .15s; }
.sw[aria-checked=true] { background: var(--ok); }
.sw[aria-checked=true] i { transform: translateY(-38px); }
/* waiting */
.kettle { height: 16px; border-radius: 999px; background: var(--panel); overflow: hidden; margin: 60px 0 22px; }
.kettle i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 999px; }
/* clocks */
.clock { display: block; margin: 0 auto; }
.clock .face { fill: var(--field); stroke: var(--ink); stroke-width: 5; }
.clock .ticks line { stroke: var(--dim); stroke-width: 3; stroke-linecap: round; }
.clock text { font-size: 22px; font-weight: 800; fill: var(--dim); text-anchor: middle; dominant-baseline: central; }
.clock .hh, .clock .mh { stroke: var(--ink); stroke-linecap: round; transition: transform .2s; }
.clock .hh { stroke-width: 8; } .clock .mh { stroke-width: 5; }
.clock .hub { fill: var(--no); }
.glass { width: 110px; margin: 0 auto 18px; padding: 8px; background: var(--panel); border-radius: 16px; }
.set { display: flex; gap: 8px; margin: 16px 0 10px; }
.set button { flex: 1; padding: 11px; border: 2px solid var(--line); border-radius: 999px; background: var(--field); font-weight: 700; }
/* piano */
.sheet { display: flex; justify-content: center; gap: 5px; margin-bottom: 18px; }
.sheet b { width: 34px; height: 40px; border-radius: 8px; background: var(--panel); display: grid; place-items: center; font-weight: 800; }
.piano { display: flex; gap: 4px; height: 150px; padding: 8px; background: var(--ink); border-radius: 14px; }
.piano button { flex: 1; border: 0; border-radius: 0 0 7px 7px; background: var(--field); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-size: .7rem; font-weight: 800; color: var(--line); transition: background .1s, transform .06s; touch-action: manipulation; }
.piano button.hit { background: var(--c3); transform: translateY(3px); }
/* simon */
.pads { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
.pads button { width: 54px; height: 54px; border-radius: 50%; border: 0; transition: transform .08s; }
.pads button:active { transform: scale(.88); }
/* bell */
.plaque { display: inline-block; padding: 8px 22px; border-radius: 8px; background: var(--ink); color: var(--bg); font-weight: 900; letter-spacing: .4em; margin-bottom: 22px; }
.press { margin: 0 auto; width: 150px; height: 150px; border-radius: 50%; border: 0; background: var(--panel); box-shadow: inset 0 0 0 10px var(--line); display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.press i { width: 64px; height: 64px; border-radius: 50%; background: var(--c3); box-shadow: 0 5px 0 #77561b; transition: transform .06s, box-shadow .06s; }
.press.down i { transform: translateY(4px); box-shadow: 0 1px 0 #77561b; }
.tape { min-height: 18px; margin-top: 16px; display: flex; justify-content: center; align-items: center; gap: 6px; }
.tape b { display: block; height: 8px; border-radius: 4px; background: var(--ink); }
.tape .dit { width: 8px; } .tape .dah { width: 26px; }
/* lights */
.lamps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 270px; margin: 0 auto; }
.lamps button { aspect-ratio: 1; border: 0; border-radius: 18px; background: var(--ink); transition: background .15s, box-shadow .15s; }
.lamps button.on { background: var(--c3); box-shadow: 0 0 0 5px rgba(192, 138, 43, .2); }
/* start and end */
.home { max-width: 380px; margin: 0 auto; padding: 16vh 20px 40px; text-align: center; }
.home h1 { margin: 22px 0 10px; font-size: clamp(3rem, 14vw, 4.4rem); font-weight: 900; letter-spacing: -.045em; line-height: .92; }
.home h1 span { display: block; color: var(--dim); }
.home p { color: var(--dim); margin: 0 0 26px; }
.home .big + .big { margin-top: 10px; }
.stats { display: flex; gap: 10px; margin-bottom: 22px; }
.stats div { flex: 1; padding: 14px 8px; border-radius: 16px; background: var(--panel); }
.stats b { display: block; font-size: 1.3rem; font-weight: 900; white-space: nowrap; }
.stats span { font-size: .8rem; color: var(--dim); }
#lvno.pulse { animation: pulse 1.1s infinite; color: var(--ink); }
@keyframes pulse { 50% { transform: scale(1.35); } }
.mark.live i { cursor: pointer; }
.tick > div { text-align: center; }
.tick span { margin: 0 auto; }
.tick p { margin: 14px 0 0; font-weight: 900; font-size: 1.5rem; letter-spacing: -.02em; animation: pop .35s ease-out; }
.confetti { position: fixed; left: 50%; top: 46%; width: 0; height: 0; pointer-events: none; z-index: 5; }
.confetti i { position: absolute; border-radius: 3px; animation: fly 1.1s cubic-bezier(.15, .7, .3, 1) forwards; }
@keyframes fly { to { transform: translate(var(--dx), calc(var(--dy) + 120px)) rotate(540deg); opacity: 0; } }
.hinted p { margin: 0 0 8px; color: var(--dim); font-size: .92rem; max-width: 32ch; text-align: center; }
.hinted p.answer { color: var(--ink); font-weight: 700; }
.letters { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 12px; background: var(--panel); border-radius: 22px; }
.letters button { border: 0; background: none; padding: 7px 0; font-weight: 800; font-size: 1.15rem; }
.deep { display: flex; flex-direction: column; justify-content: space-around; align-items: center; color: var(--line); font-size: .8rem; letter-spacing: .3em; }
.sky { position: relative; height: 250px; border-radius: 22px; overflow: hidden; background: #cfe0e6; transition: background .5s; touch-action: none; }
.sky.night { background: #23211e; }
.sun { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: var(--c3); box-shadow: 0 0 0 10px rgba(192, 138, 43, .22); cursor: grab; touch-action: none; }
.land { position: absolute; left: -10%; right: -10%; bottom: -70px; height: 130px; border-radius: 50%; background: var(--c0); pointer-events: none; }
.lcd { display: block; width: 100%; margin: 0 0 14px; padding: 18px 12px; border: 0; border-radius: 14px; background: #c9d1bd; box-shadow: inset 0 0 0 4px #9aa58c; }
.lcd span { display: inline-block; font-family: "Courier New", Courier, monospace; font-weight: 700; font-size: 3rem; letter-spacing: .08em; color: #2b3324; transition: transform .45s; }
.lcd.flip span { transform: rotate(180deg); }
.dark { position: relative; height: 200px; border-radius: 22px; overflow: hidden; background: #23211e; touch-action: none; cursor: crosshair; margin-bottom: 14px; }
.dark span { position: absolute; color: var(--bg); font-size: .9rem; font-style: italic; opacity: .85; }
.dark .code { font-style: normal; font-weight: 900; font-size: 1.5rem; letter-spacing: .15em; }
.shade { position: absolute; inset: 0; --x: -200px; --y: -200px; background: radial-gradient(circle at var(--x) var(--y), rgba(35, 33, 30, 0) 0, rgba(35, 33, 30, 0) 34px, #23211e 62px); }
.typed { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
.typed b { width: 40px; height: 48px; border-radius: 10px; background: var(--panel); display: grid; place-items: center; font-size: 1.3rem; }
.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.keys button { padding: 12px 0; border: 2px solid var(--line); border-radius: 12px; background: var(--field); font-weight: 800; }
.sheet b.lit { background: var(--c3); color: #fff; }
.legend { margin: -8px 0 20px; color: var(--dim); font-size: .85rem; letter-spacing: .08em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  'use strict';
  const $app = document.getElementById('app');
  const load = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const save = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  const COLORS = ['var(--c0)', 'var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)'];

  let audio = null;
  function tone(freq, ms) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
      o.type = 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + ms / 1000);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + ms / 1000);
    } catch (e) {}
  }

  // Nine dots joined by dragging. A line that jumps over a dot picks it up on the way.
  function pad(el, onDone) {
    const at = i => [50 + 100 * (i % 3), 50 + 100 * Math.floor(i / 3)];
    el.innerHTML = '<svg class="pad" viewBox="0 0 300 300" tabindex="0" role="application" aria-label="Nine dots. Drag across them, or use the keys 1 to 9 and press Enter.">' +
      '<polyline class="trail" points=""/><line class="lead" x1="0" y1="0" x2="0" y2="0" visibility="hidden"/>' +
      Array.from({ length: 9 }, (x, i) => '<g class="dot"><circle class="ring" cx="' + at(i)[0] + '" cy="' + at(i)[1] + '" r="26"/><circle class="pip" cx="' + at(i)[0] + '" cy="' + at(i)[1] + '" r="8"/></g>').join('') + '</svg>';
    const svg = el.firstChild, trail = svg.querySelector('.trail'), lead = svg.querySelector('.lead'), dots = [...svg.querySelectorAll('.dot')];
    let seq = [], drawing = false, timer = null;
    const paint = () => { trail.setAttribute('points', seq.map(i => at(i).join(',')).join(' ')); dots.forEach((d, i) => d.classList.toggle('on', seq.includes(i))); };
    const reset = () => { clearTimeout(timer); seq = []; svg.classList.remove('bad'); lead.setAttribute('visibility', 'hidden'); paint(); };
    const add = i => {
      if (seq.includes(i)) return;
      if (seq.length) { const a = seq[seq.length - 1], r = Math.floor(a / 3) + Math.floor(i / 3), c = a % 3 + i % 3; if (r % 2 === 0 && c % 2 === 0) { const m = (r / 2) * 3 + c / 2; if (!seq.includes(m)) seq.push(m); } }
      seq.push(i); paint();
    };
    const touch = e => {
      const b = svg.getBoundingClientRect(), x = (e.clientX - b.left) * 300 / b.width, y = (e.clientY - b.top) * 300 / b.height;
      for (let i = 0; i < 9; i++) if (Math.hypot(x - at(i)[0], y - at(i)[1]) < 34) add(i);
      if (seq.length) { const p = at(seq[seq.length - 1]); lead.setAttribute('x1', p[0]); lead.setAttribute('y1', p[1]); lead.setAttribute('x2', x); lead.setAttribute('y2', y); lead.setAttribute('visibility', 'visible'); }
    };
    const finish = () => { drawing = false; lead.setAttribute('visibility', 'hidden'); if (seq.length) onDone(seq.join('-')); };
    svg.addEventListener('pointerdown', e => { e.preventDefault(); reset(); drawing = true; try { svg.setPointerCapture(e.pointerId); } catch (x) {} touch(e); });
    svg.addEventListener('pointermove', e => { if (drawing) touch(e); });
    svg.addEventListener('pointerup', () => { if (drawing) finish(); });
    svg.addEventListener('pointercancel', () => { drawing = false; reset(); });
    svg.addEventListener('keydown', e => { if (/^[1-9]$/.test(e.key)) { if (svg.classList.contains('bad')) reset(); add(+e.key - 1); } else if (e.key === 'Enter') finish(); else if (e.key === 'Backspace') reset(); });
    return { bad() { svg.classList.add('bad'); timer = setTimeout(reset, 700); } };
  }

  // A clock face. opts.numbers draws 12, 3, 6, 9.
  function clockSVG(size, numbers) {
    const tick = i => { const a = i * Math.PI / 6, r1 = i % 3 ? 86 : 80; return '<line x1="' + (100 + r1 * Math.sin(a)) + '" y1="' + (100 - r1 * Math.cos(a)) + '" x2="' + (100 + 92 * Math.sin(a)) + '" y2="' + (100 - 92 * Math.cos(a)) + '"/>'; };
    return '<svg class="clock" width="' + size + '" viewBox="0 0 200 200"><circle class="face" cx="100" cy="100" r="96"/>' +
      (numbers ? '<text x="100" y="30">12</text><text x="172" y="100">3</text><text x="100" y="172">6</text><text x="28" y="100">9</text>' : '<g class="ticks">' + Array.from({ length: 12 }, (x, i) => tick(i)).join('') + '</g>') +
      '<line class="hh" x1="100" y1="100" x2="100" y2="54"/><line class="mh" x1="100" y1="100" x2="100" y2="28"/><circle class="hub" cx="100" cy="100" r="5"/></svg>';
  }
  function setHands(svg, h, m) {
    svg.querySelector('.hh').setAttribute('transform', 'rotate(' + ((h % 12) * 30 + m * 0.5) + ' 100 100)');
    svg.querySelector('.mh').setAttribute('transform', 'rotate(' + m * 6 + ' 100 100)');
  }

  /* =====================================================
     THE LEVELS
     cap:   the only words the player gets
     won:   the line shown when they pass
     hints: three, shown one at a time if they ask: a nudge, a push, then the answer
     make(el, go): build the room in el. go.win() passes it, go.nope() shakes,
                   go.later(fn) registers tidying up for when the room is left.
     ===================================================== */
  const LEVELS = [
    { cap: '', won: 'Rebel.',
      hints: ['Who says you have to do as you are told?', 'There is only one thing here to try.', 'Press the button.'],
      make(el, go) {
        el.innerHTML = '<button class="big">Do not press</button>';
        el.firstChild.addEventListener('click', go.win);
      } },

    { cap: 'Wrong button.', won: 'Sneaky.',
      hints: ['That button really is no use. What else is on the page?', 'Something in the top corner can be pressed.', 'Tap the room number, 02, in the top right corner.'],
      make(el, go) {
        el.innerHTML = '<button class="big ghost">Not this one</button>';
        el.firstChild.addEventListener('click', () => go.nope('Told you.'));
        go.lvno.addEventListener('click', go.win);
        const t = setTimeout(() => go.lvno.classList.add('pulse'), 6000);       // after a while the real button gives itself away
        go.later(() => { clearTimeout(t); go.lvno.classList.remove('pulse'); });
      } },

    { cap: '', won: 'Eagle eyes.',
      hints: ['They are not all the same.', 'One of these letters is missing a leg.', 'There is a single N hiding among the Ms. Fifth row. Tap it.'],
      make(el, go) {
        const odd = 30;
        el.innerHTML = '<div class="letters">' + Array.from({ length: 42 }, (x, i) => '<button data-o="' + (i === odd ? 1 : 0) + '">' + (i === odd ? 'N' : 'M') + '</button>').join('') + '</div>';
        el.firstChild.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.o === '1') go.win(); else go.nope(); });
      } },

    { cap: '', won: 'You can count.',
      hints: ['Three colours of dot. Three colours of counter.', 'Set each counter to the number of dots in its colour.', 'Red 4, yellow 2, blue 7.'],
      make(el, go) {
        const spots = [[12, 20, 2], [30, 62, 4], [48, 14, 4], [70, 38, 2], [22, 78, 3], [84, 70, 4], [58, 60, 2], [40, 36, 4], [88, 16, 3], [8, 50, 4], [66, 82, 2], [76, 12, 4], [52, 84, 4]];
        const want = [2, 3, 4].map(c => spots.filter(s => s[2] === c).length), have = [0, 0, 0];
        el.innerHTML = '<div class="field">' + spots.map(s => '<i style="left:' + s[0] + '%;top:' + s[1] + '%;background:' + COLORS[s[2]] + '"></i>').join('') + '</div>' +
          '<div class="counters">' + [2, 3, 4].map((c, k) => '<div class="counter" style="background:' + COLORS[c] + '"><button data-k="' + k + '" data-d="-1" aria-label="Fewer">−</button><span>0</span><button data-k="' + k + '" data-d="1" aria-label="More">+</button></div>').join('') + '</div>';
        el.querySelector('.counters').addEventListener('click', e => {
          const b = e.target.closest('button'); if (!b) return;
          const k = +b.dataset.k; have[k] = Math.max(0, Math.min(9, have[k] + +b.dataset.d));
          el.querySelectorAll('.counter span')[k].textContent = have[k];
          if (have.every((v, i) => v === want[i])) go.win();
        });
      } },

    { cap: 'Count up.', won: 'All in order.',
      hints: ['Every tile is a number in disguise.', 'Tap them from the smallest to the largest.', 'one, 2, the three dots, 2 + 2, V, half a dozen.'],
      make(el, go) {
        const tiles = [['2 + 2', 4], ['one', 1], ['half a dozen', 6], ['• • •', 3], ['V', 5], ['2', 2]];
        let next = 1;
        el.innerHTML = '<div class="tiles">' + tiles.map(t => '<button data-v="' + t[1] + '">' + t[0] + '</button>').join('') + '</div>';
        el.firstChild.addEventListener('click', e => {
          const b = e.target.closest('button'); if (!b || b.classList.contains('on')) return;
          if (+b.dataset.v === next) { b.classList.add('on'); tone(260 + next * 50, 160); if (++next > tiles.length) go.win(); }
          else { next = 1; el.querySelectorAll('.on').forEach(x => x.classList.remove('on')); go.nope('Back to one.'); }
        });
      } },

    { cap: 'One too many.', won: 'Spotted.',
      hints: ['Something on this page has been the same in every room. Until now.', 'Count the dots at the top. There are usually five.', 'Tap the pink dot at the top of the page.'],
      make(el, go) {
        el.innerHTML = '<button class="big ghost">Nothing to see here</button>';
        el.firstChild.addEventListener('click', () => go.nope('Exactly.'));
        const extra = document.createElement('i');
        extra.style.background = '#a8577e'; extra.tabIndex = 0; extra.setAttribute('role', 'button'); extra.setAttribute('aria-label', 'A sixth dot');
        go.mark.insertBefore(extra, go.dots[3]); go.mark.classList.add('live');
        extra.addEventListener('click', go.win);
        extra.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') go.win(); });
        go.dots.forEach(d => d.addEventListener('click', () => go.nope('That one belongs.')));
      } },

    { cap: 'Please type the password.', won: 'Literally.',
      hints: ['Do exactly what it says.', 'It is asking you to type two words. They are in the sentence.', 'Type: the password'],
      make(el, go) {
        el.innerHTML = '<input class="word" aria-label="Password" autocapitalize="none" autocorrect="off" spellcheck="false"><button class="big">Open</button>';
        const inp = el.querySelector('input'), tryIt = () => { const v = inp.value.trim().toLowerCase().replace(/[."']/g, ''); if (v === 'the password' || v === 'password') go.win(); else go.nope('That is not the password.'); };
        el.querySelector('.big').addEventListener('click', tryIt);
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') tryIt(); });
      } },

    { cap: 'The last letter.', won: 'Zzz.',
      hints: ['Join the dots to draw a letter.', 'Which letter comes last in the alphabet?', 'Draw a Z: across the top, diagonally down to the left, across the bottom.'],
      make(el, go) {
        const p = pad(el, v => { if (v === '0-1-2-4-6-7-8' || v === '8-7-6-4-2-1-0') go.win(); else { p.bad(); go.nope(); } });
      } },

    { cap: 'It is written down.', won: 'That was a long way.',
      hints: ['"Written down." Read the second word again.', 'Scroll. Further than seems reasonable.', 'The word at the very bottom of the page is marmalade.'],
      make(el, go) {
        el.innerHTML = '<input class="word" aria-label="The word" autocapitalize="none" autocorrect="off" spellcheck="false"><button class="big">Open</button><div class="deep"><span>keep going</span><span>nearly</span></div><p class="tiny">marmalade</p>';
        const inp = el.querySelector('input'), tryIt = () => { if (inp.value.trim().toLowerCase() === 'marmalade') { window.scrollTo(0, 0); go.win(); } else go.nope(); };
        el.querySelector('.big').addEventListener('click', tryIt);
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') tryIt(); });
      } },

    { cap: 'Wait for night.', won: 'Good night.',
      hints: ['Night comes when the sun goes.', 'You do not have to wait. The sun can be moved.', 'Drag the sun down behind the hill.'],
      make(el, go) {
        el.innerHTML = '<div class="sky"><div class="sun" tabindex="0" role="slider" aria-label="The sun. Drag it, or use the arrow keys." aria-valuemin="0" aria-valuemax="100" aria-valuenow="15"></div><div class="land"></div></div>';
        const sky = el.firstChild, sun = sky.querySelector('.sun');
        let x = 62, y = 15, grab = null;                                         // sun position, in percent of the sky
        const place = () => { sun.style.left = x + '%'; sun.style.top = y + '%'; sun.setAttribute('aria-valuenow', Math.round(y)); if (y >= 80) { sky.classList.add('night'); go.win(); } };
        sun.addEventListener('pointerdown', e => { e.preventDefault(); try { sun.setPointerCapture(e.pointerId); } catch (z) {} grab = true; });
        sun.addEventListener('pointermove', e => { if (!grab) return; const b = sky.getBoundingClientRect(); x = Math.max(8, Math.min(92, (e.clientX - b.left) / b.width * 100)); y = Math.max(8, Math.min(96, (e.clientY - b.top) / b.height * 100)); place(); });
        sun.addEventListener('pointerup', () => { grab = null; });
        sun.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { e.preventDefault(); y = Math.min(96, y + 8); place(); } if (e.key === 'ArrowUp') { e.preventDefault(); y = Math.max(8, y - 8); place(); } });
        place();
      } },

    { cap: '', won: 'The answer to everything.',
      hints: ['Each switch is worth the number written under it.', 'Switch on the ones that add up to 42.', 'Switch on 32, 8 and 2.'],
      make(el, go) {
        const vals = [32, 16, 8, 4, 2, 1];
        el.innerHTML = '<div class="sum">42</div><div class="fuses">' + vals.map(v => '<div><button class="sw" role="switch" aria-checked="false" aria-label="' + v + '"><i></i></button>' + v + '</div>').join('') + '</div>';
        const sw = [...el.querySelectorAll('.sw')];
        sw.forEach(s => s.addEventListener('click', () => {
          s.setAttribute('aria-checked', s.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); tone(380, 70);
          if (sw.reduce((t, x, i) => t + (x.getAttribute('aria-checked') === 'true' ? vals[i] : 0), 0) === 42) go.win();
        }));
      } },

    { cap: 'Patience.', won: 'Very zen.',
      hints: ['It means it.', 'Every tap, scroll or key press starts the bar again. Including that button.', 'Take your hands off and touch nothing for eight seconds.'],
      make(el, go) {
        el.innerHTML = '<div class="kettle"><i></i></div><button class="big">Hurry up</button>';
        const bar = el.querySelector('.kettle i'), NEED = 8000, evs = ['pointerdown', 'keydown', 'wheel', 'touchstart', 'scroll'];
        let t0 = Date.now();
        const fuss = () => { t0 = Date.now(); };
        evs.forEach(ev => window.addEventListener(ev, fuss, true));
        const timer = setInterval(() => { const f = Math.min(1, (Date.now() - t0) / NEED); bar.style.width = f * 100 + '%'; if (f >= 1) go.win(); }, 100);
        go.later(() => { clearInterval(timer); evs.forEach(ev => window.removeEventListener(ev, fuss, true)); });
      } },

    { cap: 'Say it upside down.', won: '0.7734 to you too.',
      hints: ['An old calculator trick.', 'Tap the display to turn it over, then read it as a word.', 'Type: hello'],
      make(el, go) {
        el.innerHTML = '<button class="lcd" aria-label="A calculator display showing 0.7734. Tap to turn it over."><span>0.7734</span></button>' +
          '<input class="word" aria-label="The word" autocapitalize="none" autocorrect="off" spellcheck="false"><button class="big">Open</button>';
        const inp = el.querySelector('input'), tryIt = () => { if (inp.value.trim().toLowerCase() === 'hello') go.win(); else go.nope(); };
        el.querySelector('.lcd').addEventListener('click', e => e.currentTarget.classList.toggle('flip'));
        el.querySelector('.big').addEventListener('click', tryIt);
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') tryIt(); });
      } },

    { cap: 'rorriM', won: '.thgiR',
      hints: ['The caption is backwards for a reason.', 'The small clock is a reflection. Set the big clock to the real time.', 'Set it to quarter to three (2:45), then Open.'],
      make(el, go) {
        el.innerHTML = '<div class="glass">' + clockSVG(94, true) + '</div>' + clockSVG(190, false) +
          '<div class="set"><button data-k="h">Hour</button><button data-k="m">Minute</button></div><button class="big">Open</button>';
        const small = el.querySelector('.glass svg'), main = el.querySelectorAll('svg')[1];
        small.style.transform = 'scaleX(-1)'; setHands(small, 2, 45);
        let h = 12, m = 0; setHands(main, h, m);
        el.querySelector('.set').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.k === 'h') h = h % 12 + 1; else m = (m + 5) % 60; setHands(main, h, m); tone(500, 50); });
        el.querySelector('.big').addEventListener('click', () => { if (h === 2 && m === 45) go.win(); else go.nope(h === 9 && m === 15 ? 'That is what the mirror shows.' : ''); });
      } },

    { cap: 'Who turned the lights off?', won: 'Found it.',
      hints: ['It is dark in that box. Imagine you are holding a torch.', 'Move your finger around the dark box. One of the scribbles on the wall is a number.', 'The code is 507.'],
      make(el, go) {
        el.innerHTML = '<div class="dark"><span style="left:12%;top:16%">nope</span><span style="left:58%;top:22%">colder</span><span style="left:20%;top:70%">warmer</span><span class="code" style="left:66%;top:66%">507</span><div class="shade"></div></div>' +
          '<div class="typed" aria-live="polite"><b></b><b></b><b></b></div><div class="keys">' + [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(n => '<button data-n="' + n + '">' + n + '</button>').join('') + '</div>';
        const dark = el.querySelector('.dark'), shade = el.querySelector('.shade'), slots = [...el.querySelectorAll('.typed b')];
        const beam = e => { const b = dark.getBoundingClientRect(); shade.style.setProperty('--x', (e.clientX - b.left) + 'px'); shade.style.setProperty('--y', (e.clientY - b.top) + 'px'); };
        dark.addEventListener('pointerdown', e => { try { dark.setPointerCapture(e.pointerId); } catch (z) {} beam(e); });
        dark.addEventListener('pointermove', beam);
        let seq = '';
        const paint = () => slots.forEach((s, i) => { s.textContent = seq[i] || ''; });
        el.querySelector('.keys').addEventListener('click', e => {
          const b = e.target.closest('button'); if (!b || seq.length >= 3) return;
          seq += b.dataset.n; tone(440 + +b.dataset.n * 30, 80); paint();
          if (seq.length === 3) { if (seq === '507') go.win(); else { go.nope(); setTimeout(() => { seq = ''; paint(); }, 500); } }
        });
      } },

    { cap: '', won: 'Eat your greens.',
      hints: ['Those letters are also the names of notes.', 'From the left, the white keys are C D E F G A B C.', 'Count keys from the left: 1, 6, 7, 7, 6, 5, 3.'],
      make(el, go) {
        const hz = [261.6, 293.7, 329.6, 349.2, 392.0, 440.0, 493.9, 523.3], want = '0566542';      // C A B B A G E
        el.innerHTML = '<div class="sheet">' + 'CABBAGE'.split('').map(c => '<b>' + c + '</b>').join('') + '</div>' +
          '<div class="piano">' + hz.map((f, i) => '<button data-i="' + i + '" aria-label="Key ' + (i + 1) + '">' + (i === 0 ? 'C' : '') + '</button>').join('') + '</div>';
        let seq = '';
        const sheet = [...el.querySelectorAll('.sheet b')];
        el.querySelector('.piano').addEventListener('click', e => {
          const k = e.target.closest('button'); if (!k) return;
          seq = (seq + k.dataset.i).slice(-want.length); tone(hz[+k.dataset.i], 450);
          k.classList.add('hit'); setTimeout(() => k.classList.remove('hit'), 160);
          let good = 0; for (let n = Math.min(seq.length, want.length); n > 0; n--) if (want.startsWith(seq.slice(-n))) { good = n; break; }   // light the letters played so far
          sheet.forEach((b, i) => b.classList.toggle('lit', i < good));
          if (seq === want) go.win();
        });
      } },

    { cap: 'Watch.', won: 'Good memory.',
      hints: ['Something on this page keeps blinking.', 'The small dots at the top flash in an order. Repeat it on the big ones.', 'Black, yellow, green, yellow, blue.'],
      make(el, go) {
        const want = [1, 3, 0, 3, 4], timers = [];
        el.innerHTML = '<div class="pads">' + COLORS.map((c, i) => '<button data-i="' + i + '" style="background:' + c + '" aria-label="Colour ' + (i + 1) + '"></button>').join('') + '</div><div class="tape"></div>';
        const tape = el.querySelector('.tape');
        const show = () => want.forEach((d, n) => {
          timers.push(setTimeout(() => go.dots[d].classList.add('lit'), 700 + n * 650));
          timers.push(setTimeout(() => go.dots[d].classList.remove('lit'), 700 + n * 650 + 420));
        });
        show(); const loop = setInterval(show, 7000);
        let seq = [];
        el.firstChild.addEventListener('click', e => {
          const b = e.target.closest('button'); if (!b) return;
          const i = +b.dataset.i; tone(300 + i * 70, 180);
          if (i !== want[seq.length]) { seq = i === want[0] ? [i] : []; if (!seq.length) go.nope(); } else seq.push(i);
          tape.innerHTML = seq.map(() => '<b class="dit"></b>').join('');
          if (seq.length === want.length) go.win();
        });
        go.later(() => { clearInterval(loop); timers.forEach(clearTimeout); go.dots.forEach(d => d.classList.remove('lit')); });
      } },

    { cap: '', won: 'Help is on its way.',
      hints: ['The plaque is what to say. The small print is how to say it.', 'A quick tap is a dot. A held press is a dash. Then stop and wait.', 'Tap tap tap, hold hold hold, tap tap tap.'],
      make(el, go) {
        el.innerHTML = '<div class="plaque">SOS</div><p class="legend">S &nbsp;· · ·&nbsp;&nbsp;&nbsp;&nbsp; O &nbsp;— — —</p><div><button class="press" aria-label="Bell. Tap for a dot, hold for a dash."><i></i></button></div><div class="tape" aria-live="polite"></div>';
        const btn = el.querySelector('.press'), tape = el.querySelector('.tape');
        let seq = '', t0 = 0, timer = null, down = false;
        const paint = () => { tape.innerHTML = seq.split('').map(c => '<b class="' + (c === '.' ? 'dit' : 'dah') + '"></b>').join(''); };
        const send = () => { if (seq === '...---...') go.win(); else { go.nope(); seq = ''; setTimeout(paint, 400); } };
        const press = () => { if (down) return; down = true; t0 = Date.now(); clearTimeout(timer); btn.classList.add('down'); };
        const release = () => {
          if (!down) return;
          down = false; btn.classList.remove('down');
          const dash = Date.now() - t0 >= 300;
          seq += dash ? '-' : '.'; tone(dash ? 660 : 880, dash ? 380 : 130); paint();
          if (seq.length >= 12) send(); else timer = setTimeout(send, 1500);
        };
        btn.addEventListener('pointerdown', e => { e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch (x) {} press(); });
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointercancel', () => { down = false; btn.classList.remove('down'); });
        btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); } });
        btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); release(); } });
        btn.addEventListener('contextmenu', e => e.preventDefault());
        go.later(() => clearTimeout(timer));
      } },

    { cap: 'Lights on.', won: 'Bright idea.',
      hints: ['Each lamp also flips the lamps next to it.', 'It can be done in five presses, and no lamp is pressed twice.', 'Press the four corners and the middle.'],
      make(el, go) {
        el.innerHTML = '<div class="lamps">' + Array.from({ length: 9 }, (x, i) => '<button data-i="' + i + '" aria-pressed="false" aria-label="Lamp ' + (i + 1) + '"></button>').join('') + '</div>';
        const lamps = [...el.querySelectorAll('button')];
        const flip = i => { const on = lamps[i].classList.toggle('on'); lamps[i].setAttribute('aria-pressed', on); };
        el.firstChild.addEventListener('click', e => {
          const b = e.target.closest('button'); if (!b) return;
          const i = +b.dataset.i, r = Math.floor(i / 3), c = i % 3;
          flip(i); if (r > 0) flip(i - 3); if (r < 2) flip(i + 3); if (c > 0) flip(i - 1); if (c < 2) flip(i + 1);
          tone(420, 90);
          if (lamps.every(l => l.classList.contains('on'))) go.win();
        });
      } },

    { cap: 'This time, mean it.', won: 'Finally, you listened.',
      hints: ['You have met this button before.', 'In the first room you disobeyed. Do the opposite now.', 'Do not press it. Leave it alone for six seconds.'],
      make(el, go) {
        el.innerHTML = '<button class="big">Do not press</button>';
        const btn = el.firstChild, NEED = 6000;
        let t0 = Date.now();
        btn.addEventListener('click', () => { t0 = Date.now(); go.nope('I said do not.'); });
        const timer = setInterval(() => { const f = Math.min(1, (Date.now() - t0) / NEED); btn.style.opacity = 1 - f * 0.8; btn.style.transform = 'scale(' + (1 - f * 0.12) + ')'; if (f >= 1) go.win(); }, 100);
        go.later(() => clearInterval(timer));
      } }
  ];

  /* ---------------- THE SHELL ---------------- */
  const N = LEVELS.length;
  let reached = Math.min(N, parseInt(load('lc2_reached'), 10) || 0);     // how many rooms have been passed
  let hints = parseInt(load('lc2_hints'), 10) || 0;
  let cur = 0, tidy = [], busy = false, msgTimer = null;
  const two = n => String(n).padStart(2, '0');
  const leave = () => { tidy.forEach(f => { try { f(); } catch (e) {} }); tidy = []; clearTimeout(msgTimer); };
  const clockText = ms => { const s = Math.round(ms / 1000); return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + two(s % 60) + 's'; };
  const NOPES = ['Nope.', 'Not quite.', 'Try again.', 'Colder.', 'Hmm. No.', 'Close? No.'];
  const dotsHTML = '<div class="mark">' + COLORS.map(c => '<i style="background:' + c + '"></i>').join('') + '</div>';

  function confetti(n) {
    const box = document.createElement('div'); box.className = 'confetti';
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 170, s = 6 + Math.random() * 8;
      box.innerHTML += '<i style="--dx:' + Math.cos(a) * d + 'px;--dy:' + (Math.sin(a) * d - 40) + 'px;width:' + s + 'px;height:' + s + 'px;background:' + ['#2c6e68', '#23211e', '#b4532f', '#c08a2b', '#5b6fa8', '#a8577e'][k % 6] + ';animation-delay:' + Math.random() * 80 + 'ms"></i>';
    }
    document.body.appendChild(box); setTimeout(() => box.remove(), 1300);
  }

  function home() {
    leave();
    $app.innerHTML = '<main class="home">' + dotsHTML +
      '<h1>Look <span>closer.</span></h1><p>' + N + ' small rooms. Nobody tells you the rules.<br>Everything you need is on the screen.</p>' +
      '<button class="big" id="go">' + (reached === 0 ? 'Begin' : reached >= N ? 'Walk through again' : 'Carry on from room ' + (reached + 1)) + '</button>' +
      (reached > 0 ? '<button class="big ghost" id="wipe">Start from the beginning</button>' : '') + '</main>';
    document.getElementById('go').addEventListener('click', () => { if (!load('lc2_t0')) save('lc2_t0', Date.now()); room(reached >= N ? 0 : reached); });
    const w = document.getElementById('wipe');
    if (w) w.addEventListener('click', () => { ['lc2_reached', 'lc2_hints', 'lc2_t0', 'lc2_t1'].forEach(k => save(k, null)); reached = 0; hints = 0; save('lc2_t0', Date.now()); room(0); });
  }

  function room(i) {
    leave(); cur = i; busy = false;
    const L = LEVELS[i];
    $app.innerHTML = '<header class="bar"><b>Look closer</b><button id="lvno" aria-label="Room ' + (i + 1) + ' of ' + N + '">' + two(i + 1) + '</button></header>' + dotsHTML +
      '<main class="stage" id="stage"><p class="cap">' + L.cap + '</p><div id="lv"></div><p class="msg" id="msg" role="alert"></p></main>' +
      '<footer class="foot"><div class="hinted" id="hinted"></div><button class="hint" id="hint">Stuck?</button>' +
      '<div class="steps">' + LEVELS.map((x, k) => '<button data-k="' + k + '" class="' + (k === i ? 'now' : k < reached ? 'done' : '') + '"' + (k > reached ? ' disabled' : '') + ' aria-label="Room ' + (k + 1) + '"></button>').join('') + '</div></footer>';
    const stage = document.getElementById('stage'), lv = document.getElementById('lv'), msg = document.getElementById('msg');
    const go = {
      lvno: document.getElementById('lvno'), mark: $app.querySelector('.mark'), dots: [...$app.querySelectorAll('.mark i')],
      later: f => tidy.push(f),
      nope(text) {
        lv.classList.remove('shake'); void lv.offsetWidth; lv.classList.add('shake'); tone(160, 160);
        msg.textContent = text || NOPES[Math.floor(Math.random() * NOPES.length)];
        clearTimeout(msgTimer); msgTimer = setTimeout(() => { msg.textContent = ''; }, 1600);
      },
      win() {
        if (busy) return; busy = true;
        stage.classList.add('won'); msg.textContent = ''; tone(660, 140); setTimeout(() => tone(990, 260), 130);
        const t = document.createElement('div'); t.className = 'tick'; t.innerHTML = '<div><span>✓</span><p>' + L.won + '</p></div>'; $app.appendChild(t);
        confetti(26);
        if (i + 1 > reached) { reached = i + 1; save('lc2_reached', reached); if (reached >= N && !load('lc2_t1')) save('lc2_t1', Date.now()); }
        setTimeout(() => { if (i + 1 >= N) end(); else room(i + 1); }, 1250);
      }
    };
    L.make(lv, go);
    // Stuck? Three steps: a nudge, a push, then the answer.
    let shown = 0;
    const hintBtn = document.getElementById('hint');
    hintBtn.addEventListener('click', () => {
      if (shown >= L.hints.length) return;
      const p = document.createElement('p'); p.textContent = L.hints[shown]; if (shown === L.hints.length - 1) p.className = 'answer';
      document.getElementById('hinted').appendChild(p);
      shown++; hints++; save('lc2_hints', hints);
      if (shown >= L.hints.length) hintBtn.hidden = true; else hintBtn.textContent = shown === 1 ? 'Still stuck?' : 'Just tell me';
    });
    $app.querySelector('.steps').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled && +b.dataset.k !== cur) room(+b.dataset.k); });
    $app.querySelector('.bar b').addEventListener('click', home);
    window.scrollTo(0, 0);
  }

  function end() {
    leave();
    const ms = (parseInt(load('lc2_t1'), 10) || Date.now()) - (parseInt(load('lc2_t0'), 10) || Date.now());
    const rank = hints === 0 ? 'Eagle-eyed' : hints <= 5 ? 'Sharp' : hints <= 15 ? 'Observant' : 'Stubborn';
    const line = 'Look Closer: ' + N + ' rooms in ' + clockText(ms) + ', ' + (hints === 0 ? 'no hints' : hints + (hints === 1 ? ' hint' : ' hints')) + '. Rank: ' + rank + '.';
    $app.innerHTML = '<main class="home">' + dotsHTML +
      '<h1>You <span>looked.</span></h1><p>Every room, opened. Your rank: <b>' + rank + '</b>.</p>' +
      '<div class="stats"><div><b>' + N + '</b><span>rooms</span></div><div><b>' + clockText(ms) + '</b><span>start to finish</span></div><div><b>' + hints + '</b><span>hints</span></div></div>' +
      '<button class="big" id="share">Copy my result</button><button class="big ghost" id="back">Back to the start</button></main>';
    confetti(70); setTimeout(() => confetti(50), 450);
    document.getElementById('share').addEventListener('click', e => {
      const done = () => { e.target.textContent = 'Copied'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(line + ' ' + location.href.split('#')[0]).then(done, () => prompt('Copy this:', line));
      else prompt('Copy this:', line);
    });
    document.getElementById('back').addEventListener('click', home);
  }

  home();
})();
</script>
</body>
</html>
