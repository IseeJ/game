<title>Deal Breaker — a red flags dating game</title>
<meta name="description" content="Build the perfect date, then ruin someone else's with a red flag. Create a room, share the code, play with friends.">
<style>
:root {
  --bg: #fff3ec;
  --panel: #ffffff;
  --line: #ecd5c8;

* { box-sizing: border-box; }
html, body { margin: 0; }
body {

button, input, select { font: inherit; color: inherit; }

.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--red-dark); border-color: var(--red-dark); }
.btn.big { padding: 14px 24px; font-size: 1.05rem; }
.btn.small { padding: 6px 14px; font-size: .9rem; }
.field { display: block; text-align: left; margin: 0 0 14px; }
.field span { display: block; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 6px; }
.field.inline { display: flex; align-items: center; gap: 12px; }
.field.inline span { margin: 0; }
input, select {
  width: 100%; background: var(--panel); border: 2px solid var(--line);

select { width: auto; }
input::placeholder { color: #c4adaf; font-weight: 400; }

.note { color: var(--dim); margin: 8px 0 0; }
.err { color: var(--red-dark); font-weight: 700; margin: 8px 0 0; }
.fine { color: var(--dim); font-size: .85rem; margin: 16px 0 0; }
.how { margin: 20px 0 0; padding: 0 0 0 20px; color: var(--dim); font-size: .92rem; }

.lobby { text-align: center; align-items: center; }

.code { font-size: clamp(3rem, 16vw, 4.5rem); font-weight: 900; letter-spacing: .12em; color: var(--red); line-height: 1; margin-bottom: 4px; }

.lobby h2 { margin: 24px 0 0; font-size: 1.1rem; text-align: left; }
.dim { color: var(--dim); font-weight: 400; }

.bar b { color: var(--red); letter-spacing: .1em; }
.scores { list-style: none; margin: 0; padding: 12px 20px; display: flex; gap: 8px; overflow-x: auto; }

.dialog { background: var(--panel); border-radius: var(--radius); padding: 24px; max-width: 380px; }

.dialog p { color: var(--dim); margin: 0 0 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
#toast { position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; font-weight: 700; padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 40px); z-index: 20; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    return f ? c.replace(BLANK, f) : null;
  };
  const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 5);

  let myPid = load('sessionStorage', 'db_pid');
  if (!myPid) { myPid = Math.random().toString(36).slice(2, 12); save('sessionStorage', 'db_pid', myPid); }
  let myName = load('localStorage', 'db_name') || '';
  let roomCode = cleanCode(new URLSearchParams(location.search).get('room'));

  let peer = null, hostConn = null, isHost = false;
  let G = null;        // full game state (host only)
  let view = null;     // what this player is allowed to see
  let busy = '', homeErr = '', lost = false, joinTimer = null;
  let sel = [], pickIdx = null, selKey = '', fillText = {};

  /* ---------------- HOST ---------------- */
  const P = pid => G.players.find(p => p.pid === pid);

  function createRoom() {
    isHost = true;
    const code = makeCode();
    busy = 'Creating room…'; render();
    peer = new Peer(PREFIX + code);
    peer.on('open', () => {
      busy = ''; roomCode = code;
      G = {
        code, phase: 'lobby', goal: 5, round: 0, hostPid: myPid,
        players: [newPlayer(myPid, myName, null)],
        singlePid: null, order: [], table: [], winnerPid: null,
        decks: {}, extra: []
      };
      setRoomUrl(code);
      sync();
    });
    peer.on('connection', conn => {
      conn.on('data', msg => {
        if (!G || !msg || typeof msg !== 'object') return;
        if (msg.t === 'join') hostJoin(conn, msg);
        else if (conn.pid) handle(conn.pid, msg);
      });
      conn.on('close', () => hostLeave(conn));
      conn.on('error', () => hostLeave(conn));
    });
    peer.on('error', err => {
      if (err.type === 'unavailable-id') { peer.destroy(); createRoom(); }
      else if (!G) { peer.destroy(); busy = ''; homeErr = 'Could not reach the connection server. Check your internet and try again.'; render(); }
    });
    peer.on('disconnected', () => { if (peer && !peer.destroyed) peer.reconnect(); });
  }

  function newPlayer(pid, name, conn) {
    return { pid, name, score: 0, perks: [], flags: [], date: null, flag: null, conn, connected: true };
  }

  function hostJoin(conn, msg) {
    const pid = String(msg.pid || '').slice(0, 20);
    const name = String(msg.name || '').trim().slice(0, 16) || 'Player';
    if (!pid) return;
    let p = P(pid);
    if (p) {                                   // same player coming back
      if (p.pid === G.hostPid) return;
      const old = p.conn;
      p.conn = conn; p.connected = true; p.name = name;
      if (old && old !== conn) { try { old.close(); } catch (e) {} }
    } else {
      if (G.players.length >= MAX_PLAYERS) { conn.send({ t: 'full' }); return; }
      p = newPlayer(pid, name, conn);
      G.players.push(p);
      if (G.phase !== 'lobby' && G.phase !== 'gameover') refill(p);
    }
    conn.pid = pid;
    sync();
  }

  function hostLeave(conn) {
    if (!G || !conn.pid) return;
    const p = P(conn.pid);
    if (!p || p.conn !== conn) return;
    p.conn = null; p.connected = false;
    if (G.phase === 'lobby') { G.players = G.players.filter(x => x !== p); sync(); return; }
    if (p.pid === G.singlePid && ['perks', 'sabotage', 'judging'].includes(G.phase)) {
      toastAll(p.name + ' (the single) dropped out. Round skipped.');
      startRound(); return;
    }
    advance();
    sync();
  }

  function draw(k) {
    const d = G.decks[k];
    if (!d.draw.length) { d.draw = shuffle(d.discard); d.discard = []; }
    return d.draw.pop();
  }
  function refill(p) {
    while (p.perks.length < PERK_HAND) { const c = draw('perk'); if (c === undefined) break; p.perks.push(c); }
    while (p.flags.length < FLAG_HAND) { const c = draw('flag'); if (c === undefined) break; p.flags.push(c); }
  }

  function startGame() {
    G.decks = {
      perk: { draw: shuffle([...new Set(PERKS)]), discard: [] },
      flag: { draw: shuffle([...new Set(FLAGS)]), discard: [] }
    };
    G.round = 0; G.singlePid = null; G.extra = [];
    G.players = G.players.filter(p => p.connected);
    G.players.forEach(p => { p.score = 0; p.perks = []; p.flags = []; p.date = null; p.flag = null; });
    startRound();
  }

  function startRound() {
    G.players.forEach(p => {
      if (p.date) { G.decks.perk.discard.push(...p.rawDate); p.date = null; }
      if (p.flag) { G.decks.flag.discard.push(p.rawFlag); p.flag = null; }
    });
    G.decks.flag.discard.push(...G.extra); G.extra = [];
    G.table = []; G.order = []; G.winnerPid = null;
    const live = G.players.filter(p => p.connected);
    if (live.length < 2) {
      G.players = live; G.phase = 'lobby';
      toastAll('Not enough players left. Back to the lobby.');
      sync(); return;
    }
    const n = G.players.length;
    const cur = G.players.findIndex(p => p.pid === G.singlePid);
    for (let i = 1; i <= n; i++) {
      const cand = G.players[(cur + i + n) % n];
      if (cand.connected) { G.singlePid = cand.pid; break; }
    }
    G.round++;
    G.players.forEach(refill);
    G.phase = 'perks';
    sync();
  }

  // Move the round along once everyone we are waiting on has played.
  function advance() {
    if (G.phase === 'perks') {
      const need = G.players.filter(p => p.connected && p.pid !== G.singlePid);
      if (!need.length || !need.every(p => p.date)) return;
      G.order = shuffle(G.players.filter(p => p.date).map(p => p.pid));
      if (G.order.length >= 2) G.phase = 'sabotage';
      else toJudging();
    } else if (G.phase === 'sabotage') {
      if (G.order.every(pid => { const p = P(pid); return !p || !p.connected || p.flag; })) toJudging();
    }
  }

  // Each dater's red flag lands on the next date in the circle.
  function toJudging() {
    const n = G.order.length;
    G.table = shuffle(G.order.map((pid, i) => {
      const from = n >= 2 ? P(G.order[(i - 1 + n) % n]) : null;
      let flag = from && from.flag, by = flag ? from.pid : null;
      if (!flag) {   // saboteur left: deal one at random
        for (let t = 0; t < 6; t++) { flag = draw('flag'); if (flag === undefined) break; G.extra.push(flag); if (!flag.includes(BLANK)) break; }
        if (flag) flag = flag.replace(BLANK, 'something unspeakable');
      }
      return { pid, cards: P(pid).date, flag: flag || null, by };
    }));
    G.phase = 'judging';
  }

  // Every player action lands here (the host's own actions too).
  function handle(pid, msg) {
    const p = P(pid);
    if (!p) return;
    const amHost = pid === G.hostPid, amSingle = pid === G.singlePid;
    switch (msg.t) {
      case 'goal':
        if (amHost && G.phase === 'lobby') { G.goal = Math.min(15, Math.max(3, parseInt(msg.goal, 10) || 5)); sync(); }
        break;
      case 'start':
        if (amHost && (G.phase === 'lobby' || G.phase === 'gameover') &&
            G.players.filter(x => x.connected).length >= MIN_PLAYERS) startGame();
        break;
      case 'date': {
        if (G.phase !== 'perks' || amSingle || p.date) return;
        const cards = Array.isArray(msg.cards) ? msg.cards : [];
        if (cards.length !== 2 || cards[0] === cards[1] || !cards.every(c => p.perks.includes(c))) return;
        const done = cards.map((c, i) => filled(c, msg.fills && msg.fills[i]));
        if (done.includes(null)) return;
        p.perks = p.perks.filter(c => !cards.includes(c));
        p.date = done; p.rawDate = cards;
        refill(p); advance(); sync();
        break;
      }
      case 'flag': {
        if (G.phase !== 'sabotage' || !G.order.includes(pid) || p.flag || !p.flags.includes(msg.card)) return;
        const flag = filled(msg.card, msg.fill);
        if (flag === null) return;
        p.flags = p.flags.filter(c => c !== msg.card);
        p.flag = flag; p.rawFlag = msg.card;
        refill(p); advance(); sync();
        break;
      }
      case 'pick': {
        if (G.phase !== 'judging' || !amSingle) return;
        const s = G.table[msg.i];
        if (!s) return;
        G.winnerPid = s.pid;
        const w = P(s.pid); if (w) w.score++;
        G.phase = 'result';
        sync();
        break;
      }
      case 'next':
        if (G.phase !== 'result' || !(amHost || amSingle)) return;
        if (G.players.some(x => x.score >= G.goal)) { G.phase = 'gameover'; sync(); }
        else startRound();
        break;
      case 'lobby':
        if (amHost && G.phase === 'gameover') {
          G.players = G.players.filter(x => x.connected);
          G.players.forEach(x => { x.score = 0; x.perks = []; x.flags = []; x.date = null; x.flag = null; });
          G.phase = 'lobby'; sync();
        }
        break;
    }
  }

  function viewFor(pid) {
    const me = P(pid), ph = G.phase;
    let target = null;
    if (ph === 'sabotage') {
      const i = G.order.indexOf(pid);
      if (i >= 0) { const t = P(G.order[(i + 1) % G.order.length]); target = { name: t.name, cards: t.date }; }
    }
    const open = ph === 'judging' || ph === 'result';
    return {
      code: G.code, phase: ph, goal: G.goal, round: G.round,
      you: pid, hostPid: G.hostPid, singlePid: G.singlePid, winnerPid: G.winnerPid,
      players: G.players.map(p => ({
        pid: p.pid, name: p.name, score: p.score, connected: p.connected,
        done: ph === 'perks' ? !!p.date : ph === 'sabotage' ? (!G.order.includes(p.pid) || !!p.flag) : false
      })),
      perks: me ? me.perks : [], flags: me ? me.flags : [],
      date: me ? me.date : null, myFlag: me ? me.flag : null, target,
      table: open ? G.table.map(s => ({ pid: s.pid, cards: s.cards, flag: s.flag, by: ph === 'result' ? s.by : null })) : null
    };
  }

  function sync() {
    G.players.forEach(p => {
      if (p.conn && p.conn.open) { try { p.conn.send({ t: 'state', v: viewFor(p.pid) }); } catch (e) {} }
    });
    view = viewFor(myPid);
    render();
  }

  function toastAll(text) {
    G.players.forEach(p => { if (p.conn && p.conn.open) { try { p.conn.send({ t: 'toast', text }); } catch (e) {} } });
    toast(text);
  }

  /* ---------------- GUEST ---------------- */
  function joinRoom(code) {
    isHost = false; roomCode = code;
    busy = 'Joining ' + code + '…'; render();
    peer = new Peer();
    joinTimer = setTimeout(() => joinFail('Could not find that room. Check the code and make sure the host still has the game open.'), 15000);
    peer.on('open', () => connectHost());
    peer.on('error', err => {
      if (err.type === 'peer-unavailable') {
        if (view) { lost = true; render(); }
        else joinFail('No room with that code. Check it and try again.');
      } else if (!view) joinFail('Connection problem. Check your internet and try again.');
    });
    peer.on('disconnected', () => { if (peer && !peer.destroyed) peer.reconnect(); });
  }

  function connectHost() {
    const conn = peer.connect(PREFIX + roomCode, { reliable: true });
    hostConn = conn;
    conn.on('open', () => conn.send({ t: 'join', pid: myPid, name: myName }));
    conn.on('data', msg => {
      if (!msg || conn !== hostConn) return;
      if (msg.t === 'state') {
        clearTimeout(joinTimer); busy = ''; lost = false;
        if (!view) setRoomUrl(roomCode);
        view = msg.v; render();
      } else if (msg.t === 'toast') toast(msg.text);
      else if (msg.t === 'full') joinFail('That room is full.');
    });
    conn.on('close', () => { if (conn === hostConn && view) { lost = true; render(); } });
  }

  function joinFail(text) {
    clearTimeout(joinTimer);
    if (peer) { try { peer.destroy(); } catch (e) {} }
    peer = null; hostConn = null; view = null; busy = ''; homeErr = text;
    render();
  }

  function act(msg) {
    if (isHost) handle(myPid, msg);
    else if (hostConn && hostConn.open) hostConn.send(msg);
  }

  /* ---------------- RENDERING ---------------- */
  function setRoomUrl(code) {
    try { history.replaceState(null, '', location.pathname + '?room=' + code); } catch (e) {}
  }
  const shareUrl = () => location.origin + location.pathname + '?room=' + view.code;

  let toastTimer = null;
  function toast(text) {
    $toast.textContent = text; $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove('show'), 3500);
  }

  function render() {
    if (!view) { $app.innerHTML = homeHTML(); return; }
    const key = view.round + ':' + view.phase;
    if (key !== selKey) { selKey = key; sel = []; pickIdx = null; fillText = {}; }
    let html = view.phase === 'lobby' ? lobbyHTML() : view.phase === 'gameover' ? overHTML() : gameHTML();
    if (lost) {
      html += '<div class="overlay"><div class="dialog"><h2>Connection lost</h2>' +
        '<p>The link to the host dropped. If the host closed the game, the room is gone.</p>' +
        '<div class="row"><button class="btn primary" data-act="reconnect">Try to reconnect</button>' +
        '<button class="btn" data-act="leave">Leave</button></div></div></div>';
    }
    // keep the cursor where it was if the screen refreshes while someone is typing
    const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
    $app.innerHTML = html;
    if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
  }

  function homeHTML() {
    const dis = busy ? ' disabled' : '';
    return '<main class="home">' +
      '<h1 class="logo">Deal<br>Breaker<i>.</i></h1>' +
      '<p class="tag">Build the perfect date. Then ruin someone else\'s.</p>' +
      '<label class="field"><span>Your name</span>' +
      '<input id="name" maxlength="16" autocomplete="off" placeholder="e.g. Gary" value="' + esc(myName) + '"' + dis + '></label>' +
      '<button class="btn primary big" data-act="create"' + dis + '>Create a room</button>' +
      '<div class="or"><span>or join with a code</span></div>' +
      '<div class="joinrow"><input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" value="' + esc(roomCode) + '"' + dis + '>' +
      '<button class="btn big" data-act="join"' + dis + '>Join</button></div>' +
      (busy ? '<p class="note">' + esc(busy) + '</p>' : '') +
      (homeErr ? '<p class="err">' + esc(homeErr) + '</p>' : '') +
      '<ol class="how"><li>One player is single each round.</li>' +
      '<li>Everyone else builds them a date from two perks.</li>' +
      '<li>Then you each slap a red flag on a rival\'s date.</li>' +
      '<li>The single picks the date they could live with.</li></ol>' +
      '<p class="fine">' + MIN_PLAYERS + ' to ' + MAX_PLAYERS + ' players, each on their own phone or laptop. Adult humour, 18+.</p>' +
      '</main>';
  }

  function lobbyHTML() {
    const v = view, amHost = v.you === v.hostPid, n = v.players.length;
    const goals = [3, 5, 7, 10].map(g => '<option value="' + g + '"' + (g === v.goal ? ' selected' : '') + '>' + g + ' points</option>').join('');
    return '<main class="lobby">' +
      '<p class="eyebrow">Room code</p>' +
      '<div class="code">' + esc(v.code) + '</div>' +
      '<button class="btn small" data-act="copy">Copy invite link</button>' +
      '<h2>Players <span class="dim">' + n + '/' + MAX_PLAYERS + '</span></h2>' +
      '<ul class="plist">' + v.players.map(p =>
        '<li>' + esc(p.name) + (p.pid === v.hostPid ? ' <em>host</em>' : '') + (p.pid === v.you ? ' <em>you</em>' : '') + '</li>').join('') + '</ul>' +
      (amHost
        ? '<label class="field inline"><span>First to</span><select id="goal">' + goals + '</select></label>' +
          '<button class="btn primary big" data-act="start"' + (n < MIN_PLAYERS ? ' disabled' : '') + '>' +
          (n < MIN_PLAYERS ? 'Need ' + (MIN_PLAYERS - n) + ' more player' + (MIN_PLAYERS - n > 1 ? 's' : '') : 'Start game') + '</button>' +
          '<p class="fine">Keep this tab open. You are hosting, so the room closes if you leave.</p>'
        : '<p class="note">Waiting for the host to start. First to ' + v.goal + ' points wins.</p>') +
      '</main>';
  }

  function scoresHTML() {
    const v = view, playing = v.phase === 'perks' || v.phase === 'sabotage';
    return '<ul class="scores">' + v.players.map(p => {
      const single = p.pid === v.singlePid;
      const mark = single ? 'single' : (playing && p.done ? '✓' : '');
      return '<li class="' + (single ? 'single ' : '') + (p.connected ? '' : 'off ') + (p.pid === v.you ? 'me' : '') + '">' +
        '<span class="nm">' + esc(p.name) + '</span>' +
        (mark ? '<span class="mk">' + mark + '</span>' : '') +
        '<b>' + p.score + '</b></li>';
    }).join('') + '</ul>';
  }

  function gameHTML() {
    const v = view, ph = v.phase;
    const amSingle = v.you === v.singlePid, amHost = v.you === v.hostPid;
    const name = pid => { const p = v.players.find(x => x.pid === pid); return p ? p.name : 'Someone'; };
    const single = esc(name(v.singlePid));
    const waiting = v.players.filter(p => p.connected && p.pid !== v.singlePid && !p.done).length;
    const more = waiting + ' more player' + (waiting === 1 ? '' : 's');
    const cards = (list, cls) => list.map(c => '<div class="card ' + cls + '">' + show(c) + '</div>').join('');
    const hand = (list, cls) => '<div class="grid">' + list.map((c, i) =>
      '<button class="card ' + cls + (sel.includes(i) ? ' sel' : '') + '" data-act="sel" data-i="' + i + '">' + show(c) + '</button>').join('') + '</div>' +
      sel.filter(i => list[i] && list[i].includes(BLANK)).map(i =>
        '<label class="fillin"><span>Fill in the blank: ' + show(list[i]) + '</span>' +
        '<input id="fill-' + i + '" data-fill="' + i + '" maxlength="40" autocomplete="off" placeholder="Type anything" value="' + esc(fillText[i] || '') + '"></label>').join('');
    let status = '', body = '', action = '';

    if (ph === 'perks') {
      if (amSingle) {
        status = 'You are single this round. Your friends are building dates for you. Waiting on ' + more + '.';
        body = '<div class="grid">' + v.players.filter(p => p.pid !== v.singlePid && p.done).map(() => '<div class="card back"></div>').join('') + '</div>';
      } else if (v.date) {
        status = 'Date locked in. Waiting on ' + more + '.';
        body = '<div class="grid">' + cards(v.date, 'perk') + '</div>';
      } else {
        status = 'Build a date for ' + single + '. Pick 2 perks.';
        body = hand(v.perks, 'perk');
        action = '<button class="btn primary big" data-act="submit"' + (ready() ? '' : ' disabled') + '>Lock in this date</button>';
      }
    } else if (ph === 'sabotage') {
      if (v.target && !v.myFlag) {
        status = 'Now ruin ' + esc(v.target.name) + '\'s date. Pick a red flag.';
        body = '<p class="lbl">' + esc(v.target.name) + '\'s date</p><div class="grid">' + cards(v.target.cards, 'perk') + '</div>' +
          '<p class="lbl">Your red flags</p>' + hand(v.flags, 'flag');
        action = '<button class="btn primary big" data-act="submit"' + (ready() ? '' : ' disabled') + '>Plant red flag</button>';
      } else if (v.target) {
        status = 'Red flag planted. Waiting on ' + more + '.';
        body = '<p class="lbl">' + esc(v.target.name) + '\'s date, plus your gift</p><div class="grid">' + cards(v.target.cards, 'perk') + cards([v.myFlag], 'flag') + '</div>';
      } else {
        status = (amSingle ? 'Your dates are being sabotaged.' : 'The dates are being sabotaged.') + ' Waiting on ' + more + '.';
      }
    } else {
      const result = ph === 'result';
      if (result) {
        status = single + ' chose ' + esc(name(v.winnerPid)) + '\'s date.';
        action = (amSingle || amHost)
          ? '<button class="btn primary big" data-act="next">Next round</button>'
          : '<p class="note">Waiting for ' + single + ' to continue.</p>';
      } else if (amSingle) {
        status = 'Pick the date you could live with.';
        action = '<button class="btn primary big" data-act="confirm"' + (pickIdx === null ? ' disabled' : '') + '>Choose this date</button>';
      } else {
        status = single + ' is choosing. Make your case!';
      }
      body = '<div class="dates">' + v.table.map((s, i) => {
        const cls = 'date' + (result && s.pid === v.winnerPid ? ' win' : '') + (!result && pickIdx === i ? ' sel' : '');
        const inner = '<div class="who">' + esc(name(s.pid)) + '\'s date</div>' + cards(s.cards, 'perk') +
          (s.flag ? '<div class="but">but…</div>' + cards([s.flag], 'flag') : '') +
          (result && s.by ? '<div class="by">Sabotaged by ' + esc(name(s.by)) + '</div>' : '');
        return (!result && amSingle)
          ? '<button class="' + cls + '" data-act="pick" data-i="' + i + '">' + inner + '</button>'
          : '<div class="' + cls + '">' + inner + '</div>';
      }).join('') + '</div>';
    }

    const step = ph === 'perks' ? 0 : ph === 'sabotage' ? 1 : 2;
    const steps = ['Build a date from two perks', 'Plant a red flag on a rival', single + ' chooses'];
    return '<header class="bar"><span>Room <b>' + esc(v.code) + '</b></span><span>Round ' + v.round + '</span><span>First to ' + v.goal + '</span></header>' +
      scoresHTML() +
      '<main class="table">' +
      '<section class="prompt"><div class="brief"><h2>' + single + ' is looking for love.</h2><ol class="steps">' +
      steps.map((s, i) => '<li class="' + (i === step ? 'on' : '') + '"><span>' + (i + 1) + '</span>' + s + '</li>').join('') +
      '</ol></div></section>' +
      '<section class="play"><p class="status">' + status + '</p>' + body + '<div class="action">' + action + '</div></section>' +
      '</main>';
  }

  function overHTML() {
    const v = view, amHost = v.you === v.hostPid;
    const ranked = v.players.slice().sort((a, b) => b.score - a.score);
    return '<main class="lobby">' +
      '<p class="eyebrow">Game over</p>' +
      '<div class="code small">' + esc(ranked[0].name) + ' wins</div>' +
      '<ul class="plist rank">' + ranked.map((p, i) =>
        '<li><span>' + (i + 1) + '. ' + esc(p.name) + '</span><b>' + p.score + '</b></li>').join('') + '</ul>' +
      (amHost
        ? '<button class="btn primary big" data-act="start"' + (v.players.filter(p => p.connected).length < MIN_PLAYERS ? ' disabled' : '') + '>Play again</button>' +
          '<button class="btn" data-act="lobby">Back to lobby</button>'
        : '<p class="note">Waiting for the host to start another game.</p>') +
      '</main>';
  }

  /* ---------------- EVENTS ---------------- */
  // Right number of cards picked, and every fill-in card has its word.
  function ready() {
    const sab = view.phase === 'sabotage', list = sab ? view.flags : view.perks;
    return sel.length === (sab ? 1 : 2) && sel.every(i => !list[i].includes(BLANK) || (fillText[i] || '').trim());
  }

  function readName() {
    myName = myName.trim().slice(0, 16);
    if (!myName) { homeErr = 'Pick a name first.'; render(); return false; }
    save('localStorage', 'db_name', myName);
    homeErr = '';
    return true;
  }

  $app.addEventListener('input', e => {
    if (e.target.dataset.fill !== undefined) {
      fillText[e.target.dataset.fill] = e.target.value;
      const b = $app.querySelector('[data-act=submit]');
      if (b) b.disabled = !ready();
    }
    if (e.target.id === 'name') myName = e.target.value;
    if (e.target.id === 'code') { roomCode = cleanCode(e.target.value); e.target.value = roomCode; }
  });
  $app.addEventListener('change', e => {
    if (e.target.id === 'goal') act({ t: 'goal', goal: e.target.value });
  });
  $app.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'code') go('join');
    if (e.key === 'Enter' && e.target.dataset.fill !== undefined) go('submit');
  });
  $app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el && !el.disabled) go(el.dataset.act, el);
  });

  function go(a, el) {
    const i = el && el.dataset.i !== undefined ? parseInt(el.dataset.i, 10) : null;
    switch (a) {
      case 'create':
        if (typeof Peer === 'undefined') { homeErr = 'The connection library did not load. Refresh the page.'; render(); return; }
        if (readName()) createRoom();
        break;
      case 'join':
        if (typeof Peer === 'undefined') { homeErr = 'The connection library did not load. Refresh the page.'; render(); return; }
        if (!readName()) return;
        if (roomCode.length !== 5) { homeErr = 'Room codes are 5 letters.'; render(); return; }
        joinRoom(roomCode);
        break;
      case 'copy': {
        const url = shareUrl();
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => toast('Invite link copied.'), () => prompt('Copy this link:', url));
        else prompt('Copy this link:', url);
        break;
      }
      case 'start': act({ t: 'start' }); break;
      case 'lobby': act({ t: 'lobby' }); break;
      case 'sel': {
        const max = view.phase === 'sabotage' ? 1 : 2;
        const at = sel.indexOf(i);
        if (at >= 0) sel.splice(at, 1);
        else { if (sel.length >= max) sel.shift(); sel.push(i); }
        render();
        if (at < 0) { const box = document.getElementById('fill-' + i); if (box) box.focus(); }
        break;
      }
      case 'submit':
        if (!ready()) break;
        if (view.phase === 'perks') act({ t: 'date', cards: sel.map(x => view.perks[x]), fills: sel.map(x => fillText[x] || '') });
        else if (view.phase === 'sabotage') act({ t: 'flag', card: view.flags[sel[0]], fill: fillText[sel[0]] || '' });
        break;
      case 'pick': pickIdx = i; render(); break;
      case 'confirm': if (pickIdx !== null) act({ t: 'pick', i: pickIdx }); break;
      case 'next': act({ t: 'next' }); break;
      case 'reconnect':
        toast('Reconnecting…');
        if (peer && peer.disconnected && !peer.destroyed) peer.reconnect();
        if (peer && !peer.destroyed) connectHost();
        break;
      case 'leave': location.href = location.pathname; break;
    }
  }

  window.addEventListener('beforeunload', e => {
    if (isHost && G && G.players.length > 1) { e.preventDefault(); e.returnValue = ''; }
  });

  render();
})();
</script>
</body>
</html>
