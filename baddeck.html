  <title>Bad Deck — a party card game</title>

  <style>
    :root {
  --bg: #15151a;
  --panel: #1f1f27;
  --line: #34343f;
  --ink: #f6f5f0;
  --dim: #9a99a6;
  --accent: #ffd84a;
  --card-white: #fbfaf5;
  --card-black: #000;
  --danger: #ff7a6b;
  --radius: 14px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }

/* ---------- buttons & fields ---------- */
.btn {
  appearance: none;
  border: 2px solid var(--line);
  background: transparent;
  color: var(--ink);
  font-weight: 700;
  padding: 10px 18px;
  border-radius: 999px;
  cursor: pointer;
  transition: transform .08s, background .15s, border-color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #111; }
.btn.primary:hover:not(:disabled) { background: #ffe37a; border-color: #ffe37a; }
.btn.big { padding: 14px 24px; font-size: 1.05rem; }
.btn.small { padding: 6px 14px; font-size: .9rem; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.field { display: block; text-align: left; margin: 0 0 14px; }
.field span { display: block; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 6px; }
.field.inline { display: flex; align-items: center; gap: 12px; }
.field.inline span { margin: 0; }
input, select {
  width: 100%;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  font-weight: 700;
}
select { width: auto; }
input::placeholder { color: #666572; font-weight: 400; }

/* ---------- home & lobby ---------- */
.home, .lobby {
  max-width: 420px;
  margin: 0 auto;
  padding: 48px 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.logo {
  font-size: clamp(3.5rem, 18vw, 5.5rem);
  line-height: .9;
  letter-spacing: -.04em;
  margin: 0;
  font-weight: 900;
}
.tag { color: var(--dim); margin: 4px 0 20px; font-size: 1.05rem; }
.or { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: .85rem; margin: 8px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.joinrow { display: flex; gap: 10px; }
.joinrow input { text-transform: uppercase; letter-spacing: .3em; font-size: 1.2rem; text-align: center; }
.note { color: var(--dim); margin: 8px 0 0; }
.err { color: var(--danger); font-weight: 700; margin: 8px 0 0; }
.fine { color: var(--dim); font-size: .85rem; margin: 16px 0 0; }

.lobby { text-align: center; align-items: center; }
.lobby > * { width: 100%; }
.lobby > .btn.small { width: auto; }
.eyebrow { margin: 0; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); }
.code { font-size: clamp(3rem, 16vw, 4.5rem); font-weight: 900; letter-spacing: .12em; color: var(--accent); line-height: 1; margin-bottom: 4px; }
.code.small { font-size: 2.2rem; letter-spacing: 0; }
.lobby h2 { margin: 24px 0 0; font-size: 1.1rem; text-align: left; }
.dim { color: var(--dim); font-weight: 400; }
.plist { list-style: none; margin: 0 0 16px; padding: 0; text-align: left; }
.plist li { padding: 12px 14px; background: var(--panel); border-radius: 10px; margin-top: 8px; font-weight: 700; }
.plist em { font-style: normal; font-weight: 400; font-size: .8rem; color: var(--dim); margin-left: 6px; }
.plist.rank li { display: flex; justify-content: space-between; }
.plist.rank li:first-child { background: var(--accent); color: #111; }

/* ---------- game ---------- */
.bar {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 12px 20px;
  font-size: .85rem; color: var(--dim);
  border-bottom: 1px solid var(--line);
}
.bar b { color: var(--accent); letter-spacing: .1em; }

.scores {
  list-style: none; margin: 0; padding: 12px 20px;
  display: flex; gap: 8px; overflow-x: auto;
}
.scores li {
  flex: none; display: flex; align-items: center; gap: 8px;
  background: var(--panel); border: 2px solid transparent;
  border-radius: 999px; padding: 6px 8px 6px 14px; font-size: .9rem;
}
.scores li.me { border-color: var(--line); }
.scores li.judge { border-color: var(--accent); }
.scores li.off { opacity: .4; }
.scores .mk { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
.scores b { background: var(--bg); border-radius: 999px; min-width: 26px; text-align: center; padding: 2px 6px; }

.table {
  max-width: 1080px; margin: 0 auto; padding: 8px 20px 120px;
  display: grid; gap: 24px;
  grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 800px) {
  .table { grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
  .prompt { position: sticky; top: 16px; }
}

.card {
  position: relative;
  border-radius: var(--radius);
  padding: 16px;
  font-weight: 700;
  font-size: 1.05rem;
  line-height: 1.25;
  text-align: left;
  min-height: 150px;
  display: block;
  width: 100%;
  border: 2px solid transparent;
}
.card.black {
  background: var(--card-black); color: #fff;
  border-color: #2c2c35;
  font-size: 1.35rem; min-height: 220px; padding: 22px;
}
.card.white { background: var(--card-white); color: #111; }
button.card.white { cursor: pointer; transition: transform .1s, box-shadow .1s; }
button.card.white:hover { transform: translateY(-4px); }
.card.white.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); transform: translateY(-6px); }
.card.white.back {
  background: repeating-linear-gradient(45deg, #2a2a34 0 10px, #24242d 10px 20px);
  border-color: var(--line);
}
.badge {
  position: absolute; right: 10px; bottom: 10px;
  width: 28px; height: 28px; border-radius: 50%;
  background: #111; color: var(--accent);
  display: grid; place-items: center; font-size: .9rem;
}
.blank { display: inline-block; width: 4.5em; border-bottom: 3px solid #fff; vertical-align: baseline; }
.fill { color: var(--accent); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }

.status { margin: 0 0 16px; font-size: 1.15rem; font-weight: 700; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }

.subs { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.sub {
  display: flex; flex-direction: column; gap: 6px;
  padding: 6px; border-radius: calc(var(--radius) + 6px);
  border: 2px solid transparent; background: transparent; text-align: left;
}
button.sub { cursor: pointer; }
button.sub:hover { border-color: var(--line); }
.sub.sel { border-color: var(--accent); background: rgba(255, 216, 74, .08); }
.sub.win { border-color: var(--accent); background: rgba(255, 216, 74, .12); }
.sub .card { min-height: 120px; }
.who { font-size: .85rem; color: var(--dim); padding: 2px 8px 4px; font-weight: 700; }
.sub.win .who { color: var(--accent); }

.action { margin-top: 20px; }
@media (max-width: 799px) {
  .card.black { min-height: 0; font-size: 1.2rem; }
  .action:not(:empty) {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 30%);
  }
  .action .btn { width: 100%; }
}

/* ---------- overlay & toast ---------- */
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .75); display: grid; place-items: center; padding: 20px; z-index: 10; }
.dialog { background: var(--panel); border-radius: var(--radius); padding: 24px; max-width: 380px; }
.dialog h2 { margin: 0 0 8px; }
.dialog p { color: var(--dim); margin: 0 0 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

#toast {
  position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 20px);
  background: var(--ink); color: #111; font-weight: 700;
  padding: 10px 18px; border-radius: 999px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  max-width: calc(100vw - 40px); z-index: 20;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

  <script>
    /*
  Bad Deck — multiplayer over PeerJS (WebRTC).
  The player who creates the room is the "host": their browser holds the real
  game state and sends every other player a view of it. Nobody but the host
  ever sees another player's hand.
*/
(() => {
  'use strict';

  const PREFIX = 'baddeck-v1-';   // namespace for room ids on the PeerJS broker
  const HAND = 8;                 // white cards per player
  const MIN_PLAYERS = 3;
  const MAX_PLAYERS = 12;
  const BLANK = '_____';
  const LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; // no I or O

  const $app = document.getElementById('app');
  const $toast = document.getElementById('toast');

  /* ---------- small helpers ---------- */
  const load = (store, k) => { try { return window[store].getItem(k); } catch (e) { return null; } };
  const save = (store, k, v) => { try { window[store].setItem(k, v); } catch (e) {} };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pickCount = text => Math.max(1, text.split(BLANK).length - 1);
  const makeCode = () => Array.from({ length: 5 }, () => LETTERS[Math.floor(Math.random() * LETTERS.length)]).join('');
  const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 5);

  /* ---------- local state ---------- */
  let myPid = load('sessionStorage', 'bd_pid');
  if (!myPid) { myPid = Math.random().toString(36).slice(2, 12); save('sessionStorage', 'bd_pid', myPid); }
  let myName = load('localStorage', 'bd_name') || '';
  let roomCode = cleanCode(new URLSearchParams(location.search).get('room'));

  let peer = null, hostConn = null, isHost = false;
  let G = null;        // full game state (host only)
  let view = null;     // what this player is allowed to see
  let busy = '', homeErr = '', lost = false, joinTimer = null;
  let sel = [], pickIdx = null, selKey = '';

  /* =====================================================
     HOST: game logic
     ===================================================== */
  const P = pid => G.players.find(p => p.pid === pid);

  function createRoom() {
    isHost = true;
    const code = makeCode();
    busy = 'Creating room…'; render();
    peer = new Peer(PREFIX + code);
    peer.on('open', () => {
      busy = '';
      roomCode = code;
      G = {
        code, phase: 'lobby', goal: 7, round: 0, hostPid: myPid,
        players: [{ pid: myPid, name: myName, score: 0, hand: [], submission: null, conn: null, connected: true }],
        czarPid: null, black: null, table: [], winnerPid: null,
        whiteDeck: [], discard: [], blackDeck: []
      };
      setRoomUrl(code);
      sync();
    });
    peer.on('connection', conn => {
      conn.on('data', msg => {
        if (!G || !msg || typeof msg !== 'object') return;
        if (msg.t === 'join') hostJoin(conn, msg);
        else if (conn.pid) handle(conn.pid, msg);
      });
      conn.on('close', () => hostLeave(conn));
      conn.on('error', () => hostLeave(conn));
    });
    peer.on('error', err => {
      if (err.type === 'unavailable-id') { peer.destroy(); createRoom(); }   // code already taken, roll again
      else if (!G) { peer.destroy(); busy = ''; homeErr = 'Could not reach the connection server. Check your internet and try again.'; render(); }
    });
    peer.on('disconnected', () => { if (peer && !peer.destroyed) peer.reconnect(); });
  }

  function hostJoin(conn, msg) {
    const pid = String(msg.pid || '').slice(0, 20);
    const name = String(msg.name || '').trim().slice(0, 16) || 'Player';
    if (!pid) return;
    let p = P(pid);
    if (p) {                                   // same player coming back
      if (p.pid === G.hostPid) return;
      const old = p.conn;
      p.conn = conn; p.connected = true; p.name = name;
      if (old && old !== conn) { try { old.close(); } catch (e) {} }
    } else {
      if (G.players.length >= MAX_PLAYERS) { conn.send({ t: 'full' }); return; }
      p = { pid, name, score: 0, hand: [], submission: null, conn, connected: true };
      G.players.push(p);
      if (G.phase !== 'lobby' && G.phase !== 'gameover') refill(p);
    }
    conn.pid = pid;
    sync();
  }

  function hostLeave(conn) {
    if (!G || !conn.pid) return;
    const p = P(conn.pid);
    if (!p || p.conn !== conn) return;
    p.conn = null; p.connected = false;
    if (G.phase === 'lobby') { G.players = G.players.filter(x => x !== p); sync(); return; }
    if (p.pid === G.czarPid && (G.phase === 'playing' || G.phase === 'judging')) {
      toastAll(p.name + ' (the judge) dropped out. Round skipped.');
      startRound(); return;
    }
    maybeJudge();
    sync();
  }

  function draw() {
    if (!G.whiteDeck.length) { G.whiteDeck = shuffle(G.discard); G.discard = []; }
    return G.whiteDeck.pop();
  }
  function refill(p) {
    while (p.hand.length < HAND) { const c = draw(); if (c === undefined) break; p.hand.push(c); }
  }

  function startGame() {
    G.whiteDeck = shuffle(CARDS.white); G.discard = []; G.blackDeck = shuffle(CARDS.black);
    G.round = 0; G.czarPid = null;
    G.players = G.players.filter(p => p.connected);
    G.players.forEach(p => { p.score = 0; p.hand = []; p.submission = null; });
    startRound();
  }

  function startRound() {
    G.players.forEach(p => { if (p.submission) { G.discard.push(...p.submission); p.submission = null; } });
    G.table = []; G.winnerPid = null;
    const live = G.players.filter(p => p.connected);
    if (live.length < 2) {
      G.players = live; G.phase = 'lobby';
      toastAll('Not enough players left. Back to the lobby.');
      sync(); return;
    }
    // next connected player after the current judge
    const n = G.players.length;
    const cur = G.players.findIndex(p => p.pid === G.czarPid);
    for (let i = 1; i <= n; i++) {
      const cand = G.players[(cur + i + n) % n];
      if (cand.connected) { G.czarPid = cand.pid; break; }
    }
    if (!G.blackDeck.length) G.blackDeck = shuffle(CARDS.black);
    G.black = G.blackDeck.pop();
    G.round++;
    G.players.forEach(refill);
    G.phase = 'playing';
    sync();
  }

  function maybeJudge() {
    if (G.phase !== 'playing') return;
    const need = G.players.filter(p => p.connected && p.pid !== G.czarPid);
    if (need.length && need.every(p => p.submission)) {
      G.table = shuffle(G.players.filter(p => p.submission).map(p => ({ pid: p.pid, cards: p.submission })));
      G.phase = 'judging';
    }
  }

  // Every player action lands here (the host's own actions too).
  function handle(pid, msg) {
    const p = P(pid);
    if (!p) return;
    const amHost = pid === G.hostPid, amCzar = pid === G.czarPid;
    switch (msg.t) {
      case 'goal':
        if (amHost && G.phase === 'lobby') { G.goal = Math.min(15, Math.max(3, parseInt(msg.goal, 10) || 7)); sync(); }
        break;
      case 'start':
        if (amHost && (G.phase === 'lobby' || G.phase === 'gameover') &&
            G.players.filter(x => x.connected).length >= MIN_PLAYERS) startGame();
        break;
      case 'submit': {
        if (G.phase !== 'playing' || amCzar || p.submission) return;
        const cards = Array.isArray(msg.cards) ? msg.cards : [];
        if (cards.length !== pickCount(G.black)) return;
        if (new Set(cards).size !== cards.length || !cards.every(c => p.hand.includes(c))) return;
        p.hand = p.hand.filter(c => !cards.includes(c));
        p.submission = cards;
        refill(p);
        maybeJudge();
        sync();
        break;
      }
      case 'pick': {
        if (G.phase !== 'judging' || !amCzar) return;
        const s = G.table[msg.i];
        if (!s) return;
        G.winnerPid = s.pid;
        const w = P(s.pid); if (w) w.score++;
        G.phase = 'result';
        sync();
        break;
      }
      case 'next':
        if (G.phase !== 'result' || !(amHost || amCzar)) return;
        if (G.players.some(x => x.score >= G.goal)) { G.phase = 'gameover'; sync(); }
        else startRound();
        break;
      case 'lobby':
        if (amHost && G.phase === 'gameover') {
          G.players = G.players.filter(x => x.connected);
          G.players.forEach(x => { x.score = 0; x.hand = []; x.submission = null; });
          G.phase = 'lobby'; sync();
        }
        break;
    }
  }

    const me = P(pid);
    const open = G.phase === 'judging' || G.phase === 'result';
    return {
      code: G.code, phase: G.phase, goal: G.goal, round: G.round,
      you: pid, hostPid: G.hostPid, czarPid: G.czarPid, winnerPid: G.winnerPid,
      black: G.black, pick: G.black ? pickCount(G.black) : 1,
      players: G.players.map(p => ({ pid: p.pid, name: p.name, score: p.score, connected: p.connected, done: !!p.submission })),
      hand: me ? me.hand : [],
      mine: me ? me.submission : null,
      table: open ? G.table.map(s => ({ cards: s.cards, pid: G.phase === 'result' ? s.pid : null })) : null
    };
  }

  function sync() {
    G.players.forEach(p => {
      if (p.conn && p.conn.open) { try { p.conn.send({ t: 'state', v: viewFor(p.pid) }); } catch (e) {} }
    });
    view = viewFor(myPid);
    render();
  }

  function toastAll(text) {
    G.players.forEach(p => { if (p.conn && p.conn.open) { try { p.conn.send({ t: 'toast', text }); } catch (e) {} } });
    toast(text);
  }

     GUEST: connect to a host
     ===================================================== */
  function joinRoom(code) {
    isHost = false; roomCode = code;
    busy = 'Joining ' + code + '…'; render();
    peer = new Peer();
    joinTimer = setTimeout(() => joinFail('Could not find that room. Check the code and make sure the host still has the game open.'), 15000);
    peer.on('open', () => connectHost());
    peer.on('error', err => {
      if (err.type === 'peer-unavailable') {
        if (view) { lost = true; render(); }
        else joinFail('No room with that code. Check it and try again.');
      } else if (!view) joinFail('Connection problem. Check your internet and try again.');
    });
    peer.on('disconnected', () => { if (peer && !peer.destroyed) peer.reconnect(); });
  }

  function connectHost() {
    const conn = peer.connect(PREFIX + roomCode, { reliable: true });
    hostConn = conn;
    conn.on('open', () => conn.send({ t: 'join', pid: myPid, name: myName }));
    conn.on('data', msg => {
      if (!msg || conn !== hostConn) return;
      if (msg.t === 'state') {
        clearTimeout(joinTimer); busy = ''; lost = false;
        if (!view) setRoomUrl(roomCode);
        view = msg.v; render();
      } else if (msg.t === 'toast') toast(msg.text);
      else if (msg.t === 'full') joinFail('That room is full.');
    });
    conn.on('close', () => { if (conn === hostConn && view) { lost = true; render(); } });
  }

  function joinFail(text) {
    clearTimeout(joinTimer);
    if (peer) { try { peer.destroy(); } catch (e) {} }
    peer = null; hostConn = null; view = null; busy = ''; homeErr = text;
    render();
  }

    if (isHost) handle(myPid, msg);
    else if (hostConn && hostConn.open) hostConn.send(msg);
  }

    try { history.replaceState(null, '', location.pathname + '?room=' + code); } catch (e) {}
  }

  function toast(text) {
    $toast.textContent = text; $toast.classList.add('show');

      '<button class="btn big" data-act="join"' + dis + '>Join</button></div>' +
      (busy ? '<p class="note">' + esc(busy) + '</p>' : '') +
      (homeErr ? '<p class="err">' + esc(homeErr) + '</p>' : '') +

  }

        '<span class="nm">' + esc(p.name) + '</span>' +
        (mark ? '<span class="mk">' + mark + '</span>' : '') +
        '<b>' + p.score + '</b></li>';
    }).join('') + '</ul>';
  }

  function gameHTML() {
    const v = view;
    const amCzar = v.you === v.czarPid, amHost = v.you === v.hostPid;
    const name = pid => { const p = v.players.find(x => x.pid === pid); return p ? p.name : 'Someone'; };
    const waiting = v.players.filter(p => p.connected && p.pid !== v.czarPid && !p.done).length;
    let status = '', body = '', action = '', fills = null;

    if (v.phase === 'playing') {
      if (amCzar) {
        status = 'You are the judge this round. Waiting on ' + waiting + ' answer' + (waiting === 1 ? '' : 's') + '.';
        body = '<div class="grid">' + v.players.filter(p => p.pid !== v.czarPid && p.done)
          .map(() => '<div class="card white back"></div>').join('') + '</div>';
      } else if (v.mine) {
        status = 'Locked in. Waiting on ' + waiting + ' more.';
        body = '<div class="grid">' + v.mine.map(c => '<div class="card white">' + esc(c) + '</div>').join('') + '</div>';
      } else {
        status = v.pick > 1 ? 'Pick ' + v.pick + ' cards, in order.' : 'Pick your best answer.';
        fills = sel.map(i => v.hand[i]);
        body = '<div class="grid">' + v.hand.map((c, i) => {
          const at = sel.indexOf(i);
          return '<button class="card white' + (at >= 0 ? ' sel' : '') + '" data-act="sel" data-i="' + i + '">' + esc(c) +
            (at >= 0 && v.pick > 1 ? '<span class="badge">' + (at + 1) + '</span>' : '') + '</button>';
        }).join('') + '</div>';
        action = '<button class="btn primary big" data-act="submit"' + (sel.length === v.pick ? '' : ' disabled') + '>Play ' + (v.pick > 1 ? 'cards' : 'card') + '</button>';
      }
    } else {
      const result = v.phase === 'result';
      if (result) {
        const w = v.table.find(s => s.pid === v.winnerPid);
        fills = w ? w.cards : null;
        status = esc(name(v.winnerPid)) + ' wins the round.';
        action = (amCzar || amHost)
          ? '<button class="btn primary big" data-act="next">Next round</button>'
          : '<p class="note">Waiting for ' + esc(name(v.czarPid)) + ' to continue.</p>';
      } else if (amCzar) {
        status = 'Your call, judge. Pick the winner.';
        if (pickIdx !== null && v.table[pickIdx]) fills = v.table[pickIdx].cards;
        action = '<button class="btn primary big" data-act="confirm"' + (pickIdx === null ? ' disabled' : '') + '>Crown the winner</button>';
      } else {
        status = esc(name(v.czarPid)) + ' is choosing a winner.';
      }
      body = '<div class="subs">' + v.table.map((s, i) => {
        const cls = 'sub' + (result && s.pid === v.winnerPid ? ' win' : '') + (!result && pickIdx === i ? ' sel' : '');
        const inner = s.cards.map(c => '<div class="card white">' + esc(c) + '</div>').join('') +
          (result ? '<div class="who">' + esc(name(s.pid)) + '</div>' : '');
        return (!result && amCzar)
          ? '<button class="' + cls + '" data-act="pick" data-i="' + i + '">' + inner + '</button>'
          : '<div class="' + cls + '">' + inner + '</div>';
      }).join('') + '</div>';
    }

    return '<header class="bar"><span>Room <b>' + esc(v.code) + '</b></span><span>Round ' + v.round + '</span><span>First to ' + v.goal + '</span></header>' +
      scoresHTML() +
      '<main class="table">' +
      '<section class="prompt"><div class="card black">' + blackHTML(v.black, fills) + '</div></section>' +
      '<section class="play"><p class="status">' + status + '</p>' + body + '<div class="action">' + action + '</div></section>' +
      '</main>';
  }

  function overHTML() {
    const v = view, amHost = v.you === v.hostPid;
    const ranked = v.players.slice().sort((a, b) => b.score - a.score);
    return '<main class="lobby">' +
      '<p class="eyebrow">Game over</p>' +
      '<div class="code small">' + esc(ranked[0].name) + ' wins</div>' +
      '<ul class="plist rank">' + ranked.map((p, i) =>
        '<li><span>' + (i + 1) + '. ' + esc(p.name) + '</span><b>' + p.score + '</b></li>').join('') + '</ul>' +
      (amHost
        ? '<button class="btn primary big" data-act="start"' + (v.players.filter(p => p.connected).length < MIN_PLAYERS ? ' disabled' : '') + '>Play again</button>' +
          '<button class="btn" data-act="lobby">Back to lobby</button>'
        : '<p class="note">Waiting for the host to start another game.</p>') +
      '</main>';
  }

  /* =====================================================
     EVENTS
     ===================================================== */
  function readName() {
    myName = myName.trim().slice(0, 16);
    if (!myName) { homeErr = 'Pick a name first.'; render(); return false; }
    save('localStorage', 'bd_name', myName);
    homeErr = '';
    return true;
  }

  $app.addEventListener('input', e => {
    if (e.target.id === 'name') myName = e.target.value;
    if (e.target.id === 'code') { roomCode = cleanCode(e.target.value); e.target.value = roomCode; }
  });
  $app.addEventListener('change', e => {
    if (e.target.id === 'goal') act({ t: 'goal', goal: e.target.value });
  });
  $app.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'code') go('join');
  });
  $app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el && !el.disabled) go(el.dataset.act, el);
  });

  function go(a, el) {
    const i = el && el.dataset.i !== undefined ? parseInt(el.dataset.i, 10) : null;
    switch (a) {
      case 'create':
        if (typeof Peer === 'undefined') { homeErr = 'The connection library did not load. Refresh the page.'; render(); return; }
        if (readName()) createRoom();
        break;
      case 'join':
        if (typeof Peer === 'undefined') { homeErr = 'The connection library did not load. Refresh the page.'; render(); return; }
        if (!readName()) return;
        if (roomCode.length !== 5) { homeErr = 'Room codes are 5 letters.'; render(); return; }
        joinRoom(roomCode);
        break;
      case 'copy': {
        const url = shareUrl();
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => toast('Invite link copied.'), () => prompt('Copy this link:', url));
        else prompt('Copy this link:', url);
        break;
      }
      case 'start': act({ t: 'start' }); break;
      case 'lobby': act({ t: 'lobby' }); break;
      case 'sel': {
        const at = sel.indexOf(i);
        if (at >= 0) sel.splice(at, 1);
        else { if (sel.length >= view.pick) sel.shift(); sel.push(i); }
        render();
        break;
      }
      case 'submit':
        if (sel.length === view.pick) act({ t: 'submit', cards: sel.map(x => view.hand[x]) });
        break;
      case 'pick': pickIdx = i; render(); break;
      case 'confirm': if (pickIdx !== null) act({ t: 'pick', i: pickIdx }); break;
      case 'next': act({ t: 'next' }); break;
      case 'reconnect':
        toast('Reconnecting…');
        if (peer && peer.disconnected && !peer.destroyed) peer.reconnect();
        if (peer && !peer.destroyed) connectHost();
        break;
      case 'leave': location.href = location.pathname; break;
    }
  }

  window.addEventListener('beforeunload', e => {
    if (isHost && G && G.players.length > 1) { e.preventDefault(); e.returnValue = ''; }
  });

  render();
})();
  </script>
</body>
</html>
