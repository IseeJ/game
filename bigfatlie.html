<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Fat Lie — write a lie, spot the truth</title>
<meta name="description" content="Everyone invents a fake answer. The real one is hiding among them. Fool your friends and find the truth. Play with a room code.">
<style>
:root {
  --bg: #f6f3ed;
  --panel: #ece7de;
  --field: #fcfbf8;
  --line: #d8d1c4;
  --ink: #23211e;
  --dim: #7a7368;
  --accent: #2c6e68;
  --truth: #2f9b65;
  --lie: #b4532f;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Helvetica Neue", Helvetica, Arial, "Noto Sans Thai", Thonburi, Tahoma, sans-serif;
  font-size: 16px; line-height: 1.4; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.btn {
  appearance: none; border: 2px solid var(--line); background: transparent;
  font-weight: 700; padding: 10px 18px; border-radius: 999px; cursor: pointer;
  transition: transform .08s, border-color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.1); }
.btn.big { padding: 14px 24px; font-size: 1.05rem; }
.btn.small { padding: 6px 14px; font-size: .9rem; }
.field { display: block; text-align: left; margin: 0 0 14px; }
.field span { display: block; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 6px; }
.field.inline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.field.inline span { margin: 0; }
input, select { width: 100%; background: var(--field); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; font-weight: 700; }
select { width: auto; }
input::placeholder { color: #aaa397; font-weight: 400; }

.home, .lobby { max-width: 420px; margin: 0 auto; padding: 44px 20px 40px; display: flex; flex-direction: column; gap: 12px; }
.logo { font-size: clamp(3.2rem, 17vw, 4.8rem); line-height: .9; letter-spacing: -.04em; margin: 0; font-weight: 900; }
.logo i { font-style: normal; color: var(--lie); text-decoration: line-through; text-decoration-thickness: .08em; }
.tag { color: var(--dim); margin: 8px 0 18px; font-size: 1.05rem; }
.or { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: .85rem; margin: 6px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.joinrow { display: flex; gap: 10px; }
.joinrow input { text-transform: uppercase; letter-spacing: .3em; font-size: 1.15rem; text-align: center; min-width: 0; }
.joinrow input::placeholder { letter-spacing: normal; }
.joinrow .btn { flex: none; }
.note { color: var(--dim); margin: 8px 0 0; }
.err { color: #a3261c; font-weight: 700; margin: 8px 0 0; }
.fine { color: var(--dim); font-size: .85rem; margin: 14px 0 0; }
.how { margin: 18px 0 0; padding: 0 0 0 20px; color: var(--dim); font-size: .92rem; }
.how li { margin-bottom: 5px; }
.lobby { text-align: center; align-items: center; }
.lobby > * { width: 100%; }
.lobby > .btn.small { width: auto; }
.eyebrow { margin: 0; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); }
.code { font-size: clamp(3rem, 16vw, 4.4rem); font-weight: 900; letter-spacing: .12em; color: var(--accent); line-height: 1.05; }
.code.small { font-size: 2rem; letter-spacing: 0; line-height: 1.2; }
.lobby h2 { margin: 20px 0 0; font-size: 1.1rem; text-align: left; }
.packs { display: grid; gap: 6px; }
.lang { display: inline-flex; width: fit-content; flex: none; align-self: flex-end; background: var(--panel); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { appearance: none; border: 0; background: none; border-radius: 999px; padding: 5px 13px; font-weight: 700; font-size: .85rem; color: var(--dim); cursor: pointer; }
.lang button.on { background: var(--field); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.lang button:disabled { cursor: default; }
.field.inline .lang { align-self: center; }
.bar .lang { flex: none; margin-left: 10px; padding: 2px; }
.bar .lang button { padding: 2px 9px; font-size: .75rem; }
.bar > span:first-child { margin-right: auto; }
.pack, .tick { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); border-radius: 12px; font-weight: 700; text-align: left; cursor: pointer; }
.pack input, .tick input { flex: none; width: 18px; height: 18px; padding: 0; accent-color: var(--accent); }
.pack em, .tick em { margin-left: auto; font-style: normal; font-weight: 400; font-size: .85rem; color: var(--dim); }
.dim { color: var(--dim); font-weight: 400; }
.plist { list-style: none; margin: 0 0 14px; padding: 0; text-align: left; }
.plist li { padding: 12px 14px; background: var(--panel); border-radius: 12px; margin-top: 8px; font-weight: 700; }
.plist em { font-style: normal; font-weight: 400; font-size: .8rem; color: var(--dim); margin-left: 6px; }
.plist.rank li { display: flex; justify-content: space-between; }
.plist li:has(.kick) { display: flex; align-items: center; }
.kick { margin-left: auto; appearance: none; border: 2px solid var(--line); background: var(--field); border-radius: 999px; padding: 3px 11px; font-size: .78rem; font-weight: 700; color: var(--dim); cursor: pointer; }
.kick:hover { border-color: var(--lie); color: var(--lie); }
.plist.rank li.top { background: var(--accent); color: #fff; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; font-size: .85rem; color: var(--dim); border-bottom: 1px solid var(--line); }
.bar b { color: var(--accent); letter-spacing: .1em; }
.scores { list-style: none; margin: 0; padding: 12px 20px; display: flex; gap: 8px; overflow-x: auto; }
.scores li { flex: none; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 2px solid transparent; border-radius: 999px; padding: 5px 7px 5px 13px; font-size: .9rem; }
.scores li.me .nm { text-decoration: underline; text-underline-offset: 3px; }
.scores li.star { border-color: var(--accent); }
.scores li.off { opacity: .4; }
.scores .mk { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 700; }
.scores b { background: var(--bg); border-radius: 999px; min-width: 26px; text-align: center; padding: 2px 6px; }

.stage { max-width: 600px; margin: 0 auto; padding: 8px 20px 130px; }
.q { background: var(--ink); color: var(--bg); border-radius: var(--radius); padding: 20px 18px; }
.q p { margin: 0; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; opacity: .65; }
.q h2 { margin: 6px 0 0; font-size: 1.4rem; line-height: 1.3; font-weight: 700; }
.q .blank { display: inline-block; width: 4.5em; border-bottom: 3px solid currentColor; }
.q mark { background: var(--truth); color: #fff; padding: 0 .25em; border-radius: 5px; }
.status { margin: 16px 0 0; font-size: 1.1rem; font-weight: 700; }
.tip { margin: 6px 0 0; color: var(--dim); font-size: .92rem; }
#answer { margin-top: 14px; font-size: 1.1rem; }
.mine { margin: 14px 0 0; padding: 12px 14px; background: var(--panel); border-radius: 12px; }
.mine b { text-transform: uppercase; }
.opts { display: grid; gap: 10px; margin: 16px 0 0; }
.opt {
  appearance: none; display: block; width: 100%; text-align: left;
  background: var(--field); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 15px 16px; font-weight: 800; font-size: 1.1rem; text-transform: uppercase; letter-spacing: .01em;
}
button.opt { cursor: pointer; transition: transform .08s, border-color .15s; }
button.opt:hover:not(:disabled) { border-color: var(--ink); transform: translateY(-2px); }
button.opt:disabled { cursor: not-allowed; opacity: .5; }
.opt.sel { border-color: var(--accent); background: var(--panel); opacity: 1 !important; }
.opt.truth { border-color: var(--truth); box-shadow: inset 0 0 0 1px var(--truth); }
.opt small { display: block; margin-top: 6px; font-size: .8rem; font-weight: 700; text-transform: none; letter-spacing: 0; color: var(--dim); }
.opt small b { color: var(--lie); }
/* favourite votes: the heart on each lie at the reveal */
.opt:has(.fav) { display: flex; align-items: flex-start; gap: 10px; }
.opt:has(.fav) > span { flex: 1; min-width: 0; }
.fav { flex: none; appearance: none; border: 2px solid currentColor; background: transparent; color: var(--dim); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: .9rem; font-weight: 800; cursor: pointer; white-space: nowrap; }
.fav.on { background: var(--lie); border-color: var(--lie); color: #fff; }
.fav:disabled { cursor: default; opacity: .7; }
.crowd { margin: 18px 0 0; }
.opt.truth small b { color: var(--truth); }
.opt.trap { border-color: var(--lie); }
.gains li b.neg { color: var(--lie); }
.gains { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.gains li { background: var(--panel); border-radius: 999px; padding: 4px 12px; font-size: .9rem; font-weight: 700; }
.gains li b { color: var(--accent); }
.action { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 799px) {
  .action:not(:empty) { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); z-index: 5; }
  .action .btn { flex: 1; }
}

.overlay { position: fixed; inset: 0; background: rgba(35, 33, 30, .55); display: grid; place-items: center; padding: 20px; z-index: 10; }
.dialog { background: var(--bg); border-radius: var(--radius); padding: 24px; max-width: 380px; }
.dialog h2 { margin: 0 0 8px; }
.dialog p { color: var(--dim); margin: 0 0 18px; }
#toast { position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); font-weight: 700; padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 40px); z-index: 20; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* the host's "Remove a player" tab and list during a game */
.hosttab { position: fixed; right: 0; top: 40%; z-index: 30; writing-mode: vertical-rl; padding: 10px 5px; border: 0; border-radius: 10px 0 0 10px; background: rgba(40, 40, 40, .82); color: #fff; font: inherit; font-size: .72rem; font-weight: 700; letter-spacing: .04em; cursor: pointer; opacity: .75; }
.hosttab:hover, .hosttab:focus-visible { opacity: 1; }
.hostbox { position: fixed; inset: 0; z-index: 40; background: rgba(20, 20, 20, .6); display: grid; place-items: center; padding: 20px; }
.hostbox[hidden], .hosttab[hidden] { display: none; }
.hostcard { width: 100%; max-width: 360px; max-height: 80vh; overflow: auto; background: #fff; color: #222; border-radius: 16px; padding: 22px; text-align: left; }
.hostcard h2 { margin: 0 0 6px; font-size: 1.2rem; }
.hostcard p { margin: 0 0 14px; color: #666; font-size: .9rem; }
.hostcard ul { list-style: none; margin: 0 0 14px; padding: 0; }
.hostcard li { display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin-top: 6px; border-radius: 10px; background: #f1f1f1; font-weight: 700; }
.hostcard li em { font-style: normal; font-weight: 400; font-size: .8rem; color: #888; }
.hostcard .hostclose { width: 100%; padding: 11px; border: 2px solid #ccc; border-radius: 999px; background: #fff; color: #222; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>

// Two answers count as the same if they match once case, punctuation and "a/an/the" are ignored.
const tidy = s => String(s || '').toLowerCase().replace(/[^\p{L}\p{M}\p{N}\s]/gu, ' ').replace(/\b(a|an|the)\b/g, ' ').replace(/\s+/g, ' ').trim();

const FOOL = 2;    // bluff: points for each friend who picks the lie you wrote

const TRAP = 1;    // bluff: points you LOSE for picking one of the game's own decoys. (0 would mean no penalty.)
const KNOWN = 4;   // "About us": points the person the question is about earns for EACH friend who finds their truth
const QUIZ = 1;    // quiz: points for a right answer

// A fact is ['question', 'answer', 'other accepted spellings'..., ['wrong answer', ...]]. The last list is optional.
const truthsOf = f => f.slice(1).filter(x => typeof x === 'string');
const decoysOf = f => f.find(x => Array.isArray(x)) || [];

    'Tick a pack of facts first.': 'เลือกชุดคำถามความรู้ก่อน', 'Not enough players left. Back to the lobby.': 'ผู้เล่นเหลือไม่พอ กลับไปที่ห้องรอ',
    'Nothing to ask with these packs and this many players.': 'ชุดคำถามที่เลือกกับจำนวนคนเท่านี้ ไม่มีข้อไหนถามได้',
    'No ready-made lie for this one. Write your own.': 'ข้อนี้ไม่มีคำโกหกสำเร็จรูป แต่งเองนะ', 'That is the real answer! Write a lie instead.': 'นั่นมันคำตอบจริง! แต่งเรื่องโกหกแทนสิ',
    'Pick a name first.': 'ใส่ชื่อก่อน', 'The connection library did not load. Refresh the page.': 'โหลดตัวเชื่อมต่อไม่สำเร็จ ลองรีเฟรชหน้านี้',
    'Room codes are 5 letters.': 'รหัสห้องมี 5 ตัวอักษร', 'Invite link copied.': 'คัดลอกลิงก์แล้ว', 'Copy this link:': 'คัดลอกลิงก์นี้:', 'Reconnecting…': 'กำลังเชื่อมต่อใหม่…'
  };
  // Question packs come from bfl.js, and their Thai versions from bfl-th.js (optional: without it there is no language switch).
  const DATA = { en: { packs: typeof PACKS !== 'undefined' ? PACKS : { 'Weird facts': FACTS }, about: ABOUT, us: 'About us' } };
  if (typeof BFL_TH !== 'undefined' && BFL_TH && BFL_TH.PACKS) DATA.th = { packs: BFL_TH.PACKS, about: BFL_TH.ABOUT || [], us: 'เรื่องของพวกเรา' };
  const dataOf = l => DATA[l] || DATA.en;
  const packNames = l => Object.keys(dataOf(l).packs).concat(dataOf(l).about.length ? [dataOf(l).us] : []);
  const packSize = (l, n) => n === dataOf(l).us ? dataOf(l).about.length : dataOf(l).packs[n].length;
  const GD = () => dataOf(G.lang), isUs = n => n === GD().us;          // host: the data for the room's language

  const $app = document.getElementById('app'), $toast = document.getElementById('toast');
  const load = (store, k) => { try { return window[store].getItem(k); } catch (e) { return null; } };
  const save = (store, k, v) => { try { window[store].setItem(k, v); } catch (e) {} };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const makeCode = () => Array.from({ length: 5 }, () => LETTERS[Math.floor(Math.random() * LETTERS.length)]).join('');
  const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 5);
  const cleanText = s => String(s || '').replace(/\s+/g, ' ').trim().slice(0, MAX_LEN).replace(/[.\s]+$/, '');

  let myPid = load('sessionStorage', 'bfl_pid');
  if (!myPid) { myPid = Math.random().toString(36).slice(2, 12); save('sessionStorage', 'bfl_pid', myPid); }
  let myName = load('localStorage', 'bfl_name') || '';
  let roomCode = cleanCode(new URLSearchParams(location.search).get('room'));

  let peer = null, hostConn = null, isHost = false;
  let G = null;        // full game state (host only)
  let view = null;     // what this player is allowed to see
  let busy = '', homeErr = '', lost = false, joinTimer = null;
  let draft = '', nope = '', selKey = '';
  let race = null;     // my own progress in a timed quiz: { id, i, score, ms, picked, t0 }
  let uiLang = load('localStorage', 'bfl_lang') === 'th' ? 'th' : 'en';     // the language of MY screen. Each player picks their own, at any time.
  const lang = () => uiLang;
  const roomLang = () => DATA[uiLang] ? uiLang : 'en';                     // a new room asks its questions in the host's language to begin with
  const t = (s, ...a) => ((lang() === 'th' && TH_UI[s]) || s).replace(/\{(\d)\}/g, (m, i) => a[i]);

  // The packs the host ticked last time, or all of them.
  const packsKey = l => l === 'th' ? 'bfl_packs_th' : 'bfl_packs';
  function savedPacks(l) {
    let list = [];
    try { list = JSON.parse(load('localStorage', packsKey(l))) || []; } catch (e) {}
    list = packNames(l).filter(n => Array.isArray(list) && list.includes(n));
    return list.length ? list : packNames(l);
  }

  // Solo: the best result so far, kept on this device.
  function bestSolo() { try { const b = JSON.parse(load('localStorage', 'bfl_best')); return b && b.of ? b : null; } catch (e) { return null; } }
  function keepBest(score, of, ms) {          // better score first; then more questions; then a faster time
    const b = bestSolo(), r = score / of, br = b ? b.score / b.of : -1;
    if (!b || r > br || (r === br && (of > b.of || (of === b.of && ms && (!b.ms || ms < b.ms))))) save('localStorage', 'bfl_best', JSON.stringify({ score, of, ms: ms || 0 }));
  }
  const clock = ms => { const s = ms / 1000; return s < 60 ? s.toFixed(1) + 's' : Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };
  const bestText = b => b.ms ? t('{0} of {1} in {2}', b.score, b.of, clock(b.ms)) : t('{0} of {1}', b.score, b.of);

  /* ---------------- HOST ---------------- */
  const P = pid => G.players.find(p => p.pid === pid);
  const isLive = pid => { const p = P(pid); return !!(p && p.connected); };

  function createRoom() {
    isHost = true;
    const code = makeCode();
    busy = t('Creating room…'); render();
    peer = new Peer(PREFIX + code);
    peer.on('open', () => {
      busy = ''; roomCode = code;
      G = {
        code, phase: 'lobby', solo: false, mode: load('localStorage', 'bfl_mode') === 'quiz' ? 'quiz' : 'bluff',
        timed: load('localStorage', 'bfl_timed') === '1', race: null, raced: false,
        skip: load('localStorage', 'bfl_skip') === '1',      // may the host carry on without waiting for everyone?
        fav: load('localStorage', 'bfl_fav') === '1', favs: {},  // favourite votes: a ♥ for the best lie each round, and a prize for the most loved
        streak: 0, canned: {}, rounds: 8, lang: roomLang(), packs: savedPacks(roomLang()),
        round: 0, hostPid: myPid,
        players: [{ pid: myPid, name: myName, score: 0, gain: 0, conn: null, connected: true }],
        q: null, writers: [], subs: {}, options: [], votes: {}, decks: { facts: [], us: [] }, pool: [], lastSubject: null, kicked: []
      };
      setRoomUrl(code);
      sync();
    });
    peer.on('connection', conn => {
      conn.on('data', msg => {
        if (!G || !msg || typeof msg !== 'object') return;
        if (msg.t === 'join') hostJoin(conn, msg);
        else if (conn.pid) handle(conn.pid, msg);
      });
      conn.on('close', () => hostLeave(conn));
      conn.on('error', () => hostLeave(conn));
    });
    peer.on('error', err => {
      if (err.type === 'unavailable-id') { peer.destroy(); createRoom(); }
      else if (!G) { peer.destroy(); busy = ''; homeErr = t('Could not reach the connection server. Check your internet and try again.'); render(); }
    });
    peer.on('disconnected', () => { if (peer && !peer.destroyed) peer.reconnect(); });
  }

  // Solo: the same game with nobody else in it, so no connection is needed at all.
  function startSolo() {
    isHost = true;
    G = {
      code: '', phase: 'lobby', solo: true, skip: false, mode: 'quiz', streak: 0, canned: {}, rounds: 10, lang: roomLang(), packs: savedPacks(roomLang()),
      timed: load('localStorage', 'bfl_timed') === '1', race: null, raced: false,
      round: 0, hostPid: myPid,
      players: [{ pid: myPid, name: myName.trim() || t('You'), score: 0, gain: 0, conn: null, connected: true }],
      q: null, writers: [], subs: {}, options: [], votes: {}, decks: { facts: [], us: [] }, pool: [], lastSubject: null, kicked: []
    };
    sync();
  }

  function hostJoin(conn, msg) {
    const pid = String(msg.pid || '').slice(0, 20);
    const name = String(msg.name || '').trim().slice(0, 16) || 'Player';
    if (!pid) return;
    if (G.kicked.includes(pid)) { conn.send({ t: 'kicked' }); return; }               // removed by the host: not let back into this room
    let p = P(pid);
    if (p) {                                   // same player coming back
      if (p.pid === G.hostPid) return;
      const old = p.conn;
      p.conn = conn; p.connected = true; p.name = name;
      if (old && old !== conn) { try { old.close(); } catch (e) {} }
    } else {
      if (G.players.length >= MAX_PLAYERS) { conn.send({ t: 'full' }); return; }
      G.players.push({ pid, name, score: 0, gain: 0, conn, connected: true });
    }
    conn.pid = pid;
    sync();
  }

  function hostLeave(conn) {
    if (!G || !conn.pid) return;
    const p = P(conn.pid);
    if (!p || p.conn !== conn) return;
    p.conn = null; p.connected = false;
    if (G.phase === 'lobby') { G.players = G.players.filter(x => x !== p); sync(); return; }
    if (G.phase === 'write' && G.q.subject === p.pid && !G.subs[p.pid]) {
      toastAll('{0} left before telling the truth. Next question.', p.name);
      G.round--; startRound(); return;
    }
    if (G.phase === 'race') finishRace();
    if (G.phase === 'write') maybeVote();
    else if (G.phase === 'vote') maybeReveal();
    sync();
  }

  /* Questions already asked are remembered on the host's device (across games, rooms and days), so the
     same one does not come round again until every question in the ticked packs has had its turn. */
  const qid = x => { const s = String(Array.isArray(x) ? x[0] : x.f[0]); let n = 2166136261; for (let i = 0; i < s.length; i++) { n ^= s.charCodeAt(i); n = Math.imul(n, 16777619); } return (n >>> 0).toString(36); };
  let asked = null;
  const askedSet = () => { if (!asked) { try { asked = new Set(JSON.parse(load('localStorage', 'bfl_asked')) || []); } catch (e) { asked = new Set(); } } return asked; };
  const keepAsked = () => save('localStorage', 'bfl_asked', JSON.stringify([...askedSet()].slice(-6000)));

  function draw(kind, list) {
    const seen = askedSet();
    if (!G.decks[kind].length) {
      let fresh = list.map((x, i) => i).filter(i => !seen.has(qid(list[i])));
      if (!fresh.length) {                      // every one of these has been asked: forget them and go round again
        list.forEach(x => seen.delete(qid(x)));
        fresh = list.map((x, i) => i);
      }
      G.decks[kind] = shuffle(fresh);
    }
    const item = list[G.decks[kind].pop()];
    seen.add(qid(item)); keepAsked();
    return item;
  }

  // n wrong answers for a fact (d = { f: the fact, pack: its pack }), avoiding anything in `taken`.
  // The fact's own wrong answers come first. If it has none, real answers are borrowed from
  // other facts in the pack, preferring ones that look alike (numbers for numbers, similar length).
  function wrongAnswers(d, n, taken) {
    const truths = truthsOf(d.f), isNum = /\d/.test(truths[0]), words = truths[0].split(' ').length;
    const avoid = new Set(truths.map(tidy).concat(taken)), out = [];
    const take = list => { for (const x of shuffle(list)) { if (out.length >= n) return; const k = tidy(x); if (k && !avoid.has(k)) { avoid.add(k); out.push(x); } } };
    take(decoysOf(d.f));
    if (out.length < n) {
      const others = GD().packs[d.pack].filter(g => g !== d.f).map(g => truthsOf(g)[0]);
      take(others.filter(a => /\d/.test(a) === isNum && Math.abs(a.split(' ').length - words) <= 1));
      take(others);
    }
    return out;
  }

  function startGame() {
    G.players = G.players.filter(p => p.connected);
    G.players.forEach(p => { p.score = 0; p.gain = 0; p.likes = 0; });
    G.round = 0; G.lastSubject = null; G.streak = 0;
    // Every fact from every ticked pack goes into one shuffled pile, remembering which pack it came from.
    G.pool = [].concat(...G.packs.filter(n => !isUs(n)).map(n => GD().packs[n].map(f => ({ f, pack: n }))));
    G.decks.facts = [];
    G.raced = false;
    if (G.mode === 'quiz' && G.timed) startRace(); else startRound();
  }

  /* A timed quiz is a race. Everyone is handed the same questions at once and works through
     them at their own pace on their own screen, reporting their score and time as they go.
     Nobody waits for anybody; the game ends when the last player finishes. */
  function startRace() {
    const live = G.players.filter(p => p.connected);
    if (!G.pool.length || !live.length) {
      G.phase = 'lobby'; G.players = live;
      toastAll('Tick a pack of facts first.');
      sync(); return;
    }
    const qs = [], n = Math.min(G.rounds, G.pool.length);
    for (let k = 0; k < n; k++) {
      const d = draw('facts', G.pool), truth = truthsOf(d.f)[0];
      const options = shuffle([truth].concat(wrongAnswers(d, 3, [])));
      qs.push({ kind: 'quiz', label: d.pack, text: d.f[0], options, truth: options.indexOf(truth) });
    }
    G.race = { id: Date.now(), qs };
    G.players.forEach(p => { p.racing = p.connected; p.rAt = 0; p.rMs = 0; p.rDone = false; p.score = 0; p.gain = 0; });
    G.raced = true; G.round = 0; G.q = null;
    G.phase = 'race';
    sync();
  }

  function finishRace(now) {                  // now: the host has called time
    if (G.phase !== 'race') return;
    if (!now && !G.players.filter(p => p.racing).every(p => p.rDone || !p.connected)) return;
    G.phase = 'gameover';
    if (G.solo) keepBest(P(myPid).score, G.race.qs.length, P(myPid).rMs);
  }

  function startRound() {
    const live = G.players.filter(p => p.connected), quiz = G.mode === 'quiz';
    const useFacts = G.pool.length > 0;
    const useUs = !quiz && G.packs.some(isUs) && GD().about.length > 0 && live.length >= 3;     // "About us" needs someone to lie and someone else to guess
    if (live.length < needPlayers(G.mode, G.solo) || (!useFacts && !useUs)) {
      G.phase = 'lobby'; G.players = live;
      toastAll(useFacts || useUs ? 'Not enough players left. Back to the lobby.' : 'Nothing to ask with these packs and this many players.');
      sync(); return;
    }
    G.round++;
    G.writers = []; G.subs = {}; G.canned = {}; G.options = []; G.votes = {}; G.favs = {};
    G.players.forEach(p => { p.gain = 0; p.up = 0; p.down = 0; });
    // With both fact packs and "About us" ticked, the two kinds of question take turns.
    const kind = quiz ? 'quiz' : useFacts && useUs ? (G.round % 2 ? 'facts' : 'us') : useFacts ? 'facts' : 'us';
    if (kind === 'us') {
      const n = G.players.length, cur = G.players.findIndex(p => p.pid === G.lastSubject);   // the next friend in turn
      let subject = live[0];
      for (let i = 1; i <= n; i++) { const c = G.players[(cur + i + n) % n]; if (c.connected) { subject = c; break; } }
      G.lastSubject = subject.pid;
      const a = draw('us', GD().about);
      G.q = { kind, you: a[0], them: a[1], truths: [], subject: subject.pid };
    } else {
      const d = draw('facts', G.pool);
      G.q = { kind, d, label: d.pack, text: d.f[0], truths: truthsOf(d.f), subject: null };
    }
    if (kind === 'quiz') {                      // no lying: the truth and three wrong answers, straight to the vote
      G.options = shuffle([{ text: G.q.truths[0], truth: true, authors: [] }]
        .concat(wrongAnswers(G.q.d, 3, []).map(text => ({ text, truth: false, authors: [], house: true }))));
      G.phase = 'vote';
    } else {
      G.writers = live.map(p => p.pid);
      G.phase = 'write';
    }
    sync();
  }

  const isTruth = text => G.q.truths.some(t => tidy(t) === tidy(text));

  function maybeVote() {
    if (G.phase !== 'write') return;
    if (!G.writers.filter(isLive).every(pid => G.subs[pid])) return;
    if (G.q.kind === 'us') G.q.truths = [G.subs[G.q.subject]];
    // The truth, plus every lie. Identical lies become one answer with several authors.
    const opts = [{ text: G.q.truths[0], truth: true, authors: [] }];
    G.writers.forEach(pid => {
      const text = G.subs[pid];
      if (!text || pid === G.q.subject) return;
      if (isTruth(text)) { opts[0].authors.push(pid); return; }          // stumbled on the truth: no lie to show
      const same = opts.find(o => !o.truth && tidy(o.text) === tidy(text));
      if (same) same.authors.push(pid); else opts.push({ text, truth: false, authors: [pid] });
    });
    // The game adds decoys of its own until there are four choices in all (three wrong answers and the truth).
    // Two players: 2 lies + 1 decoy. Three or more: no decoys unless two lies were the same. Picking a decoy costs points.
    const lies = opts.length - 1;
    const extra = Math.max(0, 3 - lies);
    if (G.q.kind === 'facts' && extra > 0) {
      wrongAnswers(G.q.d, extra, opts.map(o => tidy(o.text))).forEach(text => opts.push({ text, truth: false, authors: [], house: true }));
    }
    G.options = shuffle(opts);
    G.phase = 'vote';
    maybeReveal();
  }

  const voters = () => G.players.filter(p => p.connected && p.pid !== G.q.subject);

  function maybeReveal() {
    if (G.phase !== 'vote') return;
    const v = voters();
    if (v.length && !v.every(p => G.votes[p.pid] !== undefined)) return;
    reveal();
  }

  function reveal() {
    const add = (pid, n) => { const p = P(pid); if (p) { p.score += n; p.gain += n; if (n > 0) p.up = (p.up || 0) + n; else p.down = (p.down || 0) - n; } };
    Object.keys(G.votes).forEach(pid => {
      const o = G.options[G.votes[pid]];
      if (G.q.kind === 'quiz') { if (o.truth) add(pid, QUIZ); }
      else if (o.truth) { add(pid, FIND); if (G.q.kind === 'us' && G.q.subject) add(G.q.subject, KNOWN); }   // "About us": the truth-teller is rewarded for being known
      else if (o.house) { if (TRAP) add(pid, -TRAP); }                     // fell for one of the game's decoys
      else o.authors.forEach(a => add(a, G.canned[a] ? CANNED : FOOL));
    });
    if (G.solo) { const o = G.options[G.votes[myPid]]; G.streak = o && o.truth ? G.streak + 1 : 0; }
    G.phase = 'reveal';
  }

  // Every player action lands here (the host's own actions too).
  function handle(pid, msg) {
    const p = P(pid);
    if (!p) return;
    const amHost = pid === G.hostPid;
    switch (msg.t) {
      case 'rounds':
        if (amHost && G.phase === 'lobby') { G.rounds = Math.min(30, Math.max(3, parseInt(msg.rounds, 10) || 8)); sync(); }
        break;
      case 'pack':                              // tick or untick one pack
        if (!amHost || G.phase !== 'lobby' || !packNames(G.lang).includes(msg.name)) return;
        G.packs = packNames(G.lang).filter(n => n === msg.name ? !!msg.on : G.packs.includes(n));
        if (!G.packs.length) G.packs = [msg.name];              // at least one pack stays on
        save('localStorage', packsKey(G.lang), JSON.stringify(G.packs));
        sync();
        break;
      case 'lang':                              // the language of the QUESTIONS, which everyone shares. Screens are each player's own.
        if (!amHost || G.phase !== 'lobby' || !DATA[msg.lang] || msg.lang === G.lang) return;
        G.lang = msg.lang;
        G.packs = savedPacks(G.lang); G.decks = { facts: [], us: [] };
        sync();
        break;
      case 'mode':
        if (amHost && G.phase === 'lobby' && !G.solo && msg.mode in MODES) { G.mode = msg.mode; sync(); }
        break;
      case 'timed':
        if (amHost && G.phase === 'lobby') { G.timed = !!msg.on; sync(); }
        break;
      case 'kick': {                            // host: remove a player from the room, in the lobby or mid-game
        const out = P(String(msg.pid));
        if (!amHost || !out || out.pid === G.hostPid) return;
        G.kicked.push(out.pid);
        const c = out.conn;
        if (c) { try { c.send({ t: 'kicked' }); } catch (e) {} setTimeout(() => { try { c.close(); } catch (e) {} }, 300); }
        if (G.phase === 'lobby') { out.conn = null; G.players = G.players.filter(x => x !== out); }
        else if (c) hostLeave(c);               // mid-game: exactly as if they had dropped out, so the round stops waiting for them
        else out.connected = false;
        sync();
        break;
      }
      case 'allowfav':
        if (amHost && G.phase === 'lobby') { G.fav = !!msg.on; sync(); }
        break;
      case 'fav': {                             // a ♥ for a favourite lie, after the answer is shown. One per player per question; tapping another moves it.
        if (!G.fav || G.solo || G.mode !== 'bluff' || G.phase !== 'reveal') return;
        const likeable = o => o && !o.truth && !o.house && o.authors.length && !o.authors.includes(pid) && !o.authors.every(a => G.canned[a]);
        const give = (i, n) => G.options[i].authors.forEach(a => { const w = P(a); if (w) w.likes = Math.max(0, (w.likes || 0) + n); });
        const i = msg.i, had = G.favs[pid];
        if (!Number.isInteger(i) || !likeable(G.options[i])) return;
        if (had !== undefined) give(had, -1);
        if (had === i) delete G.favs[pid]; else { G.favs[pid] = i; give(i, 1); }
        sync();
        break;
      }
      case 'allowskip':
        if (amHost && G.phase === 'lobby') { G.skip = !!msg.on; sync(); }
        break;
      case 'race': {                            // a racer reporting where they have got to
        if (G.phase !== 'race' || !p.racing || p.rDone) return;
        const n = G.race.qs.length;
        p.rAt = Math.max(0, Math.min(n, parseInt(msg.i, 10) || 0));
        p.score = Math.max(0, Math.min(p.rAt, parseInt(msg.score, 10) || 0));
        p.rMs = Math.max(0, parseInt(msg.ms, 10) || 0);
        p.rDone = !!msg.done && p.rAt >= n;
        finishRace();
        sync();
        break;
      }
      case 'start':
        if (amHost && (G.phase === 'lobby' || G.phase === 'gameover') &&
            G.players.filter(x => x.connected).length >= needPlayers(G.mode, G.solo)) startGame();
        break;
      case 'write': {
        if (G.phase !== 'write' || !G.writers.includes(pid) || G.subs[pid]) return;
        let text = cleanText(msg.text);
        if (msg.canned) {                         // they asked for a ready-made lie (worth half)
          if (G.q.kind !== 'facts') return;
          text = wrongAnswers(G.q.d, 1, Object.values(G.subs).map(tidy))[0];
          if (!text) { tell(pid, { t: 'nope', why: 'none' }); return; }
          G.canned[pid] = true;
        } else {
          if (!text) return;
          if (G.q.kind === 'facts' && isTruth(text)) { tell(pid, { t: 'nope' }); return; }   // they wrote the real answer
        }
        G.subs[pid] = text;
        maybeVote();
        sync();
        break;
      }
      case 'vote': {
        const o = G.phase === 'vote' && G.options[msg.i];
        if (!o || pid === G.q.subject || o.authors.includes(pid) && !o.truth || G.votes[pid] !== undefined) return;
        G.votes[pid] = msg.i;
        maybeReveal();
        sync();
        break;
      }
      case 'skip':                              // don't wait for stragglers. Only if the room allows it.
        if (!amHost || !G.skip) return;
        if (G.phase === 'race') { finishRace(true); sync(); return; }   // call time on the race
        if (G.phase === 'write' && (G.q.kind === 'facts' || G.subs[G.q.subject])) {
          G.writers = G.writers.filter(w => G.subs[w]); maybeVote(); sync();
        } else if (G.phase === 'vote') { reveal(); sync(); }
        break;
      case 'next':
        if (G.phase !== 'reveal' || !(amHost || pid === G.q.subject)) return;
        if (G.round >= G.rounds) { G.phase = 'gameover'; if (G.solo) keepBest(P(myPid).score, G.rounds); sync(); }
        else startRound();
        break;
      case 'lobby':
        if (amHost && G.phase === 'gameover') {
          G.players = G.players.filter(x => x.connected);
          G.players.forEach(x => { x.score = 0; });
          G.phase = 'lobby'; sync();
        }
        break;
    }
  }

  function viewFor(pid) {
    const ph = G.phase, q = G.q;
    const v = {
      code: G.code, phase: ph, lang: G.lang, skip: !!G.skip, fav: !!G.fav && !G.solo && G.mode === 'bluff', solo: G.solo, mode: G.mode, timed: G.timed, raced: G.raced,
      total: G.raced && G.race ? G.race.qs.length : G.rounds, streak: G.streak, rounds: G.rounds, packs: G.packs, round: G.round, you: pid, hostPid: G.hostPid,
      players: G.players.map(p => ({
        pid: p.pid, name: p.name, score: p.score, likes: p.likes || 0, connected: p.connected, gain: ph === 'reveal' ? p.gain : 0, up: ph === 'reveal' ? p.up || 0 : 0, down: ph === 'reveal' ? p.down || 0 : 0,
        racing: !!p.racing, at: p.rAt || 0, ms: p.rMs || 0, rdone: !!p.rDone,
        done: ph === 'write' ? (!!G.subs[p.pid] || !G.writers.includes(p.pid)) : ph === 'vote' ? (G.votes[p.pid] !== undefined || p.pid === q.subject) : false
      }))
    };
    if (ph === 'race') { v.race = G.race; return v; }
    if (ph === 'lobby' || ph === 'gameover' || !q) return v;
    const subject = q.subject ? P(q.subject) : null;
    v.q = {
      kind: q.kind, label: q.label || '', subjectPid: q.subject,
      text: q.kind !== 'us' ? q.text : pid === q.subject ? q.you : q.them.replace('{name}', subject ? subject.name : 'them')
    };
    if (ph === 'write') {
      v.write = {
        role: !G.writers.includes(pid) ? 'watch' : pid === q.subject ? 'truth' : 'lie',
        mine: G.subs[pid] || null, canned: !!G.canned[pid], canSuggest: q.kind === 'facts',
        waiting: G.writers.filter(w => isLive(w) && !G.subs[w]).length
      };
    } else {
      const open = ph === 'reveal';
      v.vote = {
        myVote: G.votes[pid] === undefined ? null : G.votes[pid],
        myFav: open && G.favs && G.favs[pid] !== undefined ? G.favs[pid] : null,
        waiting: voters().filter(p => G.votes[p.pid] === undefined).length,
        last: G.round >= G.rounds,
        options: G.options.map((o, i) => ({
          text: o.text, own: !o.truth && o.authors.includes(pid),
          truth: open ? o.truth : false, authors: open ? o.authors : [],
          house: open && !!o.house, readyMade: open && o.authors.length > 0 && o.authors.every(a => G.canned[a]),
          pickers: open ? Object.keys(G.votes).filter(k => G.votes[k] === i) : [],
          likes: open && G.favs ? Object.keys(G.favs).filter(k => G.favs[k] === i).length : 0
        }))
      };
    }
    return v;
  }

  function sync() {
    G.players.forEach(p => { if (p.conn && p.conn.open) { try { p.conn.send({ t: 'state', v: viewFor(p.pid) }); } catch (e) {} } });
    view = viewFor(myPid);
    render();
  }

  function tell(pid, msg) {                     // a private message to one player
    if (pid === myPid) { onMsg(msg); return; }
    const p = P(pid);
    if (p && p.conn && p.conn.open) { try { p.conn.send(msg); } catch (e) {} }
  }

  function toastAll(k, ...a) {                  // sent as a key, so each player reads it in their own language
    G.players.forEach(p => { if (p.conn && p.conn.open) { try { p.conn.send({ t: 'toast', k, a }); } catch (e) {} } });
    toast(t(k, ...a));
  }

  /* ---------------- GUEST ---------------- */
  function joinRoom(code) {
    isHost = false; roomCode = code;
    busy = t('Joining {0}…', code); render();
    peer = new Peer();
    joinTimer = setTimeout(() => joinFail(t('Could not find that room. Check the code and make sure the host still has the game open.')), 15000);
    peer.on('open', () => connectHost());
    peer.on('error', err => {
      if (err.type === 'peer-unavailable') { if (view) { lost = true; render(true); } else joinFail(t('No room with that code. Check it and try again.')); }
      else if (!view) joinFail(t('Connection problem. Check your internet and try again.'));
    });
    peer.on('disconnected', () => { if (peer && !peer.destroyed) peer.reconnect(); });
  }

  function connectHost() {
    const conn = peer.connect(PREFIX + roomCode, { reliable: true });
    hostConn = conn;
    conn.on('open', () => conn.send({ t: 'join', pid: myPid, name: myName }));
    conn.on('data', msg => {
      if (!msg || conn !== hostConn) return;
      if (msg.t === 'state') {
        clearTimeout(joinTimer); busy = ''; const was = lost; lost = false;
        if (!view) setRoomUrl(roomCode);
        view = msg.v; render(was);
      } else if (msg.t === 'full') joinFail(t('That room is full.'));
      else if (msg.t === 'kicked') { hostConn = null; joinFail(t('The host removed you from the room.')); }
      else onMsg(msg);
    });
    conn.on('close', () => { if (conn === hostConn && view) { lost = true; render(true); } });
  }

  function onMsg(msg) {
    if (msg.t === 'toast') toast(msg.k ? t(msg.k, ...(msg.a || [])) : msg.text);
    else if (msg.t === 'nope') {                // I typed the real answer by accident
      nope = msg.why === 'none' ? t('No ready-made lie for this one. Write your own.') : t('That is the real answer! Write a lie instead.');
      const el = document.getElementById('nope'); if (el) el.textContent = nope;
    }
  }

  function joinFail(text) {
    clearTimeout(joinTimer);
    if (peer) { try { peer.destroy(); } catch (e) {} }
    peer = null; hostConn = null; view = null; busy = ''; homeErr = text;
    render();
  }

  function act(msg) {
    if (isHost) handle(myPid, msg);
    else if (hostConn && hostConn.open) hostConn.send(msg);
  }

  /* ---------------- RENDERING ---------------- */
  function setRoomUrl(code) { try { history.replaceState(null, '', location.pathname + '?room=' + code); } catch (e) {} }
  const shareUrl = () => location.origin + location.pathname + '?room=' + view.code;

  let toastTimer = null;
  function toast(text) {
    $toast.textContent = text; $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove('show'), 3500);
  }

  const people = n => n === 1 ? t('1 more person') : t('{0} more people', n);

  function render(force) {
    document.documentElement.lang = lang();
    if (!view) { $app.innerHTML = homeHTML(); return; }
    if (view.phase === 'race' && (!race || race.id !== view.race.id)) {       // a new race, or I have just come back to one
      const me = view.players.find(p => p.pid === view.you) || {};
      race = { id: view.race.id, i: me.at || 0, score: me.score || 0, ms: me.ms || 0, picked: null, t0: Date.now() };
    }
    const key = view.phase === 'race' ? 'race:' + race.id + ':' + race.i + ':' + race.picked
      : view.round + ':' + view.phase + ':' + (view.q ? view.q.text : '');   // a replaced question counts as new
    const same = key === selKey;
    // In a race the others' progress arrives all the time. It only ever touches the strip at the top.
    if (same && !force && view.phase === 'race' && document.getElementById('race')) {
      const s = $app.querySelector('.scores');
      if (s) s.outerHTML = raceStripHTML();
      return;
    }
    if (!same) { selKey = key; draft = ''; nope = ''; }
    // Someone else handing in must not wipe what a player is typing:
    // while I am still writing, only the score strip is refreshed.
    if (same && !force && view.write && view.write.mine === null && document.getElementById('answer')) {
      const s = $app.querySelector('.scores');
      if (s) s.outerHTML = scoresHTML();
      return;
    }
    let html = view.phase === 'lobby' ? lobbyHTML() : view.phase === 'gameover' ? overHTML() : view.phase === 'race' ? raceHTML() : gameHTML();
    if (lost) {
      html += '<div class="overlay"><div class="dialog"><h2>' + t('Connection lost') + '</h2><p>' + t('The link to the host dropped. If the host closed the game, the room is gone.') + '</p>' +
        '<div class="row"><button class="btn primary" data-act="reconnect">' + t('Try to reconnect') + '</button><button class="btn" data-act="leave">' + t('Leave') + '</button></div></div></div>';
    }
    $app.innerHTML = html;
    const box = document.getElementById('answer');
    if (box && !same) box.focus();
  }

  // The EN / ไทย switch. act 'lang' is my own screen (anyone, any time); act 'qlang' is the room's questions (host, in the lobby).
  function langHTML(act, cur, off) {
    return '<div class="lang" role="group">' + [['en', act === 'lang' ? 'EN' : 'English'], ['th', 'ไทย']].map(x =>
      '<button data-act="' + act + '" data-l="' + x[0] + '"' + (cur === x[0] ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + (off ? ' disabled' : '') + '>' + x[1] + '</button>').join('') + '</div>';
  }
  const myLangHTML = off => langHTML('lang', lang(), off);

  function homeHTML() {
    const dis = busy ? ' disabled' : '';
    return '<main class="home">' + myLangHTML(!!busy) +
      '<h1 class="logo">Big Fat<br><i>Truth</i> Lie.</h1>' +
      '<p class="tag">' + t('Write a lie. Spot the truth. Fool your friends.') + '</p>' +
      '<label class="field"><span>' + t('Your name') + '</span><input id="name" maxlength="16" autocomplete="off" placeholder="' + t('e.g. Sam') + '" value="' + esc(myName) + '"' + dis + '></label>' +
      '<button class="btn primary big" data-act="create"' + dis + '>' + t('Create a room') + '</button>' +
      '<div class="or"><span>' + t('or join with a code') + '</span></div>' +
      '<div class="joinrow"><input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="' + t('Room code') + '" value="' + esc(roomCode) + '"' + dis + '>' +
      '<button class="btn big" data-act="join"' + dis + '>' + t('Join') + '</button></div>' +
      (busy ? '<p class="note">' + esc(busy) + '</p>' : '') + (homeErr ? '<p class="err">' + esc(homeErr) + '</p>' : '') +
      '<div class="or"><span>' + t('or on your own') + '</span></div>' +
      '<button class="btn big" data-act="solo"' + dis + '>' + t('Play solo quiz') + '</button>' +
      '<ol class="how"><li>' + t('<b>Bluff:</b> a strange fact comes up with the answer missing. Everyone types a believable lie, or takes a ready-made one for half the points.') + '</li>' +
      '<li>' + t('All the lies appear with the real answer hidden among them. {0} points for finding the truth, {1} for every friend who falls for your lie.', FIND, FOOL) + '</li>' +
      '<li>' + (TRAP === 1 ? t('With only two of you, the game adds decoys of its own. Pick one and you lose a point.') : TRAP ? t('With only two of you, the game adds decoys of its own. Pick one and you lose {0} points.', TRAP) : t('With only two of you, the game adds decoys of its own. Pick one and you score nothing.')) + '</li>' +
      '<li>' + t('In "About us" questions (three players or more) one of you tells the truth and the rest lie about them. The truth-teller gets {0} points for every friend who finds the truth.', KNOWN) + '</li>' +
      '<li>' + t('With favourite votes on, tap ♥ on the lie you liked best after each answer. Hearts do not change the score, but the most loved liar gets a prize of their own at the end.') + '</li>' +
      '<li>' + t('<b>Quiz:</b> no lying. Four answers, one is true. Play it with friends or solo.') + '</li></ol>' +
      '</main>';
  }

  function lobbyHTML() {
    const v = view, amHost = v.you === v.hostPid, n = v.players.length, quiz = v.mode === 'quiz', us = dataOf(v.lang).us;
    const rounds = [5, 8, 10, 15, 20].map(g => '<option value="' + g + '"' + (g === v.rounds ? ' selected' : '') + '>' + g + '</option>').join('');
    const names = packNames(v.lang).filter(p => !(quiz && p === us));        // "About us" needs lies, so it is not in the quiz
    const ticked = v.packs.filter(p => names.includes(p));
    const hasFacts = ticked.some(p => p !== us), need = needPlayers(v.mode, v.solo);
    const block = n < need ? (need - n > 1 ? t('Need {0} more players', need - n) : t('Need 1 more player'))
      : !ticked.length ? t('Tick a pack first')
      : !hasFacts && n < 3 ? t('"About us" needs 3 players') : '';
    const settings =
      (DATA.th ? '<div class="field inline"><span>' + t('Questions in') + '</span>' + langHTML('qlang', v.lang) + '</div>' : '') +
      (v.solo ? '' : '<label class="field inline"><span>' + t('Game') + '</span><select id="mode">' +
        Object.keys(MODES).map(k => '<option value="' + k + '"' + (k === v.mode ? ' selected' : '') + '>' + t(MODES[k]) + '</option>').join('') + '</select></label>') +
      '<div class="field"><span>' + t('Question packs') + '</span><div class="packs">' + names.map(p =>
        '<label class="pack"><input type="checkbox" data-pack="' + esc(p) + '"' + (v.packs.includes(p) ? ' checked' : '') + '>' + esc(p) + '<em>' + packSize(v.lang, p) + '</em></label>').join('') + '</div></div>' +
      '<label class="field inline"><span>' + t('How many') + '</span><select id="rounds">' + rounds + '</select></label>' +
      (quiz ? '<div class="field"><div class="packs"><label class="tick"><input type="checkbox" id="timed"' + (v.timed ? ' checked' : '') + '>' + t('Timed') +
        '<em>' + (v.solo ? t('against the clock') : t('everyone at their own pace')) + '</em></label></div></div>' : '') +
      (v.solo ? '' : '<div class="field"><div class="packs"><label class="tick"><input type="checkbox" id="skip"' + (v.skip ? ' checked' : '') + '>' + t('Allow skipping') +
        '<em>' + t('host can carry on without waiting') + '</em></label></div></div>') +
      (v.solo || quiz ? '' : '<div class="field"><div class="packs"><label class="tick"><input type="checkbox" id="fav"' + (v.fav ? ' checked' : '') + '>' + t('Favourite votes') +
        '<em>' + t('tap ♥ on the best lie, with a prize for the most loved') + '</em></label></div></div>') +
      '<button class="btn primary big" data-act="start"' + (block ? ' disabled' : '') + '>' + (block || (v.solo ? t('Start') : t('Start game'))) + '</button>';
    if (v.solo) {
      const b = bestSolo();
      return '<main class="lobby">' + myLangHTML() + '<p class="eyebrow">' + t('Solo quiz') + '</p><div class="code small">' + t('You against the facts') + '</div>' +
        '<p class="note">' + t('Four answers, one is true.') + (b ? t(' Your best: {0}.', bestText(b)) : '') + '</p>' +
        settings + '<button class="btn" data-act="leave">' + t('Back to the start') + '</button></main>';
    }
    return '<main class="lobby">' + myLangHTML() +
      '<p class="eyebrow">' + t('Room code') + '</p><div class="code">' + esc(v.code) + '</div>' +
      '<button class="btn small" data-act="copy">' + t('Copy invite link') + '</button>' +
      '<h2>' + t('Players') + ' <span class="dim">' + n + '/' + MAX_PLAYERS + '</span></h2>' +
      '<ul class="plist">' + v.players.map(p => '<li>' + esc(p.name) + (p.pid === v.hostPid ? ' <em>' + t('host') + '</em>' : '') + (p.pid === v.you ? ' <em>' + t('you') + '</em>' : '') +
        (amHost && p.pid !== v.hostPid ? '<button class="kick" data-act="kick" data-pid="' + esc(p.pid) + '" aria-label="' + t('Remove {0}', esc(p.name)) + '">' + t('Remove') + '</button>' : '') + '</li>').join('') + '</ul>' +
      (amHost
        ? settings +
          (!quiz && n === 2 ? '<p class="fine">' + t('With two players the game adds decoy answers of its own, and "About us" questions are left out.') + '</p>' : '') +
          '<p class="fine">' + t('Keep this tab open. You are hosting, so the room closes if you leave.') + '</p>'
        : '<p class="note">' + t('Waiting for the host to start. {0}, {1} questions from: {2}.', quiz ? (v.timed ? t('Timed quiz') : t('Quiz')) : t('Bluff'), v.rounds, esc(ticked.join(', '))) + '</p>') +
      '</main>';
  }

  function scoresHTML() {
    const v = view, subject = v.q ? v.q.subjectPid : null;
    return '<ul class="scores">' + v.players.map(p =>
      '<li class="' + (p.pid === subject ? 'star ' : '') + (p.connected ? '' : 'off ') + (p.pid === v.you ? 'me' : '') + '">' +
      '<span class="nm">' + esc(p.name) + '</span>' + (v.phase !== 'reveal' && p.done ? '<span class="mk">✓</span>' : '') +
      '<b>' + p.score + '</b></li>').join('') + '</ul>';
  }

  // The question card. A fact shows its gap, or the truth once it is revealed.
  function questionHTML(truth, other) {
    const q = other || view.q;
    const label = q.kind !== 'us' ? esc(q.label || t('Weird fact')) : q.subjectPid === view.you ? t('About you') : t('About {0}', esc(nameOf(q.subjectPid)));
    const text = q.kind !== 'us'
      ? (q.text.includes('_____')
          ? esc(q.text).replace('_____', truth ? '<mark>' + esc(truth) + '</mark>' : '<span class="blank"></span>')
          : esc(q.text) + (truth ? ' <mark>' + esc(truth) + '</mark>' : ''))        // a question with no gap: the answer goes after it
      : esc(q.text);
    return '<div class="q"><p>' + label + '</p><h2>' + text + '</h2></div>';
  }
  const nameOf = pid => { const p = view.players.find(x => x.pid === pid); return p ? p.name : t('Someone'); };
  const barHTML = right => '<header class="bar"><span>' + (view.solo ? t('Solo quiz') : t('Room') + ' <b>' + esc(view.code) + '</b>') + '</span><span>' + right + '</span>' + myLangHTML() + '</header>';

  /* ---------------- THE TIMED QUIZ ---------------- */
  // The strip at the top of a race: how far along everyone is. Scores stay hidden until the end.
  function raceStripHTML() {
    const v = view, n = v.race.qs.length;
    return '<ul class="scores">' + v.players.filter(p => p.racing).map(p => {
      const mine = p.pid === v.you, at = mine ? Math.min(n, race.i + (race.picked !== null ? 1 : 0)) : p.at;
      return '<li class="' + (p.connected ? '' : 'off ') + (mine ? 'me' : '') + '"><span class="nm">' + esc(p.name) + '</span>' +
        (p.rdone ? '<span class="mk">' + t('done') + '</span>' : '') + '<b>' + at + '/' + n + '</b></li>';
    }).join('') + '</ul>';
  }

  function raceHTML() {
    const v = view, qs = v.race.qs, n = qs.length, amHost = v.you === v.hostPid;
    const me = v.players.find(p => p.pid === v.you);
    const end = !v.solo && amHost && v.skip ? '<button class="btn" data-act="skip">' + t('End the race now') + '</button>' : '';
    if (!me || !me.racing) {
      return barHTML(t('Timed quiz')) + raceStripHTML() + '<main class="stage" id="race"><p class="status">' + t('A timed quiz is under way. You will be in the next game.') + '</p><div class="action">' + end + '</div></main>';
    }
    if (race.i >= n) {
      return barHTML(t('Finished')) + raceStripHTML() + '<main class="stage" id="race">' +
        '<div class="q"><p>' + t('All done') + '</p><h2>' + t('{0} of {1} in {2}', race.score, n, clock(race.ms)) + '</h2></div>' +
        '<p class="status">' + (v.solo ? '' : t('Waiting for the others to finish. Results appear when everyone is done.')) + '</p><div class="action">' + end + '</div></main>';
    }
    const q = qs[race.i], picked = race.picked, done = picked !== null;
    return barHTML(t('Question {0} of {1}', race.i + 1, n) + ' · <span id="clock">' + clock(race.ms + (done ? 0 : Date.now() - race.t0)) + '</span>') +
      raceStripHTML() + '<main class="stage" id="race">' + questionHTML(done ? q.options[q.truth] : null, q) +
      '<p class="status">' + (!done ? t('Which one is true?') : picked === q.truth ? t('Correct!') : t('Not this time.')) + '</p>' +
      '<div class="opts">' + q.options.map((o, i) => done
        ? '<div class="opt' + (i === q.truth ? ' truth' : i === picked ? ' trap' : '') + '">' + esc(o) +
          (i === q.truth ? '<small><b>' + t('The truth') + '</b>' + (i === picked ? ' · ' + t('your pick') : '') + '</small>' : i === picked ? '<small>' + t('your pick') + '</small>' : '') + '</div>'
        : '<button class="opt" data-act="rpick" data-i="' + i + '">' + esc(o) + '</button>').join('') + '</div>' +
      '<div class="action">' + (done ? '<button class="btn primary big" data-act="rnext">' + (race.i + 1 >= n ? t('Finish') : t('Next question')) + '</button>' : '') + '</div></main>';
  }

  function gameHTML() {
    const v = view, amHost = v.you === v.hostPid, q = v.q, quiz = q.kind === 'quiz';
    const iAmSubject = q.subjectPid === v.you, subject = q.subjectPid ? esc(nameOf(q.subjectPid)) : '';
    let body = '', action = '';

    if (v.phase === 'write') {
      const w = v.write;
      body = questionHTML();
      if (w.role === 'watch') body += '<p class="status">' + t('This question is already going. You can vote when the answers are in.') + '</p>';
      else if (w.mine !== null) {
        body += '<p class="status">' + t('Handed in. Waiting on {0}.', people(w.waiting)) + '</p>' +
          '<p class="mine">' + (w.role === 'truth' ? t('Your truth') : w.canned ? t('Your ready-made lie (half points)') : t('Your lie')) + ': <b>' + esc(w.mine) + '</b></p>';
      } else {
        body += '<p class="status">' + (w.role === 'truth' ? t('Tell the truth. Everyone else is busy lying about you.') : q.kind === 'facts' ? t('Write a lie that sounds true.') : t('Make up an answer that sounds like {0}.', subject)) + '</p>' +
          '<input id="answer" maxlength="' + MAX_LEN + '" autocomplete="off" placeholder="' + (w.role === 'truth' ? t('The honest answer') : t('Your most convincing lie')) + '" value="' + esc(draft) + '">' +
          '<p class="err" id="nope">' + esc(nope) + '</p>' +
          '<p class="tip">' + (w.role === 'truth' ? t('Keep it short. Your friends will have to pick it out from the lies. You get {0} points for each one who does.', KNOWN) : t('Keep it short and plausible. You score when friends pick it.')) + '</p>';
        action = '<button class="btn primary big" data-act="write"' + (draft.trim() ? '' : ' disabled') + '>' + (w.role === 'truth' ? t('Lock in the truth') : t('Hand in my lie')) + '</button>' +
          (w.role === 'lie' && w.canSuggest ? '<button class="btn" data-act="canned">' + t('Give me a lie (half points)') + '</button>' : '');
      }
      if (amHost && v.skip && w.mine !== null && w.waiting > 0) action = '<button class="btn" data-act="skip">' + t('Carry on without them') + '</button>';
    } else {
      const m = v.vote, done = v.phase === 'reveal';
      const truth = done ? (m.options.find(o => o.truth) || {}).text : null;
      const canPick = !done && !iAmSubject && m.myVote === null;
      const names = list => list.map(p => esc(nameOf(p))).join(', ');
      const right = m.myVote !== null && m.options[m.myVote] && m.options[m.myVote].truth;
      body = questionHTML(truth) +
        '<p class="status">' + (done
            ? (v.solo ? (right ? t('Correct!') + (v.streak > 1 ? t(' That is {0} in a row.', v.streak) : '') : t('Not this time.'))
              : q.kind === 'us' ? (iAmSubject ? t('The truth about you.') : t('The truth about {0}.', subject)) : t('The truth is out.'))
          : iAmSubject ? t('Your friends are working out which one is really you. Waiting on {0}.', people(m.waiting))
          : canPick ? (quiz ? t('Which one is true?') : t('Which one is the truth?'))
          : t('Vote is in. Waiting on {0}.', people(m.waiting))) + '</p>' +
        '<div class="opts">' + m.options.map((o, i) => {
          if (done) {
            const who = o.truth ? '<b>' + t('The truth') + '</b>' + (o.authors.length ? ' · ' + t('{0} wrote it by accident', names(o.authors)) : '')
              : o.house ? (quiz ? '' : '<b>' + t('A trap set by the game') + '</b>')
              : '<b>' + t('{0}\'s lie', names(o.authors)) + '</b>' + (o.readyMade ? t(' (ready-made)') : '');
            const picked = v.solo ? (o.pickers.length ? t('your pick') : '')
              : o.pickers.length ? t(o.truth ? 'found by {0}' : o.house ? (quiz ? 'picked by {0}' : 'caught {0}') : 'fooled {0}', names(o.pickers))
              : o.truth ? t('nobody found it') : '';
            const note = [who, picked].filter(Boolean).join(' · ');
            // Favourite votes: a ♥ on every lie a friend actually wrote. Your own lie shows its count but cannot be tapped.
            const lik = v.fav && !o.truth && !o.house && o.authors.length && !o.readyMade;
            const heart = lik ? '<button class="fav' + (m.myFav === i ? ' on' : '') + '" data-act="fav" data-i="' + i + '"' + (o.own ? ' disabled' : '') + ' aria-label="' + t('Favourite: {0}', esc(o.text)) + '">♥' + (o.likes ? ' ' + o.likes : '') + '</button>' : '';
            return '<div class="opt' + (o.truth ? ' truth' : o.pickers.length && (o.house || v.solo) ? ' trap' : '') + '">' + (heart ? '<span>' : '') + esc(o.text) + (note ? '<small>' + note + '</small>' : '') + (heart ? '</span>' + heart : '') + '</div>';
          }
          return '<button class="opt' + (m.myVote === i ? ' sel' : '') + '" data-act="vote" data-i="' + i + '"' + (canPick && !o.own ? '' : ' disabled') + '>' +
            esc(o.text) + (o.own ? '<small>' + t('your lie') + '</small>' : '') + '</button>';
        }).join('') + '</div>';
      if (done) {
        // Everyone whose points moved this round. Someone who won and lost points is shown both, even if they cancel out.
        const got = v.players.filter(p => p.up || p.down).sort((a, b) => b.gain - a.gain);
        if (!v.solo) body += '<ul class="gains">' + (got.length ? got.map(p => '<li>' + esc(p.name) + (p.up ? ' <b>+' + p.up + '</b>' : '') + (p.down ? ' <b class="neg">−' + p.down + '</b>' : '') + '</li>').join('') : '<li>' + t('Nobody scored. Impressive.') + '</li>') + '</ul>';
        if (v.fav && m.options.some(o => !o.truth && !o.house && o.authors.length && !o.readyMade && !o.own)) body += '<p class="tip">' + t('Tap ♥ on your favourite lie.') + '</p>';
        if (amHost || iAmSubject) action = '<button class="btn primary big" data-act="next">' + (m.last ? (v.solo ? t('See how you did') : t('See final scores')) : t('Next question')) + '</button>';
      } else if (amHost && v.skip && (m.myVote !== null || iAmSubject) && m.waiting > 0) action = '<button class="btn" data-act="skip">' + t('Show the answer now') + '</button>';
    }

    return barHTML(t('Question {0} of {1}', v.round, v.rounds)) +
      scoresHTML() + '<main class="stage">' + body + '<div class="action">' + action + '</div></main>';
  }

  function overHTML() {
    const v = view, amHost = v.you === v.hostPid;
    if (v.solo) {
      const score = v.players[0].score, pct = score / v.total, b = bestSolo();
      return '<main class="lobby">' + myLangHTML() + '<p class="eyebrow">' + t('Solo quiz') + '</p><div class="code small">' + (v.raced ? t('{0} of {1} in {2}', score, v.total, clock(v.players[0].ms)) : t('{0} of {1}', score, v.total)) + '</div>' +
        '<p class="note">' + (pct === 1 ? t('Flawless. Suspicious, even.') : pct >= 0.7 ? t('Sharp. The facts are worried.') : pct >= 0.4 ? t('Respectable. The facts put up a fight.') : t('The facts win this one.')) +
        (b ? t(' Your best is {0}.', bestText(b)) : '') + '</p>' +
        '<button class="btn primary big" data-act="start">' + t('Play again') + '</button>' +
        '<button class="btn" data-act="lobby">' + t('Change packs') + '</button><button class="btn" data-act="leave">' + t('Back to the start') + '</button></main>';
    }
    // A timed quiz ranks by score, then by the faster time. Only the people who raced are listed.
    const tied = (a, b) => a.score === b.score && (!v.raced || a.ms === b.ms);
    const ranked = v.players.filter(p => !v.raced || p.racing).sort((a, b) => b.score - a.score || (v.raced ? a.ms - b.ms : 0));
    // Everyone level at the top shares the win, and equal results share a place.
    const winners = ranked.filter(p => tied(p, ranked[0])).map(p => esc(p.name));
    const headline = winners.length === 1 ? t('{0} wins', winners[0])
      : (winners.length === ranked.length && ranked.length > 2) ? t('Everyone ties')
      : t('{0} and {1} tie', winners.slice(0, -1).join(', '), winners[winners.length - 1]);
    const place = p => ranked.findIndex(x => tied(x, p)) + 1;
    // Favourite votes: a second prize, for whoever collected the most ♥. It has nothing to do with the points.
    const showFav = v.fav && !v.raced, mostLikes = Math.max(0, ...v.players.map(p => p.likes || 0));
    const loved = v.players.filter(p => mostLikes > 0 && p.likes === mostLikes).map(p => esc(p.name));
    const crowd = !showFav ? '' : '<p class="eyebrow crowd">' + t('Crowd favourite') + '</p>' +
      (loved.length ? '<div class="code small">' + (loved.length === 1 ? loved[0] : loved.slice(0, -1).join(', ') + ' & ' + loved[loved.length - 1]) + ' ♥ ' + mostLikes + '</div>' : '<p class="note">' + t('Nobody got a ♥ this game.') + '</p>');
    return '<main class="lobby">' + myLangHTML() + '<p class="eyebrow">' + (v.raced ? t('Fastest brain') : v.mode === 'quiz' ? t('Top of the class') : t('Best liar')) + '</p><div class="code small">' + headline + '</div>' +
      '<ul class="plist rank">' + ranked.map(p =>
        '<li class="' + (place(p) === 1 ? 'top' : '') + '"><span>' + place(p) + '. ' + esc(p.name) + '</span><b>' + p.score + (v.raced ? '/' + v.total + ' · ' + (p.rdone ? clock(p.ms) : t('did not finish')) : '') + (showFav ? ' · ♥ ' + (p.likes || 0) : '') + '</b></li>').join('') + '</ul>' + crowd +
      (amHost
        ? '<button class="btn primary big" data-act="start"' + (v.players.filter(p => p.connected).length < needPlayers(v.mode, v.solo) ? ' disabled' : '') + '>' + t('Play again') + '</button>' +
          '<button class="btn" data-act="lobby">' + t('Back to lobby') + '</button>'
        : '<p class="note">' + t('Waiting for the host to start another game.') + '</p>') + '</main>';
  }

  /* ---------------- EVENTS ---------------- */
  function readName() {
    myName = myName.trim().slice(0, 16);
    if (!myName) { homeErr = t('Pick a name first.'); render(); return false; }
    save('localStorage', 'bfl_name', myName); homeErr = '';
    return true;
  }

  $app.addEventListener('input', e => {
    if (e.target.id === 'name') myName = e.target.value;
    if (e.target.id === 'code') { roomCode = cleanCode(e.target.value); e.target.value = roomCode; }
    if (e.target.id === 'answer') {
      draft = e.target.value;
      const b = $app.querySelector('[data-act=write]'); if (b) b.disabled = !draft.trim();
      if (nope) { nope = ''; const el = document.getElementById('nope'); if (el) el.textContent = ''; }
    }
  });
  $app.addEventListener('change', e => {
    if (e.target.id === 'rounds') act({ t: 'rounds', rounds: e.target.value });
    if (e.target.id === 'fav') { save('localStorage', 'bfl_fav', e.target.checked ? '1' : '0'); act({ t: 'allowfav', on: e.target.checked }); }
    if (e.target.id === 'skip') { save('localStorage', 'bfl_skip', e.target.checked ? '1' : '0'); act({ t: 'allowskip', on: e.target.checked }); }
    if (e.target.id === 'timed') { save('localStorage', 'bfl_timed', e.target.checked ? '1' : '0'); act({ t: 'timed', on: e.target.checked }); }
    if (e.target.id === 'mode') { save('localStorage', 'bfl_mode', e.target.value); act({ t: 'mode', mode: e.target.value }); }
    if (e.target.dataset.pack) act({ t: 'pack', name: e.target.dataset.pack, on: e.target.checked });
  });
  $app.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (e.target.id === 'code') go('join');
    if (e.target.id === 'answer') go('write');
  });
  $app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el && !el.disabled) go(el.dataset.act, el);
  });

  function go(a, el) {
    switch (a) {
      case 'create':
        if (typeof Peer === 'undefined') { homeErr = t('The connection library did not load. Refresh the page.'); render(); return; }
        if (readName()) createRoom();
        break;
      case 'join':
        if (typeof Peer === 'undefined') { homeErr = t('The connection library did not load. Refresh the page.'); render(); return; }
        if (!readName()) return;
        if (roomCode.length !== 5) { homeErr = t('Room codes are 5 letters.'); render(); return; }
        joinRoom(roomCode);
        break;
      case 'copy': {
        const url = shareUrl();
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => toast(t('Invite link copied.')), () => prompt(t('Copy this link:'), url));
        else prompt(t('Copy this link:'), url);
        break;
      }
      case 'lang':                              // my own screen: any player, at any moment, without touching anyone else's
        if (el.dataset.l === uiLang) break;
        uiLang = el.dataset.l === 'th' ? 'th' : 'en'; save('localStorage', 'bfl_lang', uiLang);
        if (!view) homeErr = '';
        if (nope) nope = '';
        render(true);
        break;
      case 'qlang': act({ t: 'lang', lang: el.dataset.l }); break;      // host: which language the questions are in
      case 'kick': act({ t: 'kick', pid: el.dataset.pid }); break;
      case 'start': act({ t: 'start' }); break;
      case 'lobby': act({ t: 'lobby' }); break;
      case 'solo': startSolo(); break;
      case 'rpick': {                           // my answer in a timed quiz: stop the clock
        if (!race || race.picked !== null || view.phase !== 'race') break;
        const q = view.race.qs[race.i], i = parseInt(el.dataset.i, 10);
        race.ms += Date.now() - race.t0; race.picked = i;
        if (i === q.truth) race.score++;
        act({ t: 'race', i: race.i + 1, score: race.score, ms: race.ms, done: false });
        render();
        break;
      }
      case 'rnext':                             // on to the next one: the clock starts again
        if (!race || race.picked === null || view.phase !== 'race') break;
        race.i++; race.picked = null; race.t0 = Date.now();
        if (race.i >= view.race.qs.length) act({ t: 'race', i: race.i, score: race.score, ms: race.ms, done: true });
        if (view.phase === 'race') render();
        break;
      case 'write': if (draft.trim()) act({ t: 'write', text: draft }); break;
      case 'canned': act({ t: 'write', canned: true }); break;
      case 'vote': act({ t: 'vote', i: parseInt(el.dataset.i, 10) }); break;
      case 'skip': act({ t: 'skip' }); break;
      case 'fav': act({ t: 'fav', i: parseInt(el.dataset.i, 10) }); break;
      case 'next': act({ t: 'next' }); break;
      case 'reconnect':
        toast(t('Reconnecting…'));
        if (peer && peer.disconnected && !peer.destroyed) peer.reconnect();
        if (peer && !peer.destroyed) connectHost();
        break;
      case 'leave': location.href = location.pathname; break;
    }
  }

  // The stopwatch in a timed quiz only runs while a question is waiting for my answer.
  setInterval(() => {
    const el = document.getElementById('clock');
    if (el && race && view && view.phase === 'race' && race.picked === null) el.textContent = clock(race.ms + Date.now() - race.t0);
  }, 100);

  // The Remove buttons in the mid-game list (the lobby ones go through go()).
  document.addEventListener('click', e => { const b = e.target.closest('.hostbox .kick'); if (b) act({ t: 'kick', pid: b.dataset.pid }); });

  /* ---------------- HOST: REMOVE A PLAYER MID-GAME ----------------
     A small tab on the edge of the host's screen during a game. It opens a list of players;
     removing one makes the game stop waiting for them, and they cannot come back to this room. */
  (() => {
    const tab = document.createElement('button'), box = document.createElement('div');
    tab.className = 'hosttab'; tab.type = 'button'; tab.textContent = 'Remove a player'; tab.hidden = true;
    box.className = 'hostbox'; box.hidden = true;
    document.body.appendChild(tab); document.body.appendChild(box);
    const safe = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let shown = '';
    const paint = () => {
      const on = !!(isHost && view && view.players && view.phase !== 'lobby' && view.players.length > 1);
      tab.hidden = !on; if (!on) { box.hidden = true; shown = ''; return; }
      if (box.hidden) return;
      const others = view.players.filter(p => p.pid !== view.hostPid);
      const key = others.map(p => p.pid + p.name + p.connected).join('|');
      if (key === shown) return;                // only redraw when the list changes
      shown = key;
      box.innerHTML = '<div class="hostcard"><h2>Remove a player</h2><p>The game stops waiting for them, and they cannot rejoin this room.</p>' +
        (others.length ? '<ul>' + others.map(p => '<li><span>' + safe(p.name) + (p.connected === false ? ' <em>away</em>' : '') + '</span><button class="kick" data-pid="' + safe(p.pid) + '" aria-label="Remove ' + safe(p.name) + '">Remove</button></li>').join('') + '</ul>' : '<p>Nobody else is here.</p>') +
        '<button type="button" class="hostclose">Close</button></div>';
    };
    tab.addEventListener('click', () => { box.hidden = false; shown = ''; paint(); });
    box.addEventListener('click', e => { if (e.target === box || e.target.closest('.hostclose')) box.hidden = true; });
    setInterval(paint, 400);
  })();

  window.addEventListener('beforeunload', e => {
    if (isHost && G && G.players.length > 1) { e.preventDefault(); e.returnValue = ''; }
  });

  render();
})();
</script>
</body>
</html>
