<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Likely Story — the alibi party game</title>
<meta name="description" content="A crime has been committed. Build the least believable alibi. Create a room, share the code, play with friends.">
<style>
:root {
  --bg: #e9dfc9;

  --who: #1f5fa8;

* { box-sizing: border-box; }
html, body { margin: 0; }
body {

button, input, select { font: inherit; color: inherit; }

.btn:hover:not(:disabled) { background: #fff; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover:not(:disabled) { background: #3a342b; }
.btn.big { padding: 14px 24px; font-size: 1.05rem; }
.btn.small { padding: 6px 14px; font-size: .9rem; }
.field { display: block; text-align: left; margin: 0 0 14px; }
.field span { display: block; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 6px; }
.field.inline { display: flex; align-items: center; gap: 12px; }
.field.inline span { margin: 0; }
input, select { width: 100%; background: var(--paper); border: 2px solid var(--line); border-radius: 6px; padding: 12px 14px; font-weight: 700; }
select { width: auto; }
input::placeholder { color: #b5a88a; font-weight: 400; }

.tag { color: var(--dim); margin: 4px 0 20px; font-size: 1.05rem; }

.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.joinrow { display: flex; gap: 10px; }
.joinrow input { text-transform: uppercase; letter-spacing: .3em; font-size: 1.2rem; text-align: center; }
.note { color: var(--dim); margin: 8px 0 0; }
.err { color: var(--stamp); font-weight: 700; margin: 8px 0 0; }
.fine { color: var(--dim); font-size: .85rem; margin: 16px 0 0; }
.how { margin: 20px 0 0; padding: 0 0 0 20px; color: var(--dim); font-size: .92rem; }
.how li { margin-bottom: 4px; }
.lobby { text-align: center; align-items: center; }

.lobby > .btn.small { width: auto; }
.eyebrow { margin: 0; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); }
.code { font-family: var(--type); font-size: clamp(3rem, 16vw, 4.5rem); font-weight: 700; letter-spacing: .12em; color: var(--stamp); line-height: 1; margin-bottom: 4px; }

.lobby h2 { margin: 24px 0 0; font-size: 1.1rem; text-align: left; }
.dim { color: var(--dim); font-weight: 400; }

.lbl.who { color: var(--who); } .lbl.what { color: var(--what); } .lbl.where { color: var(--where); }
.grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

.card.who { border-left-color: var(--who); } .card.what { border-left-color: var(--what); } .card.where { border-left-color: var(--where); }
.card:hover { transform: translateY(-2px); }
.card.sel { border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); transform: translateY(-3px); }

.subs { display: grid; gap: 12px; }
.sub { position: relative; display: block; width: 100%; text-align: left; background: none; border: 2px solid transparent; border-radius: 8px; padding: 4px; }
button.sub { cursor: pointer; }
button.sub:hover { border-color: var(--line); }
.sub.sel { border-color: var(--ink); }
.sub.win { border-color: var(--stamp); }

.action { margin-top: 20px; }

/* overlay & toast */

.dialog { background: var(--paper); border-radius: var(--radius); padding: 24px; max-width: 380px; }
.dialog h2 { margin: 0 0 8px; }
.dialog p { color: var(--dim); margin: 0 0 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
#toast { position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); font-weight: 700; padding: 10px 18px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 40px); z-index: 20; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

  const PREFIX = 'likelystory-v1-';
  const TYPES = ['who', 'what', 'where'];

  let peer = null, hostConn = null, isHost = false;
  let G = null;        // full game state (host only)
  let view = null;     // what this player is allowed to see
  let busy = '', homeErr = '', lost = false, joinTimer = null;
  let sel = {}, pickIdx = null, selKey = '';

  const P = pid => G.players.find(p => p.pid === pid);
  const emptyHand = () => ({ who: [], what: [], where: [] });

    const code = makeCode();

    peer = new Peer(PREFIX + code);

      G = {
        code, phase: 'lobby', goal: 5, round: 0, hostPid: myPid,
        players: [newPlayer(myPid, myName, null)],
        detPid: null, crime: null, table: [], winnerPid: null,
        decks: {}, crimes: []

    peer.on('connection', conn => {

      conn.on('error', () => hostLeave(conn));

    return { pid, name, score: 0, hand: emptyHand(), alibi: null, conn, connected: true };

      if (old && old !== conn) { try { old.close(); } catch (e) {} }
    } else {
      if (G.players.length >= MAX_PLAYERS) { conn.send({ t: 'full' }); return; }
      p = newPlayer(pid, name, conn);
      G.players.push(p);
      if (G.phase !== 'lobby' && G.phase !== 'gameover') refill(p);
    }
    conn.pid = pid;
    sync();
  }

  function hostLeave(conn) {
    if (!G || !conn.pid) return;
    const p = P(conn.pid);
    if (!p || p.conn !== conn) return;
    p.conn = null; p.connected = false;
    if (G.phase === 'lobby') { G.players = G.players.filter(x => x !== p); sync(); return; }
    if (p.pid === G.detPid && (G.phase === 'alibi' || G.phase === 'judging')) {
      toastAll(p.name + ' (the detective) dropped out. Case closed.');
      startRound(); return;
    }
    maybeJudge();
    sync();
  }

  function draw(k) {
    const d = G.decks[k];
    if (!d.draw.length) { d.draw = shuffle(d.discard); d.discard = []; }
    return d.draw.pop();
  }
  function refill(p) {
    TYPES.forEach(k => {
      while (p.hand[k].length < HAND) { const c = draw(k); if (c === undefined) break; p.hand[k].push(c); }
    });
  }

  function startGame() {
    G.decks = {};
    TYPES.forEach(k => { G.decks[k] = { draw: shuffle([...new Set(DECKS[k])]), discard: [] }; });
    G.crimes = shuffle(CRIMES);
    G.round = 0; G.detPid = null;
    G.players = G.players.filter(p => p.connected);
    G.players.forEach(p => { p.score = 0; p.hand = emptyHand(); p.alibi = null; });
    startRound();
  }

  function startRound() {
    G.players.forEach(p => {
      if (p.alibi) { TYPES.forEach((k, i) => G.decks[k].discard.push(p.alibi[i])); p.alibi = null; }
    });
    G.table = []; G.winnerPid = null;
    const live = G.players.filter(p => p.connected);
    if (live.length < 2) {
      G.players = live; G.phase = 'lobby';
      toastAll('Not enough players left. Back to the lobby.');
      sync(); return;
    }
    const n = G.players.length;
    const cur = G.players.findIndex(p => p.pid === G.detPid);
    for (let i = 1; i <= n; i++) {
      const cand = G.players[(cur + i + n) % n];
      if (cand.connected) { G.detPid = cand.pid; break; }
    }
    if (!G.crimes.length) G.crimes = shuffle(CRIMES);
    G.crime = G.crimes.pop();
    G.round++;
    G.players.forEach(refill);
    G.phase = 'alibi';
    sync();
  }

  function maybeJudge() {
    if (G.phase !== 'alibi') return;
    const need = G.players.filter(p => p.connected && p.pid !== G.detPid);
    if (need.length && need.every(p => p.alibi)) {
      G.table = shuffle(G.players.filter(p => p.alibi).map(p => ({ pid: p.pid, cards: p.alibi })));
      G.phase = 'judging';
    }
  }

  // Every player action lands here (the host's own actions too).
  function handle(pid, msg) {
    const p = P(pid);
    if (!p) return;
    const amHost = pid === G.hostPid, amDet = pid === G.detPid;
    switch (msg.t) {
      case 'goal':
        if (amHost && G.phase === 'lobby') { G.goal = Math.min(15, Math.max(3, parseInt(msg.goal, 10) || 5)); sync(); }
        break;
      case 'start':
        if (amHost && (G.phase === 'lobby' || G.phase === 'gameover') &&
            G.players.filter(x => x.connected).length >= MIN_PLAYERS) startGame();
        break;
      case 'alibi': {
        if (G.phase !== 'alibi' || amDet || p.alibi) return;
        const c = msg.cards || {};
        if (!TYPES.every(k => p.hand[k].includes(c[k]))) return;
        TYPES.forEach(k => { p.hand[k] = p.hand[k].filter(x => x !== c[k]); });
        p.alibi = TYPES.map(k => c[k]);
        refill(p); maybeJudge(); sync();
        break;
      }
      case 'pick': {
        if (G.phase !== 'judging' || !amDet) return;
        const s = G.table[msg.i];
        if (!s) return;
        G.winnerPid = s.pid;
        const w = P(s.pid); if (w) w.score++;
        G.phase = 'result';
        sync();
        break;
      }
      case 'next':
        if (G.phase !== 'result' || !(amHost || amDet)) return;
        if (G.players.some(x => x.score >= G.goal)) { G.phase = 'gameover'; sync(); }
        else startRound();
        break;
      case 'lobby':
        if (amHost && G.phase === 'gameover') {
          G.players = G.players.filter(x => x.connected);
          G.players.forEach(x => { x.score = 0; x.hand = emptyHand(); x.alibi = null; });
          G.phase = 'lobby'; sync();
        }
        break;
    }
  }

  function viewFor(pid) {
    const me = P(pid), ph = G.phase;
    const open = ph === 'judging' || ph === 'result';
    return {
      code: G.code, phase: ph, goal: G.goal, round: G.round,
      you: pid, hostPid: G.hostPid, detPid: G.detPid, winnerPid: G.winnerPid, crime: G.crime,
      players: G.players.map(p => ({ pid: p.pid, name: p.name, score: p.score, connected: p.connected, done: !!p.alibi })),
      hand: me ? me.hand : emptyHand(),
      mine: me ? me.alibi : null,
      table: open ? G.table.map(s => ({ cards: s.cards, pid: ph === 'result' ? s.pid : null })) : null
    };
  }

  function sync() {
    G.players.forEach(p => {
      if (p.conn && p.conn.open) { try { p.conn.send({ t: 'state', v: viewFor(p.pid) }); } catch (e) {} }
    });
    view = viewFor(myPid);
    render();
  }

  function toastAll(text) {
    G.players.forEach(p => { if (p.conn && p.conn.open) { try { p.conn.send({ t: 'toast', text }); } catch (e) {} } });
    toast(text);
  }

  /* ---------------- GUEST ---------------- */
  function joinRoom(code) {
    isHost = false; roomCode = code;
    busy = 'Joining ' + code + '…'; render();
    peer = new Peer();
    joinTimer = setTimeout(() => joinFail('Could not find that room. Check the code and make sure the host still has the game open.'), 15000);
    peer.on('open', () => connectHost());
    peer.on('error', err => {
      if (err.type === 'peer-unavailable') {
        if (view) { lost = true; render(); }
        else joinFail('No room with that code. Check it and try again.');
      } else if (!view) joinFail('Connection problem. Check your internet and try again.');
    });
    peer.on('disconnected', () => { if (peer && !peer.destroyed) peer.reconnect(); });
  }

  function connectHost() {
    const conn = peer.connect(PREFIX + roomCode, { reliable: true });
    hostConn = conn;
    conn.on('open', () => conn.send({ t: 'join', pid: myPid, name: myName }));
    conn.on('data', msg => {
      if (!msg || conn !== hostConn) return;
      if (msg.t === 'state') {
        clearTimeout(joinTimer); busy = ''; lost = false;
        if (!view) setRoomUrl(roomCode);
        view = msg.v; render();
      } else if (msg.t === 'toast') toast(msg.text);
      else if (msg.t === 'full') joinFail('That room is full.');
    });
    conn.on('close', () => { if (conn === hostConn && view) { lost = true; render(); } });
  }

  function joinFail(text) {
    clearTimeout(joinTimer);
    if (peer) { try { peer.destroy(); } catch (e) {} }
    peer = null; hostConn = null; view = null; busy = ''; homeErr = text;
    render();
  }

  function act(msg) {
    if (isHost) handle(myPid, msg);
    else if (hostConn && hostConn.open) hostConn.send(msg);
  }

  /* ---------------- RENDERING ---------------- */
  function setRoomUrl(code) {
    try { history.replaceState(null, '', location.pathname + '?room=' + code); } catch (e) {}
  }
  const shareUrl = () => location.origin + location.pathname + '?room=' + view.code;

  let toastTimer = null;
  function toast(text) {
    $toast.textContent = text; $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove('show'), 3500);
  }

  // "I was with [who], [what] [where]."  Missing parts show as gaps.
  function stmtHTML(cards) {
    const part = (i) => cards[i] !== undefined && cards[i] !== null
      ? '<b class="' + TYPES[i] + '">' + esc(cards[i]) + '</b>' : '<span class="gap"></span>';
    return '<p class="stmt">“I was with ' + part(0) + ', ' + part(1) + ' ' + part(2) + '.”</p>';
  }

  function render() {
    if (!view) { $app.innerHTML = homeHTML(); return; }
    const key = view.round + ':' + view.phase;
    if (key !== selKey) { selKey = key; sel = {}; pickIdx = null; }
    let html = view.phase === 'lobby' ? lobbyHTML() : view.phase === 'gameover' ? overHTML() : gameHTML();
    if (lost) {
      html += '<div class="overlay"><div class="dialog"><h2>Connection lost</h2>' +
        '<p>The link to the host dropped. If the host closed the game, the room is gone.</p>' +
        '<div class="row"><button class="btn primary" data-act="reconnect">Try to reconnect</button>' +
        '<button class="btn" data-act="leave">Leave</button></div></div></div>';
    }
    $app.innerHTML = html;
  }

  function homeHTML() {
    const dis = busy ? ' disabled' : '';
    return '<main class="home">' +
      '<h1 class="logo">Likely<br>Story<i>.</i></h1>' +
      '<p class="tag">A crime has been committed. Your alibi is worse.</p>' +
      '<label class="field"><span>Your name</span>' +
      '<input id="name" maxlength="16" autocomplete="off" placeholder="e.g. Gary" value="' + esc(myName) + '"' + dis + '></label>' +
      '<button class="btn primary big" data-act="create"' + dis + '>Create a room</button>' +
      '<div class="or"><span>or join with a code</span></div>' +
      '<div class="joinrow"><input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" value="' + esc(roomCode) + '"' + dis + '>' +
      '<button class="btn big" data-act="join"' + dis + '>Join</button></div>' +
      (busy ? '<p class="note">' + esc(busy) + '</p>' : '') +
      (homeErr ? '<p class="err">' + esc(homeErr) + '</p>' : '') +
      '<ol class="how"><li>Each round, one player is the detective and a crime is read out.</li>' +
      '<li>Everyone else is a suspect and builds an alibi from three cards: who they were with, what they were doing, and where.</li>' +
      '<li>The detective reads the alibis and lets one suspect walk. That suspect scores.</li></ol>' +
      '<p class="fine">' + MIN_PLAYERS + ' to ' + MAX_PLAYERS + ' players, each on their own phone or laptop. Adult humour, 18+.</p>' +
      '</main>';
  }

  function lobbyHTML() {
    const v = view, amHost = v.you === v.hostPid, n = v.players.length;
    const goals = [3, 5, 7, 10].map(g => '<option value="' + g + '"' + (g === v.goal ? ' selected' : '') + '>' + g + ' points</option>').join('');
    return '<main class="lobby">' +
      '<p class="eyebrow">Room code</p>' +
      '<div class="code">' + esc(v.code) + '</div>' +
      '<button class="btn small" data-act="copy">Copy invite link</button>' +
      '<h2>Suspects <span class="dim">' + n + '/' + MAX_PLAYERS + '</span></h2>' +
      '<ul class="plist">' + v.players.map(p =>
        '<li>' + esc(p.name) + (p.pid === v.hostPid ? ' <em>host</em>' : '') + (p.pid === v.you ? ' <em>you</em>' : '') + '</li>').join('') + '</ul>' +
      (amHost
        ? '<label class="field inline"><span>First to</span><select id="goal">' + goals + '</select></label>' +
          '<button class="btn primary big" data-act="start"' + (n < MIN_PLAYERS ? ' disabled' : '') + '>' +
          (n < MIN_PLAYERS ? 'Need ' + (MIN_PLAYERS - n) + ' more player' + (MIN_PLAYERS - n > 1 ? 's' : '') : 'Start game') + '</button>' +
          '<p class="fine">Keep this tab open. You are hosting, so the room closes if you leave.</p>'
        : '<p class="note">Waiting for the host to start. First to ' + v.goal + ' points wins.</p>') +
      '</main>';
  }

  function scoresHTML() {
    const v = view;
    return '<ul class="scores">' + v.players.map(p => {
      const det = p.pid === v.detPid;
      const mark = det ? 'detective' : (v.phase === 'alibi' && p.done ? '✓' : '');
      return '<li class="' + (det ? 'det ' : '') + (p.connected ? '' : 'off ') + (p.pid === v.you ? 'me' : '') + '">' +
        '<span class="nm">' + esc(p.name) + '</span>' +
        (mark ? '<span class="mk">' + mark + '</span>' : '') +
        '<b>' + p.score + '</b></li>';
    }).join('') + '</ul>';
  }

  function gameHTML() {
    const v = view, ph = v.phase;
    const amDet = v.you === v.detPid, amHost = v.you === v.hostPid;
    const name = pid => { const p = v.players.find(x => x.pid === pid); return p ? p.name : 'Someone'; };
    const det = esc(name(v.detPid));
    const waiting = v.players.filter(p => p.connected && p.pid !== v.detPid && !p.done).length;
    const more = waiting + ' more suspect' + (waiting === 1 ? '' : 's');
    let status = '', body = '', action = '';

    if (ph === 'alibi') {
      if (amDet) {
        status = 'You are the detective. The suspects are getting their stories straight. Waiting on ' + more + '.';
        body = '<div class="backs">' + v.players.filter(p => p.pid !== v.detPid && p.done).map(() => '<div></div>').join('') + '</div>';
      } else if (v.mine) {
        status = 'Statement signed. Waiting on ' + more + '.';
        body = stmtHTML(v.mine);
      } else {
        status = 'Build your alibi. Pick one card from each row.';
        body = stmtHTML(TYPES.map(k => sel[k] !== undefined ? v.hand[k][sel[k]] : null)) +
          TYPES.map(k => '<p class="lbl ' + k + '">' + LABEL[k] + '</p><div class="grid">' +
            v.hand[k].map((c, i) => '<button class="card ' + k + (sel[k] === i ? ' sel' : '') + '" data-act="sel" data-k="' + k + '" data-i="' + i + '">' + esc(c) + '</button>').join('') +
            '</div>').join('');
        action = '<button class="btn primary big" data-act="submit"' + (TYPES.every(k => sel[k] !== undefined) ? '' : ' disabled') + '>Swear to it</button>';
      }
    } else {
      const result = ph === 'result';
      if (result) {
        status = det + ' believes ' + esc(name(v.winnerPid)) + '. Somehow.';
        action = (amDet || amHost)
          ? '<button class="btn primary big" data-act="next">Next case</button>'
          : '<p class="note">Waiting for ' + det + ' to continue.</p>';
      } else if (amDet) {
        status = 'Read the alibis out loud, detective. Then let one suspect walk.';
        action = '<button class="btn primary big" data-act="confirm"' + (pickIdx === null ? ' disabled' : '') + '>Free to go</button>';
      } else {
        status = det + ' is reviewing the statements.';
      }
      body = '<div class="subs">' + v.table.map((s, i) => {
        const cls = 'sub' + (result && s.pid === v.winnerPid ? ' win' : '') + (!result && pickIdx === i ? ' sel' : '');
        const inner = (result ? '<div class="who-said">' + esc(name(s.pid)) + '</div>' : '') + stmtHTML(s.cards);
        return (!result && amDet)
          ? '<button class="' + cls + '" data-act="pick" data-i="' + i + '">' + inner + '</button>'
          : '<div class="' + cls + '">' + inner + '</div>';
      }).join('') + '</div>';
    }

    return '<header class="bar"><span>Room <b>' + esc(v.code) + '</b></span><span>Case ' + v.round + '</span><span>First to ' + v.goal + '</span></header>' +
      scoresHTML() +
      '<main class="table">' +
      '<section class="prompt"><div class="case"><p class="no">Case file #' + v.round + '</p><h2>' + esc(v.crime) + '</h2>' +
      '<p class="ask">Where were you last night?</p></div></section>' +
      '<section class="play"><p class="status">' + status + '</p>' + body + '<div class="action">' + action + '</div></section>' +
      '</main>';
  }

  function overHTML() {
    const v = view, amHost = v.you === v.hostPid;
    const ranked = v.players.slice().sort((a, b) => b.score - a.score);
    return '<main class="lobby">' +
      '<p class="eyebrow">Case closed</p>' +
      '<div class="code small">' + esc(ranked[0].name) + ' gets away with it</div>' +
      '<ul class="plist rank">' + ranked.map((p, i) =>
        '<li><span>' + (i + 1) + '. ' + esc(p.name) + '</span><b>' + p.score + '</b></li>').join('') + '</ul>' +
      (amHost
        ? '<button class="btn primary big" data-act="start"' + (v.players.filter(p => p.connected).length < MIN_PLAYERS ? ' disabled' : '') + '>Play again</button>' +
          '<button class="btn" data-act="lobby">Back to lobby</button>'
        : '<p class="note">Waiting for the host to start another game.</p>') +
      '</main>';
  }

  /* ---------------- EVENTS ---------------- */
  function readName() {
    myName = myName.trim().slice(0, 16);
    if (!myName) { homeErr = 'Pick a name first.'; render(); return false; }
    save('localStorage', 'ls_name', myName);
    homeErr = '';
    return true;
  }

  $app.addEventListener('input', e => {
    if (e.target.id === 'name') myName = e.target.value;
    if (e.target.id === 'code') { roomCode = cleanCode(e.target.value); e.target.value = roomCode; }
  });
  $app.addEventListener('change', e => {
    if (e.target.id === 'goal') act({ t: 'goal', goal: e.target.value });
  });
  $app.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'code') go('join');
  });
  $app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el && !el.disabled) go(el.dataset.act, el);
  });

  function go(a, el) {
    const i = el && el.dataset.i !== undefined ? parseInt(el.dataset.i, 10) : null;
    switch (a) {
      case 'create':
        if (typeof Peer === 'undefined') { homeErr = 'The connection library did not load. Refresh the page.'; render(); return; }
        if (readName()) createRoom();
        break;
      case 'join':
        if (typeof Peer === 'undefined') { homeErr = 'The connection library did not load. Refresh the page.'; render(); return; }
        if (!readName()) return;
        if (roomCode.length !== 5) { homeErr = 'Room codes are 5 letters.'; render(); return; }
        joinRoom(roomCode);
        break;
      case 'copy': {
        const url = shareUrl();
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => toast('Invite link copied.'), () => prompt('Copy this link:', url));
        else prompt('Copy this link:', url);
        break;
      }
      case 'start': act({ t: 'start' }); break;
      case 'lobby': act({ t: 'lobby' }); break;
      case 'sel': {
        const k = el.dataset.k;
        if (sel[k] === i) delete sel[k]; else sel[k] = i;
        render();
        break;
      }
      case 'submit':
        if (TYPES.every(k => sel[k] !== undefined)) {
          const cards = {};
          TYPES.forEach(k => { cards[k] = view.hand[k][sel[k]]; });
          act({ t: 'alibi', cards });
        }
        break;
      case 'pick': pickIdx = i; render(); break;
      case 'confirm': if (pickIdx !== null) act({ t: 'pick', i: pickIdx }); break;
      case 'next': act({ t: 'next' }); break;
      case 'reconnect':
        toast('Reconnecting…');
        if (peer && peer.disconnected && !peer.destroyed) peer.reconnect();
        if (peer && !peer.destroyed) connectHost();
        break;
      case 'leave': location.href = location.pathname; break;
    }
  }

  window.addEventListener('beforeunload', e => {
    if (isHost && G && G.players.length > 1) { e.preventDefault(); e.returnValue = ''; }
  });

  render();
})();
</script>
</body>
</html>
